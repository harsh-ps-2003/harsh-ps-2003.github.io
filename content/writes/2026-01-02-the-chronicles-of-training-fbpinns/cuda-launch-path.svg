<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">How a kernel launch reaches an SM</title>
  <desc id="desc">How a kernel launch reaches the SMs through the pushbuffer, GPFIFO, USERD, and the doorbell register, how pinned copies use the copy engines, and NVIDIA's V100 launch overhead numbers with and without a CUDA graph.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">How a launch reaches an SM</text>
  <text class="s" x="24" y="64">A launch is a few writes plus a doorbell. A graph batches them into one CPU call.</text>
  <path d="M 24.0 86.0 Q 184.0 82.3 344.0 86.0 Q 347.4 123.0 344.0 160.0 Q 184.0 163.6 24.0 160.0 Q 20.3 123.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">pushbuffer</text>
  <text class="b" x="42.0" y="140.0">the driver writes methods</text>
  <line x1="184.0" y1="168.0" x2="184.0" y2="198.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="187.0">then</text>
  <path d="M 24.0 206.0 Q 184.0 202.5 344.0 206.0 Q 347.5 243.0 344.0 280.0 Q 184.0 283.8 24.0 280.0 Q 20.5 243.0 24.0 206.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="232.0">doorbell</text>
  <text class="b" x="42.0" y="260.0">one MMIO write of the channel</text>
  <line x1="184.0" y1="288.0" x2="184.0" y2="318.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="307.0">the GPU fetches</text>
  <path d="M 24.0 326.0 Q 184.0 322.6 344.0 326.0 Q 347.7 363.0 344.0 400.0 Q 184.0 403.6 24.0 400.0 Q 20.5 363.0 24.0 326.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="352.0">an SM with room</text>
  <text class="b" x="42.0" y="380.0">the front end drops a block there</text>
  <path d="M 376.0 86.0 Q 536.0 82.6 696.0 86.0 Q 699.6 193.0 696.0 300.0 Q 536.0 303.7 376.0 300.0 Q 372.6 193.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">copies, then the V100 times</text>
  <text class="b" x="394.0" y="140.0">pageable memory needs staging</text>
  <text class="b" x="394.0" y="168.0">pinned memory uses a copy engine</text>
  <text class="b" x="394.0" y="196.0">overlap needs another stream</text>
  <text class="b" x="394.0" y="224.0">sync each kernel, ~9.6 µs</text>
  <text class="b" x="394.0" y="252.0">a CUDA graph, ~3.4 µs</text>
  <text class="b" x="394.0" y="280.0">on V100 the graph still grows</text>
</svg>
