<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Many small networks, one smooth answer</title>
  <desc id="desc">The FBPINN architecture, where overlapping subdomains each get a small network, inputs are normalised per subdomain, outputs are blended by smooth windows that sum to one and constrained into one solution, with the loss, the scheduler, and the multilevel version.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">Many small nets, one answer</text>
  <text class="s" x="24" y="64">Each subdomain gets a tiny network. Windows blend them into one solution.</text>
  <path d="M 24.0 86.0 Q 184.0 82.4 344.0 86.0 Q 347.7 123.0 344.0 160.0 Q 184.0 163.4 24.0 160.0 Q 20.4 123.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">norm</text>
  <text class="b" x="42.0" y="140.0">map the subdomain onto [-1, 1]</text>
  <line x1="184.0" y1="168.0" x2="184.0" y2="198.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="187.0">into</text>
  <path d="M 24.0 206.0 Q 184.0 202.5 344.0 206.0 Q 347.8 243.0 344.0 280.0 Q 184.0 283.5 24.0 280.0 Q 20.5 243.0 24.0 206.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="232.0">a small tanh net</text>
  <text class="b" x="42.0" y="260.0">2×16 in 2023, 1×16 later</text>
  <line x1="184.0" y1="288.0" x2="184.0" y2="318.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="307.0">times the window</text>
  <path d="M 24.0 326.0 Q 184.0 322.3 344.0 326.0 Q 347.6 377.0 344.0 428.0 Q 184.0 431.4 24.0 428.0 Q 20.3 377.0 24.0 326.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="352.0">sum, then the constraint</text>
  <text class="b" x="42.0" y="380.0">windows already sum to 1</text>
  <text class="b" x="42.0" y="408.0">hard boundary conditions come last</text>
  <path d="M 376.0 86.0 Q 536.0 82.4 696.0 86.0 Q 699.7 193.0 696.0 300.0 Q 536.0 303.4 376.0 300.0 Q 372.4 193.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">loss, then levels</text>
  <text class="b" x="394.0" y="140.0">PDE residual, by autodiff</text>
  <text class="b" x="394.0" y="168.0">no extra interface terms</text>
  <text class="b" x="394.0" y="196.0">learning moves outward</text>
  <text class="b" x="394.0" y="224.0">active, then frozen neighbours</text>
  <text class="b" x="394.0" y="252.0">each level is its own blend</text>
  <text class="b" x="394.0" y="280.0">one level is the plain FBPINN</text>
</svg>
