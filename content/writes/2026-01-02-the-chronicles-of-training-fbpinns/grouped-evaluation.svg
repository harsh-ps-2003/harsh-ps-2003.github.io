<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 576" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Gather, vmap, segment_sum</title>
  <desc id="desc">Grouped evaluation in four steps, gather the points inside each subdomain, vmap every network at once, segment_sum the pieces back per point, and divide by the summed windows, with the memory of a dense layout next to x_batch.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">Gather, vmap, segment_sum</text>
  <text class="s" x="24" y="64">A point only meets the subdomains that hold it. A scatter-add puts the pieces back.</text>
  <path d="M 24.0 86.0 Q 184.0 82.3 344.0 86.0 Q 347.6 123.0 344.0 160.0 Q 184.0 163.5 24.0 160.0 Q 20.3 123.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">gather</text>
  <text class="b" x="42.0" y="140.0">points inside that subdomain</text>
  <line x1="184.0" y1="168.0" x2="184.0" y2="198.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="187.0">then</text>
  <path d="M 24.0 206.0 Q 184.0 202.4 344.0 206.0 Q 347.7 243.0 344.0 280.0 Q 184.0 283.4 24.0 280.0 Q 20.4 243.0 24.0 206.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="232.0">vmap</text>
  <text class="b" x="42.0" y="260.0">all 75 nets in one pass</text>
  <line x1="184.0" y1="288.0" x2="184.0" y2="318.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="307.0">then</text>
  <path d="M 24.0 326.0 Q 184.0 322.2 344.0 326.0 Q 347.5 363.0 344.0 400.0 Q 184.0 403.5 24.0 400.0 Q 20.2 363.0 24.0 326.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="352.0">segment_sum</text>
  <text class="b" x="42.0" y="380.0">add the pieces back per point</text>
  <line x1="184.0" y1="408.0" x2="184.0" y2="438.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="427.0">then</text>
  <path d="M 24.0 446.0 Q 184.0 442.4 344.0 446.0 Q 347.5 483.0 344.0 520.0 Q 184.0 523.7 24.0 520.0 Q 20.4 483.0 24.0 446.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="472.0">divide</text>
  <text class="b" x="42.0" y="500.0">by the windows, then the loss</text>
  <path d="M 376.0 86.0 Q 536.0 82.3 696.0 86.0 Q 699.6 193.0 696.0 300.0 Q 536.0 303.5 376.0 300.0 Q 372.3 193.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">what you would store</text>
  <text class="b" x="394.0" y="140.0">a dense copy is ~236 MB</text>
  <text class="b" x="394.0" y="168.0">x_batch itself is ~3 MB</text>
  <text class="b" x="394.0" y="196.0">naive: points × subdomains</text>
  <text class="b" x="394.0" y="224.0">grouped: points × overlap</text>
  <text class="b" x="394.0" y="252.0">the repo stores flat pairs</text>
  <text class="b" x="394.0" y="280.0">that list has no padding</text>
</svg>
