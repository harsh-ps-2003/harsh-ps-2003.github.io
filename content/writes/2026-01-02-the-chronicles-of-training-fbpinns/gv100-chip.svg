<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">80 SMs around one L2</title>
  <desc id="desc">The GV100 chip, with a PCIe host interface and GigaThread engine on top, six GPCs of 7 TPCs and 2 SMs each around a shared 6 MB L2, eight memory controllers feeding four HBM2 stacks, and six NVLink ports under a high-speed hub, next to the V100 SXM2 numbers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">80 SMs around one L2</text>
  <text class="s" x="24" y="64">Every SM shares one 6 MB L2. HBM2 is on the sides. NVLink and PCIe are on the edges.</text>
  <path d="M 24.0 86.0 Q 360.0 82.4 696.0 86.0 Q 699.7 137.0 696.0 188.0 Q 360.0 191.5 24.0 188.0 Q 20.4 137.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">the die</text>
  <text class="b" x="42.0" y="140.0">6 GPCs, 80 of 84 SMs, one shared 6 MB L2</text>
  <text class="b" x="42.0" y="168.0">4 HBM2 stacks, 6 NVLink, PCIe 3.0</text>
  <line x1="360.0" y1="196.0" x2="360.0" y2="226.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="374.0" y="215.0">off an SM</text>
  <path d="M 24.0 234.0 Q 360.0 230.4 696.0 234.0 Q 699.7 299.0 696.0 364.0 Q 360.0 367.5 24.0 364.0 Q 20.4 299.0 24.0 234.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="260.0">three exits, both directions counted</text>
  <text class="b" x="42.0" y="288.0">L2 then HBM2, about 900 GB/s</text>
  <text class="b" x="42.0" y="316.0">the hub then NVLink, 300 GB/s</text>
  <text class="b" x="42.0" y="344.0">the host interface then PCIe, about 32 GB/s</text>
</svg>
