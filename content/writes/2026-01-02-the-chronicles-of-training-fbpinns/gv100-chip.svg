<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">GV100, 80 SMs around one L2</title>
  <desc id="desc">The GV100 chip has a PCI Express 3.0 host interface and the GigaThread engine on top, six GPCs in two rows of three with the shared 6 MB L2 cache between the rows, each GPC holding 7 TPCs of 2 SMs for 84 SMs in the full chip and 80 enabled on V100, eight 512-bit memory controllers feeding four HBM2 stacks on the sides, and a high-speed hub with six NVLink ports at the bottom. A side panel lists the V100 SXM2 numbers, and the bottom panel shows that HBM2, NVLink, and PCIe traffic all pass through L2, at about 900, 300, and 32 GB/s.</desc>
