<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Fitting in 6 MB of L2</title>
  <desc id="desc">The V100 memory levels from closest to furthest from the cores, registers at 256 KB per SM, L1 and shared memory at 128 KB per SM, a 6 MB L2 shared by all 80 SMs, 16 or 32 GB of HBM2 at about 900 GB/s, a peer GPU over NVLink at up to 300 GB/s total, and host DRAM over PCIe at about 16 GB/s each way. On the right, the post's own estimates show a 10 thousand point residual batch and all 75 subdomains' parameters going over the 6 MB L2 line, while 2,048 point chunks and 20 subdomains at a time stay under it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">Fitting in 6 MB of L2</text>
  <text class="s" x="24" y="64">Each step away from the cores is slower, so the hot data stays under that line.</text>
  <path d="M 24.0 86.0 Q 184.0 82.4 344.0 86.0 Q 347.7 137.0 344.0 188.0 Q 184.0 191.4 24.0 188.0 Q 20.4 137.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">on the SM</text>
  <text class="b" x="42.0" y="140.0">registers, 256 KB</text>
  <text class="b" x="42.0" y="168.0">L1 and shared memory, 128 KB</text>
  <line x1="184.0" y1="196.0" x2="184.0" y2="226.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="215.0">slower</text>
  <path d="M 24.0 234.0 Q 184.0 230.4 344.0 234.0 Q 347.7 271.0 344.0 308.0 Q 184.0 311.4 24.0 308.0 Q 20.4 271.0 24.0 234.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="260.0">one L2, 6 MB</text>
  <text class="b" x="42.0" y="288.0">shared by all 80 SMs</text>
  <line x1="184.0" y1="316.0" x2="184.0" y2="346.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="198.0" y="335.0">slower</text>
  <path d="M 24.0 354.0 Q 184.0 350.5 344.0 354.0 Q 347.8 391.0 344.0 428.0 Q 184.0 431.5 24.0 428.0 Q 20.5 391.0 24.0 354.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="380.0">off the chip</text>
  <text class="b" x="42.0" y="408.0">HBM2, then NVLink, then host DRAM</text>
  <path d="M 376.0 86.0 Q 536.0 82.4 696.0 86.0 Q 699.7 193.0 696.0 300.0 Q 536.0 303.5 376.0 300.0 Q 372.4 193.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">the post stays under L2</text>
  <text class="b" x="394.0" y="140.0">10k points goes over 6 MB</text>
  <text class="b" x="394.0" y="168.0">2048-point chunks stay under</text>
  <text class="b" x="394.0" y="196.0">75 subdomains, about 15 MB</text>
  <text class="b" x="394.0" y="224.0">20 at a time, about 4 MB</text>
  <text class="b" x="394.0" y="252.0">registers total about 20 MB</text>
  <text class="b" x="394.0" y="280.0">that is more than 3× the L2</text>
</svg>
