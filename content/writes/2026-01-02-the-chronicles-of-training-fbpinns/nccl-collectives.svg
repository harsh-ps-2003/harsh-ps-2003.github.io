<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">What each rank holds, before and after</title>
  <desc id="desc">What each of four ranks holds before and after AllReduce, Broadcast, Reduce, AllGather, ReduceScatter, AlltoAll, and send and recv, with the JAX primitive for each and a ring AllReduce worked through step by step.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">What each rank holds</text>
  <text class="s" x="24" y="64">Four ranks. The JAX name is the call it lowers to, when one exists.</text>
  <path d="M 24.0 86.0 Q 184.0 82.4 344.0 86.0 Q 347.4 207.0 344.0 328.0 Q 184.0 331.7 24.0 328.0 Q 20.4 207.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">the collectives</text>
  <text class="b" x="42.0" y="140.0">AllReduce, psum, full sum</text>
  <text class="b" x="42.0" y="168.0">Broadcast, root copied out</text>
  <text class="b" x="42.0" y="196.0">Reduce, only the root keeps it</text>
  <text class="b" x="42.0" y="224.0">AllGather, blocks in order</text>
  <text class="b" x="42.0" y="252.0">ReduceScatter, keep block i</text>
  <text class="b" x="42.0" y="280.0">AlltoAll, chunk j to rank j</text>
  <text class="b" x="42.0" y="308.0">Send/Recv, next and previous</text>
  <path d="M 376.0 86.0 Q 536.0 82.4 696.0 86.0 Q 699.4 123.0 696.0 160.0 Q 536.0 163.7 376.0 160.0 Q 372.4 123.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">each rank sends its chunk</text>
  <text class="b" x="394.0" y="140.0">to the next rank on the ring</text>
  <line x1="536.0" y1="168.0" x2="536.0" y2="198.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="550.0" y="187.0">2(n−1) steps</text>
  <path d="M 376.0 206.0 Q 536.0 202.5 696.0 206.0 Q 699.6 257.0 696.0 308.0 Q 536.0 311.7 376.0 308.0 Q 372.6 257.0 376.0 206.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="232.0">every rank holds the sum</text>
  <text class="b" x="394.0" y="260.0">n = 2, so each sends half twice</text>
  <text class="b" x="394.0" y="288.0">bus bandwidth equals alg bandwidth</text>
</svg>
