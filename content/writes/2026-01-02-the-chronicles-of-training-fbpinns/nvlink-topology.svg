<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Know which GPUs are actually neighbours</title>
  <desc id="desc">The DGX-1 V100 NVLink hybrid cube-mesh, where every GPU has 6 links but some pairs share 2 links, some share 1, and some share none, next to its PCIe tree of 2 CPUs, 4 PCIe switches and 4 InfiniBand NICs. Below it the post's 2-GPU node with its NV# link bundle, the nvidia-smi topo -m legend ranked from fastest to slowest, and the order in which NCCL tries transports, P2P then SHM then NET.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">Which GPUs are neighbours</text>
  <text class="s" x="24" y="64">Every V100 has 6 NVLinks. On a DGX-1 some pairs get 2, some 1, and some none.</text>
  <path d="M 24.0 86.0 Q 170.0 82.6 316.0 86.0 Q 319.7 179.0 316.0 272.0 Q 170.0 275.6 24.0 272.0 Q 20.6 179.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">DGX-1 V100 mesh</text>
  <text class="b" x="42.0" y="140.0">8 GPUs, 6 links each</text>
  <text class="b" x="42.0" y="168.0">some pairs share 2 links</text>
  <text class="b" x="42.0" y="196.0">some share 1 link</text>
  <text class="b" x="42.0" y="224.0">GPU0 and GPU7 share none</text>
  <text class="b" x="42.0" y="252.0">NVSwitch makes every pair 1 hop</text>
  <path d="M 404.0 86.0 Q 550.0 82.4 696.0 86.0 Q 699.7 123.0 696.0 160.0 Q 550.0 163.4 404.0 160.0 Q 400.3 123.0 404.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="422.0" y="112.0">P2P</text>
  <text class="b" x="422.0" y="140.0">GPU memory, if a link exists</text>
  <line x1="550.0" y1="168.0" x2="550.0" y2="198.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="564.0" y="187.0">else</text>
  <path d="M 404.0 206.0 Q 550.0 202.3 696.0 206.0 Q 699.5 243.0 696.0 280.0 Q 550.0 283.6 404.0 280.0 Q 400.3 243.0 404.0 206.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="422.0" y="232.0">shared memory</text>
  <text class="b" x="422.0" y="260.0">stage the bytes through the host</text>
  <line x1="550.0" y1="288.0" x2="550.0" y2="318.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="564.0" y="307.0">then</text>
  <path d="M 404.0 326.0 Q 550.0 322.3 696.0 326.0 Q 699.6 363.0 696.0 400.0 Q 550.0 403.5 404.0 400.0 Q 400.3 363.0 404.0 326.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="422.0" y="352.0">the NIC</text>
  <text class="b" x="422.0" y="380.0">IB or sockets. IB is off here</text>
  <line x1="322.0" y1="151.0" x2="394.0" y2="151.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="360.0" y="141.0" text-anchor="middle">a link</text>
</svg>
