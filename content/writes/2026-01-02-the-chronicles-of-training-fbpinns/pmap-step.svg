<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">100 steps per trip from Python</title>
  <desc id="desc">One pmap call running 10 outer scan blocks of 10 inner gradient accumulation steps on each V100, with a psum over NVLink in every forward pass and one optax update per block, so the host dispatches once instead of 100 times.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">100 steps per trip from Python</text>
  <text class="s" x="24" y="64">One dispatch runs both GPUs. Every forward pass all-reduces over NVLink.</text>
  <path d="M 24.0 86.0 Q 360.0 82.3 696.0 86.0 Q 699.4 137.0 696.0 188.0 Q 360.0 191.6 24.0 188.0 Q 20.3 137.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">the host calls update_pmap once</text>
  <text class="b" x="42.0" y="140.0">10 outer blocks, 10 inner steps, one optax update</text>
  <text class="b" x="42.0" y="168.0">a Python loop would have dispatched 100 times</text>
  <path d="M 24.0 224.0 Q 170.0 220.3 316.0 224.0 Q 319.6 275.0 316.0 326.0 Q 170.0 329.5 24.0 326.0 Q 20.2 275.0 24.0 224.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="250.0">GPU0</text>
  <text class="b" x="42.0" y="278.0">subdomains 1 to 37</text>
  <text class="b" x="42.0" y="306.0">local math on its own HBM2</text>
  <path d="M 404.0 224.0 Q 550.0 220.4 696.0 224.0 Q 699.5 275.0 696.0 326.0 Q 550.0 329.7 404.0 326.0 Q 400.4 275.0 404.0 224.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="422.0" y="250.0">GPU1</text>
  <text class="b" x="422.0" y="278.0">subdomains 38 to 75</text>
  <text class="b" x="422.0" y="306.0">same program, the other half</text>
  <line x1="322.0" y1="275.0" x2="394.0" y2="275.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="360.0" y="265.0" text-anchor="middle">NVLink</text>
  <line x1="360" y1="194.0" x2="360" y2="216.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="374" y="209.0">psum every forward</text>
</svg>
