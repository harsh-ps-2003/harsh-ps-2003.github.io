    .g1 { fill: #e2f2e6; stroke: #5ea876; stroke-width: .75; }
    .seam { stroke: #ff5f1f; stroke-width: 1.25; }
    .sn { font-size: 10px; fill: #5c5c6e; text-anchor: middle; }
    .gpu0 { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1.25; }
    .gpu1 { fill: #e2f2e6; stroke: #5ea876; stroke-width: 1.25; }
    .mem { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1; }
    .acc { fill: #ffede4; stroke: #ff5f1f; stroke-width: 1.5; }
    .host { fill: #e9e9ef; stroke: #a3a3b3; stroke-width: 1; }
    .ln { stroke: #232333; stroke-width: 1.25; fill: none; }
    .n { fill: #ff5f1f; }
    .nt { fill: #ffffff; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
  </style>

  <text class="k" x="16" y="22">TOPOLOGY-AWARE SHARDING</text>
  <text class="t" x="16" y="42">Chatty neighbours share a GPU</text>
  <text class="c" x="16" y="60">Each GPU keeps a solid block of subdomains, so only the seam between the blocks crosses NVLink.</text>

