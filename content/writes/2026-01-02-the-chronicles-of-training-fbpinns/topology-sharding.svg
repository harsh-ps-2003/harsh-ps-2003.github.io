<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Chatty neighbours share a GPU</title>
  <desc id="desc">75 subdomains split into a solid block per GPU so only the seam crosses NVLink, one training step with a halo exchange and a psum, and a ladder of where each kind of traffic belongs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">Chatty neighbours share a GPU</text>
  <text class="s" x="24" y="64">Each GPU keeps a solid block, so only the seam crosses NVLink.</text>
  <path d="M 24.0 86.0 Q 184.0 82.6 344.0 86.0 Q 347.7 137.0 344.0 188.0 Q 184.0 191.6 24.0 188.0 Q 20.5 137.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">GPU0</text>
  <text class="b" x="42.0" y="140.0">subdomains 1 to 37</text>
  <text class="b" x="42.0" y="168.0">local math on its own HBM2</text>
  <path d="M 376.0 86.0 Q 536.0 82.6 696.0 86.0 Q 699.7 137.0 696.0 188.0 Q 536.0 191.6 376.0 188.0 Q 372.6 137.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">GPU1</text>
  <text class="b" x="394.0" y="140.0">subdomains 38 to 75</text>
  <text class="b" x="394.0" y="168.0">same program, the other half</text>
  <line x1="350.0" y1="137.0" x2="366.0" y2="137.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 24.0 224.0 Q 360.0 220.5 696.0 224.0 Q 699.5 275.0 696.0 326.0 Q 360.0 329.8 24.0 326.0 Q 20.5 275.0 24.0 224.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="250.0">forward, residual, and grads stay on HBM2</text>
  <text class="b" x="42.0" y="278.0">only the seam crosses NVLink, no host copy</text>
  <text class="b" x="42.0" y="306.0">psum, then divide by the windows</text>
  <text class="m" x="24.0" y="398.0">HBM2 ~900 for the local work. NVLink up to 300 for the seam.</text>
  <line x1="360" y1="194.0" x2="360" y2="216.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="374" y="209.0">then one step</text>
</svg>
