  <circle class="n" cx="578" cy="111" r="7"/><text class="nt" x="578" y="114.5">1</text>
  <circle class="n" cx="394" cy="170" r="7"/><text class="nt" x="394" y="173.5">2</text>
  <circle class="n" cx="510" cy="154" r="7"/><text class="nt" x="510" y="157.5">3</text>
  <!-- psum -->
