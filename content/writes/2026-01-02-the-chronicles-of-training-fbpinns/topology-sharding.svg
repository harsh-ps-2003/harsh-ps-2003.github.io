  <line class="ln" x1="680" y1="190" x2="680" y2="216" marker-end="url(#a)"/>
  <rect class="acc" x="316" y="218" width="388" height="26" rx="4"/>
  <circle class="n" cx="330" cy="231" r="7"/><text class="nt" x="330" y="234.5">4</text>
  <text x="344" y="235"><tspan class="b">psum(u_sum, w_sum)</tspan> over "devices", all-reduce on NVLink</text>
  <line class="ln" x1="510" y1="244" x2="510" y2="256" marker-end="url(#a)"/>
  <rect x="316" y="258" width="388" height="26" rx="4" fill="#ffffff" stroke="#232333" stroke-width="1.25"/>
  <text x="326" y="275">u = u_sum / max(w_sum, 1e-5) on both, then C → û</text>

  <line x1="16" y1="300" x2="704" y2="300" stroke="#c3c3cf" stroke-width="1"/>

  <!-- ============ ladder ============ -->
  <text class="lane" x="16" y="318">WHERE EACH KIND OF TRAFFIC BELONGS · BOTH DIRECTIONS ADDED</text>
  <g>
    <text class="b" x="16" y="342">same GPU, HBM2</text>
    <rect class="mem" x="180" y="328" width="260" height="20" rx="2"/><text x="188" y="342">~900 GB/s</text>
    <text x="456" y="342">coupled subdomains, every kernel</text>

    <text class="b" x="16" y="368">peer GPU, NVLink</text>
    <rect class="acc" x="180" y="354" width="87" height="20" rx="2"/><text x="274" y="368">up to 300 GB/s</text>
    <text x="456" y="368">halo + psum, every step</text>

    <text class="b" x="16" y="394">host, PCIe Gen3 x16</text>
    <rect class="host" x="180" y="380" width="9" height="20" rx="2"/><text x="196" y="394">~32 GB/s, 16 each way</text>
    <text x="456" y="394">metrics, logs, checkpoints</text>

    <text class="b" x="16" y="420">other node, NIC</text>
    <rect x="180" y="406" width="9" height="20" rx="2" fill="#ece6f7" stroke="#9b86c9" stroke-dasharray="3 2"/><text x="196" y="420">IB, switched off in this run</text>
    <text x="456" y="420">multi-node runs only</text>
  </g>
  <text class="m" x="16" y="442">each rung down is several times slower, so keep the seam short and the load even</text>
</svg>
