  <text class="m" x="22" y="262">real subdomains overlap their neighbours,</text>
  <text class="m" x="22" y="276">the cells only show which GPU runs what</text>

  <!-- ============ one step ============ -->
  <text class="lane" x="316" y="88">ONE STEP ON 2× V100</text>
  <rect class="gpu0" x="316" y="98" width="180" height="92" rx="5"/>
  <text class="h" x="326" y="115">GPU0</text>
  <text class="m" x="326" y="133">subdomains 1 to 37</text>
  <text class="m" x="326" y="147">fwd, residual, grads, HBM2</text>
  <rect class="mem" x="404" y="158" width="84" height="24" rx="3"/><text x="446" y="174" text-anchor="middle" style="font-size:10px">halo buffer</text>
  <rect class="gpu1" x="524" y="98" width="180" height="92" rx="5"/>
  <text class="h" x="534" y="115">GPU1</text>
  <text class="m" x="534" y="133">subdomains 38 to 75</text>
  <text class="m" x="534" y="147">fwd, residual, grads, HBM2</text>
  <rect class="mem" x="532" y="158" width="84" height="24" rx="3"/><text x="574" y="174" text-anchor="middle" style="font-size:10px">halo buffer</text>
  <line x1="490" y1="170" x2="530" y2="170" stroke="#ff5f1f" stroke-width="2" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="510" y="207" text-anchor="middle" style="fill:#c2410c">seam data packed, NVLink P2P, no host copy</text>
  <!-- numbers -->
