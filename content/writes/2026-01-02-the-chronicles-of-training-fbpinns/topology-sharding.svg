<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Chatty neighbours share a GPU</title>
  <desc id="desc">The 75 subdomains of the post's 2D domain split into two solid blocks, 1 to 37 on GPU0 and 38 to 75 on GPU1, so only the seam between the blocks has overlaps that cross GPUs. Each step both GPUs do their local work in their own HBM2, pack the seam data into one buffer, swap it over NVLink peer to peer, and then psum u_sum and w_sum so both get the same global average. A ladder below compares HBM2, NVLink, PCIe and the network and says which traffic belongs on each.</desc>
