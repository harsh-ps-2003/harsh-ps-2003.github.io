<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">A V100 node, from DRAM to CUDA cores</title>
  <desc id="desc">A node with a CPU, DDR4 DRAM, a PCIe switch, a NIC, and two V100s joined by NVLink, with HBM2, L2, SMs, and CUDA cores marked, four numbered data paths, and the peak bandwidth of each link.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">From DRAM to the CUDA cores</text>
  <text class="s" x="24" y="64">Further from the SMs is slower. The CPU path is about 9× slower than NVLink.</text>
  <path d="M 24.0 86.0 Q 360.0 82.5 696.0 86.0 Q 699.8 137.0 696.0 188.0 Q 360.0 191.5 24.0 188.0 Q 20.4 137.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">host</text>
  <text class="b" x="42.0" y="140.0">DDR4 and the CPU running Python and JAX</text>
  <text class="b" x="42.0" y="168.0">PCIe Gen3 x16 toward each GPU</text>
  <path d="M 24.0 224.0 Q 170.0 220.6 316.0 224.0 Q 319.7 275.0 316.0 326.0 Q 170.0 329.7 24.0 326.0 Q 20.6 275.0 24.0 224.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="250.0">GPU0</text>
  <text class="b" x="42.0" y="278.0">80 SMs, 6 MB L2</text>
  <text class="b" x="42.0" y="306.0">16 or 32 GB HBM2, ~900 GB/s</text>
  <path d="M 404.0 224.0 Q 550.0 220.4 696.0 224.0 Q 699.7 275.0 696.0 326.0 Q 550.0 329.4 404.0 326.0 Q 400.3 275.0 404.0 224.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="422.0" y="250.0">GPU1</text>
  <text class="b" x="422.0" y="278.0">same chip, the other socket</text>
  <text class="b" x="422.0" y="306.0">a halo stays on NVLink</text>
  <line x1="322.0" y1="275.0" x2="394.0" y2="275.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="360.0" y="265.0" text-anchor="middle">NVLink</text>
  <line x1="360" y1="194.0" x2="360" y2="216.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="374" y="209.0">about 32 GB/s</text>
</svg>
