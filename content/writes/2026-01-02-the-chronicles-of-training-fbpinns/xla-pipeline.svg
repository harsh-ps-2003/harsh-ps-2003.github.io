<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">From a Python function to SASS</title>
  <desc id="desc">The JAX and XLA pipeline for one jitted function. jax.jit traces the Python function with abstract shapes and dtypes into a jaxpr, lowers it to StableHLO, and XLA compiles it, first with target independent passes like CSE, fusion and buffer analysis, then with the GPU backend that does GPU fusions, stream assignment, latency hiding scheduling, all-reduce combining and matching to cuBLAS, cuDNN and NCCL calls. Codegen goes through LLVM IR, NVPTX and PTX to SASS for sm_70, with a Triton emitter for matmul and softmax fusions. The runtime turns kernels and library calls into thunks and command buffers that run on CUDA streams on the V100. On the right, the in-memory and persistent compilation caches and the five XLA flags from the post, each tied to the stage it changes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; font-size: 10px; }
    .h { font-size: 11.5px; font-weight: 700; }
    .b { font-weight: 700; }
    .fl { font-size: 10px; font-weight: 700; }
    .sw { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .chip { fill: #ffffff; stroke: #a3a3b3; stroke-width: 1; }
    .gpu { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1.25; }
    .mem { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1.25; }
    .ln { stroke: #232333; stroke-width: 1.25; fill: none; }
    .br { stroke: #a3a3b3; stroke-width: 1.25; fill: none; }
    .n { fill: #ff5f1f; }
    .nt { fill: #ffffff; font-size: 9.5px; font-weight: 700; }
  </style>

  <text class="k" x="16" y="22">JAX → XLA</text>
  <text class="t" x="16" y="42">From a Python function to SASS</text>
  <text class="c" x="16" y="60">jit traces once per shape, XLA fuses and schedules, the GPU only sees kernels and library calls.</text>

  <!-- group brackets + rotated labels -->
  <polyline class="br" points="34,92 28,92 28,224 34,224"/>
  <text class="lane" transform="translate(22 158) rotate(-90)" text-anchor="middle">JAX</text>
  <polyline class="br" points="34,242 28,242 28,448 34,448"/>
  <text class="lane" transform="translate(22 345) rotate(-90)" text-anchor="middle">XLA COMPILER</text>
  <polyline class="br" points="34,466 28,466 28,554 34,554"/>
  <text class="lane" transform="translate(22 510) rotate(-90)" text-anchor="middle">RUNTIME</text>

  <!-- S1 python -->
  <rect class="sw" x="36" y="92" width="384" height="32" rx="4"/>
  <text class="h" x="46" y="112">Python function</text>
  <text class="m" x="176" y="112">@jax.jit  def update(params, x)</text>
  <line class="ln" x1="56" y1="124" x2="56" y2="140" marker-end="url(#a)"/>
  <text class="m" x="66" y="137">trace with abstract shapes and dtypes</text>

  <!-- S2 jaxpr -->
  <rect class="sw" x="36" y="142" width="384" height="32" rx="4"/>
  <text class="h" x="46" y="162">jaxpr</text>
  <text class="m" x="176" y="162">typed, functional, first-order</text>
  <line class="ln" x1="56" y1="174" x2="56" y2="190" marker-end="url(#a)"/>
  <text class="m" x="66" y="187">.lower()</text>

  <!-- S3 stablehlo -->
  <rect class="sw" x="36" y="192" width="384" height="32" rx="4"/>
  <text class="h" x="46" y="212">StableHLO</text>
  <text class="m" x="176" y="212">module @jit_update, stablehlo ops</text>
  <line class="ln" x1="56" y1="224" x2="56" y2="240" marker-end="url(#a)"/>
  <text class="m" x="66" y="237">.compile()</text>

  <!-- S4 HLO -->
  <rect class="sw" x="36" y="242" width="384" height="38" rx="4"/>
  <text class="h" x="46" y="258">XLA HLO</text>
  <text class="m" x="176" y="258">target-independent passes</text>
  <text x="46" y="273">CSE · fusion · buffer analysis</text>
  <line class="ln" x1="56" y1="280" x2="56" y2="296" marker-end="url(#a)"/>
  <text class="m" x="66" y="293">GPU target</text>

  <!-- S5 GPU backend -->
  <rect class="sw" x="36" y="298" width="384" height="62" rx="4"/>
  <text class="h" x="46" y="314">GPU backend</text>
  <text x="46" y="328">GPU fusions, 1 fusion = 1 kernel</text>
  <text x="46" y="341">stream assignment, latency hiding scheduler</text>
  <text x="46" y="354">all-reduce combiner, match to library calls</text>
  <circle class="n" cx="400" cy="337.5" r="7"/><text class="nt" x="400" y="341" text-anchor="middle">1</text>
  <circle class="n" cx="400" cy="350.5" r="7"/><text class="nt" x="400" y="354" text-anchor="middle">2</text>
  <line class="ln" x1="56" y1="360" x2="56" y2="376" marker-end="url(#a)"/>
  <text class="m" x="66" y="373">emit kernels</text>

  <!-- S6 codegen -->
  <rect class="sw" x="36" y="378" width="384" height="70" rx="4"/>
  <text class="h" x="46" y="393">codegen</text>
  <rect class="chip" x="44" y="400" width="120" height="42" rx="3"/>
  <text class="b" x="51" y="413">native emitters</text>
  <text class="m" x="51" y="425">LLVM IR, NVPTX</text>
  <text class="m" x="51" y="437">PTX, SASS sm_70</text>
  <circle class="n" cx="154" cy="433.5" r="7"/><text class="nt" x="154" y="437" text-anchor="middle">5</text>
  <rect class="chip" x="170" y="400" width="120" height="42" rx="3"/>
  <text class="b" x="177" y="413">Triton emitter</text>
  <text class="m" x="177" y="425">matmul, softmax</text>
  <text class="m" x="177" y="437">fusions, to PTX</text>
  <circle class="n" cx="280" cy="433.5" r="7"/><text class="nt" x="280" y="437" text-anchor="middle">3</text>
  <rect class="chip" x="296" y="400" width="116" height="42" rx="3"/>
  <text class="b" x="303" y="413">library calls</text>
  <text class="m" x="303" y="425">cuBLAS, cuDNN,</text>
  <text class="m" x="303" y="437">NCCL</text>
  <line class="ln" x1="56" y1="448" x2="56" y2="464" marker-end="url(#a)"/>
  <text class="m" x="66" y="461">GPU executable</text>

  <!-- S7 runtime -->
  <rect class="sw" x="36" y="466" width="384" height="38" rx="4"/>
  <text class="h" x="46" y="482">thunks</text>
  <text class="m" x="176" y="482">1 per kernel or library call</text>
  <text x="46" y="497">command buffers, built as CUDA graphs</text>
  <circle class="n" cx="400" cy="493.5" r="7"/><text class="nt" x="400" y="497" text-anchor="middle">4</text>
  <line class="ln" x1="56" y1="504" x2="56" y2="520" marker-end="url(#a)"/>
  <text class="m" x="66" y="517">launch</text>

  <!-- S8 GPU -->
  <rect class="gpu" x="36" y="522" width="384" height="32" rx="4"/>
  <text class="h" x="46" y="542">CUDA streams → V100</text>
  <text class="m" x="210" y="542">kernels on 80 SMs, NCCL on NVLink</text>

  <!-- right column: caches -->
  <text class="lane" x="436" y="84">CACHES</text>
  <rect class="mem" x="436" y="92" width="268" height="62" rx="4"/>
  <text class="b" x="446" y="107">in memory, per jitted function</text>
  <text class="m" x="446" y="121">key is shapes, dtypes and static args</text>
  <text class="m" x="446" y="134">1st call compiles, later calls reuse</text>
  <text class="m" x="446" y="147">a new static value means a recompile</text>

  <rect class="mem" x="436" y="164" width="268" height="76" rx="4"/>
  <text class="b" x="446" y="179">persistent cache, on disk</text>
  <text class="m" x="446" y="193">set JAX_COMPILATION_CACHE_DIR</text>
  <text class="m" x="446" y="206">key covers unoptimised HLO, jaxlib</text>
  <text class="m" x="446" y="219">version, XLA flags and the device</text>
  <text class="m" x="446" y="232">saved if compile takes ~1 s or more</text>

  <!-- right column: flags -->
  <text class="lane" x="436" y="262">THE POST'S XLA_FLAGS</text>
  <text class="m" x="436" y="275">shown without the xla_gpu_ prefix</text>

  <circle class="n" cx="443" cy="290" r="7"/><text class="nt" x="443" y="293.5" text-anchor="middle">1</text>
  <text class="fl" x="456" y="294">enable_latency_hiding_scheduler</text>
  <text class="m" x="456" y="307">overlaps async comms with compute,</text>
  <text class="m" x="456" y="320">off by default</text>

  <circle class="n" cx="443" cy="336" r="7"/><text class="nt" x="443" y="339.5" text-anchor="middle">2</text>
  <text class="fl" x="456" y="340">all_reduce_combine_threshold_bytes</text>
  <text class="m" x="456" y="353">merges small all-reduces into one,</text>
  <text class="m" x="456" y="366">only matters with more than 1 GPU</text>

  <circle class="n" cx="443" cy="382" r="7"/><text class="nt" x="443" y="385.5" text-anchor="middle">3</text>
  <text class="fl" x="456" y="386">enable_triton_gemm</text>
  <text class="m" x="456" y="399">Triton GEMMs, but CUDA Triton needs</text>
  <text class="m" x="456" y="412">compute capability 8.0+, V100 is 7.0</text>

  <circle class="n" cx="443" cy="428" r="7"/><text class="nt" x="443" y="431.5" text-anchor="middle">4</text>
  <text class="fl" x="456" y="432">enable_command_buffer</text>
  <text class="m" x="456" y="445">picks which ops get captured into</text>
  <text class="m" x="456" y="458">command buffers, i.e. CUDA graphs</text>

  <circle class="n" cx="443" cy="474" r="7"/><text class="nt" x="443" y="477.5" text-anchor="middle">5</text>
  <text class="fl" x="456" y="478">enable_fast_min_max</text>
  <text class="m" x="456" y="491">min/max that skips NaN propagation,</text>
  <text class="m" x="456" y="504">a source comment says it isn't faster</text>

  <line x1="436" y1="520" x2="704" y2="520" stroke="#c3c3cf" stroke-width="1"/>
  <text class="m" x="436" y="536">the JAX docs say flag behaviour can</text>
  <text class="m" x="436" y="549">change between jaxlib versions</text>
</svg>
