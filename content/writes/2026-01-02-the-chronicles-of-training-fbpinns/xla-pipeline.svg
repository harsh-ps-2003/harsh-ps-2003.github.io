<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 708" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">From a Python function to SASS</title>
  <desc id="desc">The JAX and XLA pipeline for one jitted function. jax.jit traces the Python function with abstract shapes and dtypes into a jaxpr, lowers it to StableHLO, and XLA compiles it, first with target independent passes like CSE, fusion and buffer analysis, then with the GPU backend that does GPU fusions, stream assignment, latency hiding scheduling, all-reduce combining and matching to cuBLAS, cuDNN and NCCL calls. Codegen goes through LLVM IR, NVPTX and PTX to SASS for sm_70, with a Triton emitter for matmul and softmax fusions. The runtime turns kernels and library calls into thunks and command buffers that run on CUDA streams on the V100. On the right, the in-memory and persistent compilation caches and the five XLA flags from the post, each tied to the stage it changes.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">From a Python function to SASS</text>
  <text class="s" x="24" y="64">jit traces once per shape. The GPU only sees kernels and library calls.</text>
  <path d="M 24.0 86.0 Q 184.0 82.3 344.0 86.0 Q 347.4 165.0 344.0 244.0 Q 184.0 247.6 24.0 244.0 Q 20.3 165.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">from Python</text>
  <text class="b" x="42.0" y="140.0">trace shapes and dtypes</text>
  <text class="b" x="42.0" y="168.0">jaxpr, then lower()</text>
  <text class="b" x="42.0" y="196.0">StableHLO</text>
  <text class="b" x="42.0" y="224.0">compile()</text>
  <line x1="184.0" y1="252.0" x2="184.0" y2="282.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 24.0 290.0 Q 184.0 286.3 344.0 290.0 Q 347.5 369.0 344.0 448.0 Q 184.0 451.6 24.0 448.0 Q 20.3 369.0 24.0 290.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="316.0">GPU compiler</text>
  <text class="b" x="42.0" y="344.0">CSE, fusion, buffers</text>
  <text class="b" x="42.0" y="372.0">one fusion, one kernel</text>
  <text class="b" x="42.0" y="400.0">latency hiding stays off</text>
  <text class="b" x="42.0" y="428.0">cuBLAS, cuDNN, NCCL</text>
  <line x1="184.0" y1="456.0" x2="184.0" y2="486.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 24.0 494.0 Q 184.0 490.2 344.0 494.0 Q 347.5 573.0 344.0 652.0 Q 184.0 655.5 24.0 652.0 Q 20.2 573.0 24.0 494.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="520.0">runtime</text>
  <text class="b" x="42.0" y="548.0">thunks, one per launch</text>
  <text class="b" x="42.0" y="576.0">command buffers</text>
  <text class="b" x="42.0" y="604.0">CUDA graphs</text>
  <text class="b" x="42.0" y="632.0">streams on the V100</text>
  <path d="M 376.0 86.0 Q 536.0 82.6 696.0 86.0 Q 699.6 165.0 696.0 244.0 Q 536.0 247.7 376.0 244.0 Q 372.6 165.0 376.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="112.0">caches</text>
  <text class="b" x="394.0" y="140.0">memory, keyed by shape</text>
  <text class="b" x="394.0" y="168.0">reuse until a static arg changes</text>
  <text class="b" x="394.0" y="196.0">disk, if compile takes ~1 s</text>
  <text class="b" x="394.0" y="224.0">key includes flags and device</text>
  <line x1="536.0" y1="252.0" x2="536.0" y2="282.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M 376.0 290.0 Q 536.0 286.5 696.0 290.0 Q 699.6 369.0 696.0 448.0 Q 536.0 451.7 376.0 448.0 Q 372.5 369.0 376.0 290.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="394.0" y="316.0">flags from the post</text>
  <text class="b" x="394.0" y="344.0">hiding scheduler, off</text>
  <text class="b" x="394.0" y="372.0">merge small all-reduces</text>
  <text class="b" x="394.0" y="400.0">Triton needs cc 8.0</text>
  <text class="b" x="394.0" y="428.0">fast min/max skips NaNs</text>
</svg>
