      <text x="494" y="316" text-anchor="middle">Call</text>
    </g>
  </g>

  <rect x="648" y="168" width="184" height="184" rx="4" fill="none" stroke="#8d8d8d" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="684" y="204" width="112" height="112" rx="10" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.6"/>

  <text x="284" y="412" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="26" fill="#1a1a1a">O(Nd)</text>
  <text x="740" y="412" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="26" fill="#1a1a1a">O(d<tspan font-size="15" dy="-11">2</tspan><tspan dy="11" font-size="26">)</tspan></text>
