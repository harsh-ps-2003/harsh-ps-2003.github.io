<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Softmax attention stores a key and a value for every token, a KV cache that costs O of N d. Linear attention folds those tokens into one fixed square KV state that costs O of d squared.">
  <rect width="900" height="440" fill="#ffffff"/>

  <rect x="204" y="16" width="160" height="44" rx="8" fill="#f6e58a" stroke="#c9b84e" stroke-width="1.4"/>
  <text x="284" y="44" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">Attention</text>

  <rect x="630" y="16" width="220" height="44" rx="8" fill="#f6e58a" stroke="#c9b84e" stroke-width="1.4"/>
  <text x="740" y="44" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">Linear Attention</text>

  <line x1="470" y1="38" x2="548" y2="38" stroke="#6a6258" stroke-width="8" stroke-linecap="butt"/>
  <polygon points="544,26 582,38 544,50" fill="#6a6258"/>

  <text x="284" y="104" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="26" fill="#1a1a1a">softmax(QK<tspan font-size="15" dy="-11">T</tspan><tspan dy="11" font-size="26">)V</tspan></text>
  <text x="740" y="104" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="26" fill="#1a1a1a">&#966;(Q)(&#966;(K))<tspan font-size="15" dy="-11">T</tspan><tspan dy="11" font-size="26"> V)</tspan></text>

  <text x="40" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3a3a3a">KV-cache</text>
  <text x="740" y="140" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3a3a3a">KV-state</text>

  <rect x="32" y="154" width="504" height="214" rx="4" fill="none" stroke="#8d8d8d" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="16" y="211" text-anchor="middle" transform="rotate(-90 16 211)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a4a">Keys</text>
  <text x="16" y="311" text-anchor="middle" transform="rotate(-90 16 311)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#4a4a4a">Values</text>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2c2c2c">
    <g>
      <rect x="48" y="168" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
      <rect x="108" y="168" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
      <rect x="168" y="168" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
      <rect x="228" y="168" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
      <rect x="288" y="168" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
