      <rect x="408" y="268" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
      <rect x="468" y="268" width="52" height="86" rx="26" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.3"/>
