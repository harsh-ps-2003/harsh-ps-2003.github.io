<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 960" width="920" height="960" role="img" aria-label="Linear attention drops the softmax path. The n by n scores and the row-wise softmax are crossed out. The replacement is phi of Q times the low-rank product of phi of K transpose and V.">
