  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b66">
    <text x="592" y="108" text-anchor="end">1.0</text>
    <text x="592" y="164" text-anchor="end">0.8</text>
    <text x="592" y="224" text-anchor="end">0.6</text>
