<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-label="MQAR plot of associative recall against recurrent state size. Attention climbs to perfect recall at a huge state. Sliding attention sits lower. Gated convolutions sit lower still.">
  <rect width="1040" height="470" fill="#ffffff"/>

  <text x="28" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#5c564e">Memory consumption and recall on MQAR</text>

  <text x="28" y="120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#6a6a66">
    <tspan font-weight="700" fill="#3b6fb6">Attention</tspan> achieves perfect recall, but
  </text>
  <text x="28" y="152" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#6a6a66">has a huge recurrent state</text>

  <text x="28" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#6a6a66">
    <tspan font-weight="700" fill="#d06a5c">Sliding attention</tspan> can reduce memory
  </text>
  <text x="28" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#6a6a66">consumption but at the cost of recall</text>

  <text x="28" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#6a6a66">
    <tspan font-weight="700" fill="#8a6810">Gated Convolutions</tspan> fall below even
  </text>
  <text x="28" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#6a6a66">sliding attention!</text>

  <g stroke="#eceae4" stroke-width="1">
    <line x1="600" y1="100" x2="980" y2="100"/>
    <line x1="600" y1="160" x2="980" y2="160"/>
    <line x1="600" y1="220" x2="980" y2="220"/>
    <line x1="600" y1="280" x2="980" y2="280"/>
    <line x1="600" y1="340" x2="980" y2="340"/>
