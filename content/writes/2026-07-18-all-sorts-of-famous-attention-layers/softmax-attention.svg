<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Scaled dot-product attention. Queries run down the side of S and keys run across the top, so each cell of S is one dot product. A row-wise softmax turns S into attention scores A, and A mixes the values into the output.">
  <rect width="920" height="520" fill="#ffffff"/>

  <text x="318" y="96" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="30" fill="#2a2a2a">softmax(QK<tspan font-size="17" dy="-12">T</tspan><tspan dy="12" font-size="30"> / &#8730;d) V</tspan></text>

  <text x="210" y="178" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e85d73">Keys</text>
  <text x="34" y="336" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2ea44a" transform="rotate(-90 34 336)">Queries</text>
  <text x="713" y="40" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0a020">Values</text>

  <!-- keys -->
  <g fill="#ef6a7c">
    <rect x="122" y="192" width="42" height="36" rx="2"/>
    <rect x="167" y="192" width="42" height="36" rx="2"/>
    <rect x="212" y="192" width="42" height="36" rx="2"/>
    <rect x="257" y="192" width="42" height="36" rx="2"/>
  </g>

  <!-- queries -->
  <g fill="#34a853">
    <rect x="74" y="240" width="36" height="42" rx="2"/>
    <rect x="74" y="285" width="36" height="42" rx="2"/>
    <rect x="74" y="330" width="36" height="42" rx="2"/>
    <rect x="74" y="375" width="36" height="42" rx="2"/>
  </g>

  <!-- S, dot products -->
  <g fill="#3f88c4">
    <rect x="122" y="240" width="42" height="42" rx="2"/>
    <rect x="167" y="240" width="42" height="42" rx="2"/>
    <rect x="212" y="240" width="42" height="42" rx="2"/>
    <rect x="257" y="240" width="42" height="42" rx="2"/>
    <rect x="122" y="285" width="42" height="42" rx="2"/>
    <rect x="167" y="285" width="42" height="42" rx="2"/>
    <rect x="212" y="285" width="42" height="42" rx="2"/>
    <rect x="257" y="285" width="42" height="42" rx="2"/>
    <rect x="122" y="330" width="42" height="42" rx="2"/>
    <rect x="167" y="330" width="42" height="42" rx="2"/>
    <rect x="212" y="330" width="42" height="42" rx="2"/>
    <rect x="257" y="330" width="42" height="42" rx="2"/>
    <rect x="122" y="375" width="42" height="42" rx="2"/>
    <rect x="167" y="375" width="42" height="42" rx="2"/>
    <rect x="212" y="375" width="42" height="42" rx="2"/>
    <rect x="257" y="375" width="42" height="42" rx="2"/>
  </g>
  <text x="210.5" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">S</text>

  <text x="400" y="292" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Row-wise</text>
  <text x="400" y="320" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Softmax</text>
  <line x1="348" y1="348" x2="458" y2="348" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M448 340 L466 348 L448 356 Z" fill="#1c1c1c"/>

  <!-- A, attention scores -->
  <g fill="#3f88c4">
    <rect x="486" y="240" width="42" height="42" rx="2"/>
    <rect x="531" y="240" width="42" height="42" rx="2"/>
    <rect x="576" y="240" width="42" height="42" rx="2"/>
    <rect x="621" y="240" width="42" height="42" rx="2"/>
    <rect x="486" y="285" width="42" height="42" rx="2"/>
    <rect x="531" y="285" width="42" height="42" rx="2"/>
    <rect x="576" y="285" width="42" height="42" rx="2"/>
    <rect x="621" y="285" width="42" height="42" rx="2"/>
    <rect x="486" y="330" width="42" height="42" rx="2"/>
    <rect x="531" y="330" width="42" height="42" rx="2"/>
    <rect x="576" y="330" width="42" height="42" rx="2"/>
    <rect x="621" y="330" width="42" height="42" rx="2"/>
    <rect x="486" y="375" width="42" height="42" rx="2"/>
    <rect x="531" y="375" width="42" height="42" rx="2"/>
    <rect x="576" y="375" width="42" height="42" rx="2"/>
    <rect x="621" y="375" width="42" height="42" rx="2"/>
  </g>
  <text x="574.5" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">A</text>

  <!-- values, sitting above the output the way the matmul reads -->
  <g fill="#f5a623">
    <rect x="692" y="52" width="42" height="42" rx="2"/>
    <rect x="692" y="97" width="42" height="42" rx="2"/>
    <rect x="692" y="142" width="42" height="42" rx="2"/>
    <rect x="692" y="187" width="42" height="42" rx="2"/>
  </g>

  <g fill="#9aa3ab">
    <rect x="692" y="240" width="42" height="42" rx="2"/>
    <rect x="692" y="285" width="42" height="42" rx="2"/>
    <rect x="692" y="330" width="42" height="42" rx="2"/>
    <rect x="692" y="375" width="42" height="42" rx="2"/>
  </g>
  <text x="754" y="336" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c">Output</text>

  <text x="210.5" y="458" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Dot Product</text>
  <text x="210.5" y="488" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Similarities</text>
  <text x="574.5" y="458" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Attention</text>
  <text x="574.5" y="488" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c1c1c">Scores</text>
</svg>
