<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 588" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Confidential computing moves the boundary toward silicon, not past the guest</title>
  <desc id="desc">Side by side, a plain KVM microVM and an AMD SEV-SNP VM. In the plain VM the host and hypervisor read guest pages in plaintext and a memory dump shows the token. In the SEV-SNP VM the AMD Secure Processor holds a per-VM key, the memory controller encrypts guest pages, the host sees only ciphertext, SEV-ES encrypts register state, and the Reverse Map Table blocks the hypervisor from remapping guest pages. In both VMs a malicious package inside the guest can still read the token and send it out. Attestation through /dev/sev-guest and SNP_GET_REPORT, verified against AMD KDS, is what ties the encrypted VM to known code.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c62f2f"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; font-size: 10px; }
    .h { font-size: 11.5px; font-weight: 700; }
    .b { font-weight: 700; }
    .red { fill: #c62f2f; }
    .ok { fill: #2e7d4f; }
    .box { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .host { fill: #e9e9ef; stroke: #a3a3b3; stroke-width: 1.25; }
    .guest { fill: #e2f2e6; stroke: #5ea876; stroke-width: 1.25; }
    .cred { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1.25; }
    .ubox { fill: #fbe5e3; stroke: #c62f2f; stroke-width: 1.25; }
    .cell { fill: #ffffff; stroke: #a3a3b3; stroke-width: .75; }
    .tcell { fill: #fbf1cf; stroke: #d4b34a; stroke-width: .75; }
    .ccell { fill: #e9e9ef; stroke: #a3a3b3; stroke-width: .75; }
    .hair { stroke: #c3c3cf; stroke-width: 1; }
  </style>

  <text class="k" x="16" y="22">CONFIDENTIAL COMPUTING</text>
  <text class="t" x="16" y="42">The boundary moves toward silicon, not past the guest</text>
  <text class="c" x="16" y="60">SEV-SNP hides guest RAM from the host. Code inside the guest still sees everything.</text>

  <text class="lane" x="16" y="86">PLAIN MICROVM (KVM)</text>
  <text class="lane" x="368" y="86">AMD SEV-SNP VM · PAGES ENCRYPTED</text>

  <!-- ===== left: plain microVM ===== -->
  <rect class="guest" x="16" y="94" width="336" height="74" rx="5"/>
  <text class="h" x="28" y="110">guest</text>
  <rect class="cred" x="28" y="120" width="118" height="20" rx="10"/>
  <text x="87" y="134" text-anchor="middle">token</text>
  <rect class="ubox" x="206" y="120" width="134" height="20" rx="4"/>
  <text x="273" y="134" text-anchor="middle">malicious pkg</text>
  <line x1="206" y1="130" x2="148" y2="130" stroke="#c62f2f" stroke-width="1.25" marker-end="url(#ar)"/>
  <text class="red" x="160" y="117" font-size="10">reads</text>
  <text class="red" x="28" y="158">pkg reads it and curls it out</text>

  <rect class="host" x="16" y="182" width="336" height="52" rx="5"/>
  <text class="h" x="28" y="198">host · hypervisor · VMM</text>
  <text class="red" x="28" y="213">sees: SECRET_DEMO_TOKEN</text>
  <text class="m" x="28" y="227">vCPU registers readable at exit</text>

  <line x1="306" y1="234" x2="306" y2="252" stroke="#c62f2f" stroke-width="1.25" marker-end="url(#ar)"/>
  <text class="red" x="312" y="247" font-size="10">read</text>
  <text class="m" x="28" y="248">guest page in DRAM</text>
  <g>
    <rect class="tcell" x="28" y="254" width="26" height="22"/><rect class="tcell" x="54" y="254" width="26" height="22"/><rect class="tcell" x="80" y="254" width="26" height="22"/><rect class="tcell" x="106" y="254" width="26" height="22"/><rect class="tcell" x="132" y="254" width="26" height="22"/><rect class="tcell" x="158" y="254" width="26" height="22"/>
    <rect class="tcell" x="184" y="254" width="26" height="22"/><rect class="tcell" x="210" y="254" width="26" height="22"/><rect class="tcell" x="236" y="254" width="26" height="22"/><rect class="tcell" x="262" y="254" width="26" height="22"/><rect class="tcell" x="288" y="254" width="26" height="22"/><rect class="cell" x="314" y="254" width="26" height="22"/>
  </g>
  <g text-anchor="middle">
    <text x="41" y="269">S</text><text x="67" y="269">E</text><text x="93" y="269">C</text><text x="119" y="269">R</text><text x="145" y="269">E</text><text x="171" y="269">T</text>
    <text x="197" y="269">_</text><text x="223" y="269">D</text><text x="249" y="269">E</text><text x="275" y="269">M</text><text x="301" y="269">O</text><text class="m" x="327" y="269">..</text>
  </g>

  <rect x="16" y="290" width="336" height="62" rx="5" fill="none" stroke="#a3a3b3" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text class="m" x="184" y="316" text-anchor="middle">no help from silicon:</text>
  <text class="m" x="184" y="332" text-anchor="middle">KVM and Firecracker trust the host</text>

  <!-- ===== right: SEV-SNP ===== -->
  <rect class="guest" x="368" y="94" width="336" height="74" rx="5" style="stroke-width:2"/>
  <text class="h" x="380" y="110">guest</text>
  <rect class="cred" x="380" y="120" width="118" height="20" rx="10"/>
  <text x="439" y="134" text-anchor="middle">token</text>
  <rect class="ubox" x="558" y="120" width="134" height="20" rx="4"/>
  <text x="625" y="134" text-anchor="middle">malicious pkg</text>
  <line x1="558" y1="130" x2="500" y2="130" stroke="#c62f2f" stroke-width="1.25" marker-end="url(#ar)"/>
  <text class="red" x="512" y="117" font-size="10">reads</text>
  <text class="red" x="380" y="158"><tspan class="b">still</tspan> reads it and curls it out</text>

  <rect class="host" x="368" y="182" width="336" height="52" rx="5"/>
  <text class="h" x="380" y="198">host · hypervisor · VMM</text>
  <text class="ok" x="380" y="213">sees: ciphertext only</text>
  <text class="m" x="380" y="227">vCPU registers encrypted (SEV-ES)</text>

  <line x1="658" y1="234" x2="658" y2="252" stroke="#232333" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="664" y="247" font-size="10">read</text>
  <text class="m" x="380" y="248">guest page in DRAM</text>
  <g>
    <rect class="ccell" x="380" y="254" width="26" height="22"/><rect class="ccell" x="406" y="254" width="26" height="22"/><rect class="ccell" x="432" y="254" width="26" height="22"/><rect class="ccell" x="458" y="254" width="26" height="22"/><rect class="ccell" x="484" y="254" width="26" height="22"/><rect class="ccell" x="510" y="254" width="26" height="22"/>
    <rect class="ccell" x="536" y="254" width="26" height="22"/><rect class="ccell" x="562" y="254" width="26" height="22"/><rect class="ccell" x="588" y="254" width="26" height="22"/><rect class="ccell" x="614" y="254" width="26" height="22"/><rect class="ccell" x="640" y="254" width="26" height="22"/><rect class="ccell" x="666" y="254" width="26" height="22"/>
  </g>
  <g text-anchor="middle" font-size="10" class="m">
    <text x="393" y="269">9f</text><text x="419" y="269">3a</text><text x="445" y="269">c1</text><text x="471" y="269">7e</text><text x="497" y="269">02</text><text x="523" y="269">b4</text>
    <text x="549" y="269">e8</text><text x="575" y="269">51</text><text x="601" y="269">0d</text><text x="627" y="269">a6</text><text x="653" y="269">f3</text><text x="679" y="269">2c</text>
  </g>

  <line x1="540" y1="276" x2="540" y2="290" stroke="#232333" stroke-width="1.25"/>
  <rect class="box" x="368" y="290" width="100" height="62" rx="4"/>
  <text class="b" x="378" y="306">AMD-SP</text>
  <text class="m" x="378" y="321">per-VM key,</text>
  <text class="m" x="378" y="336">never leaves</text>
  <rect class="box" x="480" y="290" width="120" height="62" rx="4" style="stroke:#ff5f1f;stroke-width:1.75"/>
  <text class="b" x="490" y="306">mem ctrl AES</text>
  <text class="m" x="490" y="321">encrypts writes</text>
  <text class="m" x="490" y="336">decrypts reads</text>
  <rect class="box" x="612" y="290" width="92" height="62" rx="4"/>
  <text class="b" x="620" y="306">RMP</text>
  <text class="m" x="620" y="321">page → owner</text>
  <text class="m" x="620" y="336">stops remaps</text>
  <line x1="468" y1="321" x2="478" y2="321" stroke="#232333" stroke-width="1.25" marker-end="url(#a)"/>

  <!-- ===== matrix ===== -->
  <text class="lane" x="16" y="380">WHO CAN READ THE TOKEN?</text>
  <text class="lane" x="316" y="380">PLAIN MICROVM</text>
  <text class="lane" x="516" y="380">SEV-SNP VM</text>
  <line class="hair" x1="16" y1="386" x2="704" y2="386" style="stroke:#232333"/>
  <text x="16" y="402">host operator / hypervisor</text>
  <text class="red" x="316" y="402">yes, plaintext</text>
  <text class="ok" x="516" y="402">no: ciphertext</text>
  <line class="hair" x1="16" y1="408" x2="704" y2="408"/>
  <text x="16" y="422">snapshot / memory dump</text>
  <text class="red" x="316" y="422">yes, strings finds it</text>
  <text class="ok" x="516" y="422">no: ciphertext</text>
  <line class="hair" x1="16" y1="428" x2="704" y2="428"/>
  <text x="16" y="442">malicious pkg in the guest</text>
  <text class="red" x="316" y="442">yes</text>
  <text class="red b" x="516" y="442">yes, still</text>
  <line class="hair" x1="16" y1="448" x2="704" y2="448"/>
  <text x="16" y="462">proof of what code runs</text>
  <text class="m" x="316" y="462">none</text>
  <text x="516" y="462">attestation report</text>
  <line class="hair" x1="16" y1="468" x2="704" y2="468" style="stroke:#232333"/>

  <!-- ===== attestation ===== -->
  <text class="lane" x="16" y="490">ATTESTATION: WITHOUT IT, ENCRYPTION PROVES NO IDENTITY</text>
  <g>
    <rect class="guest" x="16" y="498" width="120" height="36" rx="4"/>
    <text class="b" x="24" y="513">guest</text><text class="m" x="24" y="527">/dev/sev-guest</text>
    <rect class="box" x="158" y="498" width="120" height="36" rx="4"/>
    <text class="b" x="166" y="513">SNP_GET_REPORT</text><text class="m" x="166" y="527">ioctl + nonce</text>
    <rect class="box" x="300" y="498" width="120" height="36" rx="4"/>
    <text class="b" x="308" y="513">AMD-SP signs</text><text class="m" x="308" y="527">with the VCEK</text>
    <rect class="box" x="442" y="498" width="120" height="36" rx="4"/>
    <text class="b" x="450" y="513">verifier</text><text class="m" x="450" y="527">chain: AMD KDS</text>
    <rect class="cred" x="584" y="498" width="120" height="36" rx="4"/>
    <text class="b" x="592" y="513">release secret</text><text class="m" x="592" y="527">only on a match</text>
  </g>
  <g stroke="#232333" stroke-width="1.25" marker-end="url(#a)">
    <line x1="136" y1="516" x2="156" y2="516"/>
    <line x1="278" y1="516" x2="298" y2="516"/>
    <line x1="420" y1="516" x2="440" y2="516"/>
    <line x1="562" y1="516" x2="582" y2="516"/>
  </g>

  <text class="m" x="16" y="556">Intel TDX plays the same role with Trust Domains. CoCo runs Kata pods inside SEV-SNP/TDX VMs.</text>
  <text class="m" x="16" y="571">Costs: Azure confidential VMs drop live migration and Azure Backup; snapshot semantics change.</text>

</svg>
