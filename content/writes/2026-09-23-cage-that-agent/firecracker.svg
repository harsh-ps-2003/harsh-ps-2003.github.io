<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 562" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Firecracker: one process, one microVM, two barriers</title>
  <desc id="desc">The jailer builds a jail (chroot, cgroup, mount namespace with pivot_root, network namespace, optional PID namespace, uid/gid drop, rlimits) and execs one firecracker process per microVM. Inside that process the guest kernel and agent workload run in an anonymous memory mapping. Three kinds of thread, each with its own seccomp filter, serve the guest: fc_api serves REST on api.sock, the VMM main thread runs the virtio devices and MMDS in one epoll loop, and fc_vcpu threads run the KVM_RUN loop. The virtualization barrier separates the guest from the VMM, and the jailer barrier separates the VMM from the host kernel.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f5f5f8"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8e8ea0" stroke-width="1.6"/>
    </pattern>
  </defs>
  <style>
    text { fill: #232333; font-size: 10px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; }
    .s11 { font-size: 11px; }
    .b { font-weight: 700; }
    .h { font-size: 11.5px; font-weight: 700; }
    .or { fill: #e2541a; }
    .big { font-size: 16px; font-weight: 700; }
    .q { font-style: italic; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .kbox { fill: #ffffff; stroke: #a3a3b3; stroke-width: 1; }
    .drv { fill: #ffffff; stroke: #5ea876; stroke-width: 1; }
    .sc { fill: #ffede4; stroke: #ff5f1f; stroke-width: 1; }
  </style>

  <text class="k" x="16" y="22">FIRECRACKER</text>
  <text class="t" x="16" y="42">One process, one microVM, two barriers</text>
  <text class="c" x="16" y="60">Untrusted code gets its own kernel; the host only sees a jailed, seccomp-filtered VMM.</text>

  <!-- host -->
  <rect x="16" y="72" width="688" height="418" rx="6" fill="#f5f5f8" stroke="#a3a3b3" stroke-width="1.25"/>
  <text class="lane" x="26" y="88">HOST · LINUX + KVM</text>

  <!-- jailer + orchestrator column -->
  <rect class="box" x="26" y="100" width="116" height="48" rx="4"/>
  <text class="h" x="34" y="116">jailer</text>
  <text class="m" x="34" y="130">builds the jail,</text>
  <text class="m" x="34" y="142">then exec()s fc</text>
  <line x1="142" y1="124" x2="154" y2="124" stroke="#232333" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="26" y="300" width="116" height="22" rx="4"/>
  <text class="h" x="34" y="315">orchestrator</text>
  <g class="m">
    <text x="30" y="338">PUT /boot-source</text>
    <text x="30" y="351">/drives/{id}</text>
    <text x="30" y="364">/network-interfaces</text>
    <text x="30" y="377">/mmds</text>
    <text x="30" y="390">/snapshot/load</text>
    <text x="30" y="403">/actions:</text>
    <text x="30" y="416">InstanceStart</text>
  </g>

  <!-- jail (hatched = jailer barrier) -->
  <rect x="156" y="96" width="540" height="304" rx="4" fill="url(#hatch)"/>
  <rect x="161" y="101" width="530" height="294" rx="2" fill="#f5f5f8"/>
  <text class="lane" x="168" y="114" style="fill:#232333">JAIL</text>
  <text class="m" x="204" y="114">chroot /srv/jailer/firecracker/&lt;id&gt;/root</text>
  <text class="m" x="168" y="127">cgroup · mnt ns + pivot_root · netns · pid ns (opt) · uid/gid drop · rlimits</text>

  <!-- firecracker process -->
  <rect x="168" y="134" width="516" height="254" rx="5" fill="#ffffff" stroke="#232333" stroke-width="1.5"/>
  <text class="h" x="180" y="150">firecracker</text>
  <text class="m" x="268" y="150">one process = one microVM</text>

  <!-- guest -->
  <rect x="180" y="158" width="492" height="104" rx="5" fill="#e2f2e6" stroke="#5ea876" stroke-width="1.25"/>
  <text class="lane" x="190" y="173" style="fill:#2f7d4a">GUEST</text>
  <text class="m" x="236" y="173">RAM = anonymous mmap inside this process</text>
  <rect x="192" y="180" width="468" height="22" rx="4" fill="#e3eefb" stroke="#7aa7d9" stroke-width="1.25"/>
  <text class="s11" x="200" y="195"><tspan class="b">agent workload</tspan> · python, bash, pnpm, LLM-written code</text>
  <rect x="192" y="208" width="468" height="22" rx="4" fill="#c6e6cf" stroke="#5ea876" stroke-width="1.25"/>
  <text class="s11" x="200" y="223"><tspan class="b">guest Linux kernel</tspan> · own syscalls, page cache, modules</text>
  <g>
    <rect class="drv" x="192" y="236" width="70" height="18" rx="3"/><text x="227" y="249" text-anchor="middle">virtio-net</text>
    <rect class="drv" x="268" y="236" width="70" height="18" rx="3"/><text x="303" y="249" text-anchor="middle">virtio-blk</text>
    <rect class="drv" x="344" y="236" width="48" height="18" rx="3"/><text x="368" y="249" text-anchor="middle">vsock</text>
    <rect class="drv" x="398" y="236" width="40" height="18" rx="3"/><text x="418" y="249" text-anchor="middle">rng</text>
    <rect class="drv" x="444" y="236" width="58" height="18" rx="3"/><text x="473" y="249" text-anchor="middle">balloon</text>
    <rect class="drv" x="508" y="236" width="52" height="18" rx="3"/><text x="534" y="249" text-anchor="middle">serial</text>
    <rect class="drv" x="566" y="236" width="48" height="18" rx="3"/><text x="590" y="249" text-anchor="middle">i8042</text>
    <text class="m" x="620" y="249">drivers</text>
  </g>

  <!-- virtualization barrier -->
  <line x1="176" y1="279" x2="676" y2="279" stroke="#ff5f1f" stroke-width="1.75" stroke-dasharray="6 4"/>
  <g fill="#ffffff">
    <rect x="186" y="273" width="158" height="13"/><rect x="403" y="273" width="60" height="13"/><rect x="489" y="273" width="36" height="13"/><rect x="599" y="273" width="36" height="13"/><rect x="643" y="273" width="30" height="13"/>
  </g>
  <text class="lane" x="190" y="283" style="fill:#e2541a">VIRTUALIZATION BARRIER</text>
  <g stroke="#232333" stroke-width="1.25" marker-end="url(#a)">
    <line x1="400" y1="263" x2="400" y2="294"/>
    <line x1="486" y1="294" x2="486" y2="264"/>
    <line x1="596" y1="294" x2="596" y2="264"/>
    <line x1="640" y1="263" x2="640" y2="294"/>
  </g>
  <text x="406" y="283">ioeventfd</text>
  <text x="492" y="283">irqfd</text>
  <text x="602" y="283">entry</text>
  <text x="646" y="283">exit</text>

  <!-- threads -->
  <rect class="box" x="180" y="296" width="112" height="84" rx="4"/>
  <text class="h" x="188" y="312">fc_api</text>
  <text x="188" y="327">HTTP on api.sock</text>
  <text class="m" x="188" y="340">never fast path</text>
  <text class="m" x="188" y="353">mpsc + eventfd</text>
  <rect class="sc" x="188" y="362" width="80" height="14" rx="7"/><text x="228" y="372.5" text-anchor="middle">seccomp: api</text>
  <line x1="292" y1="349" x2="318" y2="349" stroke="#232333" stroke-width="1.25" marker-end="url(#a)"/>

  <rect class="box" x="320" y="296" width="232" height="84" rx="4"/>
  <text class="h" x="330" y="312">vmm</text><text class="m" x="358" y="312">main thread, one epoll loop</text>
  <text x="330" y="327">virtio-net · virtio-block · vsock</text>
  <text x="330" y="340">rng · balloon · serial · i8042</text>
  <text x="330" y="353">MMDS "Dumbo" · rate limiters</text>
  <rect class="sc" x="330" y="362" width="80" height="14" rx="7"/><text x="370" y="372.5" text-anchor="middle">seccomp: vmm</text>

  <rect class="box" x="576" y="296" width="96" height="84" rx="4"/>
  <text class="h" x="584" y="312" style="font-size:11px">fc_vcpu 0..N</text>
  <text x="584" y="327">KVM_RUN loop</text>
  <text class="m" x="584" y="340">MMIO/PIO exits</text>
  <text class="m" x="584" y="353">handled here</text>
  <rect class="sc" x="581" y="362" width="86" height="14" rx="7"/><text x="624" y="372.5" text-anchor="middle">seccomp: vcpu</text>

  <!-- orchestrator -> api -->
  <line x1="142" y1="311" x2="178" y2="311" stroke="#232333" stroke-width="1.25" marker-end="url(#a)"/>

  <!-- jailer barrier + host syscalls -->
  <text class="lane" x="168" y="420" style="fill:#e2541a">JAILER BARRIER</text>
  <text x="354" y="420" text-anchor="end">frames</text>
  <text x="464" y="420" text-anchor="end">file I/O</text>
  <text x="620" y="420" text-anchor="end">ioctl(KVM_RUN)</text>

  <!-- host kernel -->
  <rect x="26" y="438" width="668" height="44" rx="4" fill="#e9e9ef" stroke="#a3a3b3" stroke-width="1.25"/>
  <text class="lane" x="36" y="464" style="fill:#232333">HOST KERNEL</text>
  <rect class="kbox" x="168" y="449" width="132" height="22" rx="3"/><text x="234" y="464" text-anchor="middle">cgroups · namespaces</text>
  <rect class="kbox" x="316" y="449" width="116" height="22" rx="3"/><text x="374" y="464" text-anchor="middle">TAP /dev/net/tun</text>
  <rect class="kbox" x="444" y="449" width="116" height="22" rx="3"/><text x="502" y="464" text-anchor="middle">rootfs.ext4 file</text>
  <rect class="kbox" x="576" y="449" width="108" height="22" rx="3"/><text x="630" y="464" text-anchor="middle">KVM · /dev/kvm</text>

  <g stroke="#232333" stroke-width="1.25" marker-end="url(#a)">
    <line x1="360" y1="381" x2="360" y2="447"/>
    <line x1="470" y1="381" x2="470" y2="447"/>
    <line x1="626" y1="381" x2="626" y2="447"/>
  </g>

  <!-- numbers + quote -->
  <text class="big" x="16" y="520">&lt;125 ms</text>
  <text class="m" x="16" y="536">start → /sbin/init</text>
  <text class="big" x="168" y="520">≤5 MiB</text>
  <text class="m" x="168" y="536">overhead per microVM</text>
  <text class="big" x="320" y="520">150/s</text>
  <text class="m" x="320" y="536">microVMs per host</text>
  <line x1="462" y1="506" x2="462" y2="548" stroke="#ff5f1f" stroke-width="2"/>
  <text class="q" x="472" y="516">"all vCPU threads are considered to be</text>
  <text class="q" x="472" y="529">running malicious code as soon as they</text>
  <text class="q" x="472" y="542">have been started" · docs/design.md</text>

</svg>
