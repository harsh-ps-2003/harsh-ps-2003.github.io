<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">"Fix the failing test", step by step</title>
  <desc id="desc">Six steps of a routine coding-agent task: git clone, read code, pnpm install, write fix, pnpm test, git push. Under each step, a stack shows the credentials (yellow) and untrusted inputs (red) the session holds after that step. The stack only grows, from two items after clone to nine at push time. Under each stack is the worst case for that step.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; }
    .cmd { font-size: 11.5px; font-weight: 700; }
    .red, .red text { fill: #c62f2f; }
    .step { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .y { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1; }
    .r { fill: #fbe5e3; stroke: #c62f2f; stroke-width: 1; }
    .old { opacity: .42; }
  </style>

  <text class="k" x="16" y="22">IN PRACTICE</text>
  <text class="t" x="16" y="42">"Fix the failing test in src/auth/login.test.ts"</text>
  <text class="c" x="16" y="60">Nothing gets handed back. By git push the session holds every credential and every input.</text>

  <!-- steps: x = 18 + 116c, w 104 -->
  <g>
    <rect class="step" x="18" y="74" width="104" height="36" rx="4"/>
    <text class="cmd" x="26" y="89">git clone</text><text class="m" x="26" y="103">needs creds</text>
    <rect class="step" x="134" y="74" width="104" height="36" rx="4"/>
    <text class="cmd" x="142" y="89">read code</text><text class="m" x="142" y="103">test + source</text>
    <rect class="step" x="250" y="74" width="104" height="36" rx="4"/>
    <text class="cmd" x="258" y="89">pnpm install</text><text class="m" x="258" y="103">100s of pkgs</text>
    <rect class="step" x="366" y="74" width="104" height="36" rx="4"/>
    <text class="cmd" x="374" y="89">write fix</text><text class="m" x="374" y="103">LLM-generated</text>
    <rect class="step" x="482" y="74" width="104" height="36" rx="4"/>
    <text class="cmd" x="490" y="89">pnpm test</text><text class="m" x="490" y="103">runs everything</text>
    <rect class="step" x="598" y="74" width="104" height="36" rx="4" style="stroke:#ff5f1f;stroke-width:1.75"/>
    <text class="cmd" x="606" y="89">git push</text><text class="m" x="606" y="103">repo write</text>
  </g>
  <g stroke="#232333" stroke-width="1.25" marker-end="url(#a)">
    <line x1="122" y1="92" x2="132" y2="92"/>
    <line x1="238" y1="92" x2="248" y2="92"/>
    <line x1="354" y1="92" x2="364" y2="92"/>
    <line x1="470" y1="92" x2="480" y2="92"/>
    <line x1="586" y1="92" x2="596" y2="92"/>
  </g>

  <text class="lane" x="18" y="134">HELD BY THE SESSION AFTER EACH STEP</text>

  <!-- stacks: slot i top y = 300 - 20i, h 18; block x = col x, w 104 -->
  <!-- col 0: new 0,1 -->
  <rect class="y" x="18" y="300" width="104" height="18" rx="3"/><text x="24" y="313">SSH key / token</text>
  <rect class="r" x="18" y="280" width="104" height="18" rx="3"/><text x="24" y="293">repo contents</text>
  <!-- col 1: old 0,1 ; new 2 -->
  <g class="old"><rect class="y" x="134" y="300" width="104" height="18" rx="3"/><rect class="r" x="134" y="280" width="104" height="18" rx="3"/></g>
  <rect class="y" x="134" y="260" width="104" height="18" rx="3"/><text x="140" y="273">read: whole repo</text>
  <!-- col 2: old 0-2 ; new 3,4 -->
  <g class="old"><rect class="y" x="250" y="300" width="104" height="18" rx="3"/><rect class="r" x="250" y="280" width="104" height="18" rx="3"/><rect class="y" x="250" y="260" width="104" height="18" rx="3"/></g>
  <rect class="r" x="250" y="240" width="104" height="18" rx="3"/><text x="256" y="253">postinstall code</text>
  <rect class="y" x="250" y="220" width="104" height="18" rx="3"/><text x="256" y="233">process.env</text>
  <!-- col 3: old 0-4 ; new 5 -->
  <g class="old"><rect class="y" x="366" y="300" width="104" height="18" rx="3"/><rect class="r" x="366" y="280" width="104" height="18" rx="3"/><rect class="y" x="366" y="260" width="104" height="18" rx="3"/><rect class="r" x="366" y="240" width="104" height="18" rx="3"/><rect class="y" x="366" y="220" width="104" height="18" rx="3"/></g>
  <rect class="r" x="366" y="200" width="104" height="18" rx="3"/><text x="372" y="213">LLM-written fix</text>
  <!-- col 4: old 0-5 ; new 6,7 -->
  <g class="old"><rect class="y" x="482" y="300" width="104" height="18" rx="3"/><rect class="r" x="482" y="280" width="104" height="18" rx="3"/><rect class="y" x="482" y="260" width="104" height="18" rx="3"/><rect class="r" x="482" y="240" width="104" height="18" rx="3"/><rect class="y" x="482" y="220" width="104" height="18" rx="3"/><rect class="r" x="482" y="200" width="104" height="18" rx="3"/></g>
  <rect class="r" x="482" y="180" width="104" height="18" rx="3"/><text x="488" y="193">test fixtures</text>
  <rect class="y" x="482" y="160" width="104" height="18" rx="3"/><text x="488" y="173">exec + network</text>
  <!-- col 5: old 0-7 ; new 8 -->
  <g class="old"><rect class="y" x="598" y="300" width="104" height="18" rx="3"/><rect class="r" x="598" y="280" width="104" height="18" rx="3"/><rect class="y" x="598" y="260" width="104" height="18" rx="3"/><rect class="r" x="598" y="240" width="104" height="18" rx="3"/><rect class="y" x="598" y="220" width="104" height="18" rx="3"/><rect class="r" x="598" y="200" width="104" height="18" rx="3"/><rect class="r" x="598" y="180" width="104" height="18" rx="3"/><rect class="y" x="598" y="160" width="104" height="18" rx="3"/></g>
  <rect class="y" x="598" y="140" width="104" height="18" rx="3"/><text x="604" y="153">repo write</text>

  <line x1="16" y1="324" x2="704" y2="324" stroke="#232333" stroke-width="1"/>

  <!-- worst case per step -->
  <g class="red">
    <text x="18" y="340">token readable</text><text x="18" y="353">by the process</text>
    <text x="134" y="340">reads beyond</text><text x="134" y="353">the task</text>
    <text x="250" y="340">install script</text><text x="250" y="353">steals env vars</text>
    <text x="366" y="340">edits files it</text><text x="366" y="353">shouldn't touch</text>
    <text x="482" y="340">test code runs</text><text x="482" y="353">fixture input</text>
    <text x="598" y="340">pushes whatever</text><text x="598" y="353">changed</text>
  </g>

  <!-- legend -->
  <rect class="y" x="18" y="372" width="14" height="10" rx="2"/><text class="m" x="38" y="381">authority the session holds</text>
  <rect class="r" x="226" y="372" width="14" height="10" rx="2"/><text class="m" x="246" y="381">untrusted input shaping behaviour</text>
  <g class="old"><rect class="y" x="476" y="372" width="14" height="10" rx="2"/></g><text class="m" x="496" y="381">carried from earlier steps</text>

</svg>
