<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 542" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">What actually runs when you docker run</title>
  <desc id="desc">Process lifelines for docker run: the docker CLI calls dockerd over its Unix socket, dockerd calls containerd over gRPC, containerd spawns one containerd-shim-runc-v2 per container, the shim runs runc create, runc clones runc init into new namespaces and exits, init is reparented to the shim, runc start releases init through the exec fifo and init execs the app as PID 1. The app's syscalls go to the same host kernel as every other container. When the app exits the shim reaps it and reports the exit code. The daemons can restart without killing the container.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; font-size: 10px; }
    .h { font-size: 11.5px; font-weight: 700; }
    .proc { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .daemon { fill: #e9e9ef; stroke: #a3a3b3; stroke-width: 1; }
    .shim { fill: #ffede4; stroke: #ff5f1f; stroke-width: 1.25; }
    .runc { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .stub { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1; stroke-dasharray: 3 2; }
    .app { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1.25; }
    .ln { stroke: #232333; stroke-width: 1.25; fill: none; }
    .n { fill: #ff5f1f; }
    .nt { fill: #ffffff; font-size: 9.5px; font-weight: 700; }
    .code { font-weight: 600; }
  </style>

  <text class="k" x="16" y="22">CONTAINER RUNTIMES</text>
  <text class="t" x="16" y="42">What actually runs when you `docker run`</text>
  <text class="c" x="16" y="60">runc builds the box and exits. The shim stays as parent. The kernel does the isolating.</text>

  <text class="lane" x="16" y="84">PROCESS</text>
  <text class="lane" x="244" y="84">LIFETIME  →</text>

  <!-- process boxes: top = 92 + 40i, h 32 -->
  <rect class="proc" x="16" y="92" width="216" height="32" rx="4"/>
  <text class="h" x="24" y="105">docker CLI</text><text class="m" x="24" y="118">docker run -d nginx</text>
  <rect class="proc" x="16" y="132" width="216" height="32" rx="4"/>
  <text class="h" x="24" y="145">dockerd</text><text class="m" x="24" y="158">API, images, networks, volumes</text>
  <rect class="proc" x="16" y="172" width="216" height="32" rx="4"/>
  <text class="h" x="24" y="185">containerd</text><text class="m" x="24" y="198">content, snapshots, tasks, CRI</text>
  <rect class="proc" x="16" y="212" width="216" height="32" rx="4" style="stroke:#ff5f1f;stroke-width:1.75"/>
  <text class="h" x="24" y="225">containerd-shim-runc-v2</text><text class="m" x="24" y="238">1 per container · subreaper</text>
  <rect class="proc" x="16" y="252" width="216" height="32" rx="4"/>
  <text class="h" x="24" y="265">runc</text><text class="m" x="24" y="278">OCI runtime CLI · short-lived</text>
  <rect class="proc" x="16" y="292" width="216" height="32" rx="4" style="fill:#e3eefb;stroke:#7aa7d9"/>
  <text class="h" x="24" y="305">runc init → app</text><text class="m" x="24" y="318">PID 1 in new namespaces</text>

  <!-- guide lines -->
  <g stroke="#e1e1e8" stroke-width="1">
    <line x1="244" y1="108" x2="704" y2="108"/><line x1="244" y1="148" x2="704" y2="148"/>
    <line x1="244" y1="188" x2="704" y2="188"/><line x1="244" y1="228" x2="704" y2="228"/>
    <line x1="244" y1="268" x2="704" y2="268"/><line x1="244" y1="308" x2="704" y2="308"/>
  </g>

  <!-- bars (h 10, centred on row) -->
  <rect class="runc" x="252" y="103" width="308" height="10" rx="2"/>
  <rect class="daemon" x="244" y="143" width="368" height="10" rx="2"/><rect class="daemon" x="632" y="143" width="72" height="10" rx="2"/>
  <rect class="daemon" x="244" y="183" width="368" height="10" rx="2"/><rect class="daemon" x="632" y="183" width="72" height="10" rx="2"/>
  <rect class="shim" x="328" y="223" width="362" height="10" rx="2"/>
  <rect class="runc" x="366" y="263" width="48" height="10" rx="2"/><text class="m" x="361" y="271.5" text-anchor="end">create</text>
  <rect class="runc" x="540" y="263" width="22" height="10" rx="2"/><text class="m" x="567" y="271.5">start</text>
  <rect class="stub" x="390" y="303" width="158" height="10" rx="2"/><text class="m" x="469" y="326" text-anchor="middle">blocked on exec.fifo</text>
  <rect class="app" x="548" y="303" width="102" height="10" rx="2"/><text class="m" x="580" y="326" text-anchor="middle">nginx</text>

  <!-- event arrows -->
  <line class="ln" x1="252" y1="113" x2="252" y2="141" marker-end="url(#a)"/>
  <line class="ln" x1="290" y1="153" x2="290" y2="181" marker-end="url(#a)"/>
  <line class="ln" x1="328" y1="193" x2="328" y2="221" marker-end="url(#a)"/>
  <line class="ln" x1="366" y1="233" x2="366" y2="261" marker-end="url(#a)"/>
  <line class="ln" x1="390" y1="273" x2="390" y2="301" marker-end="url(#a)"/>
  <line class="ln" x1="422" y1="303" x2="422" y2="235" marker-end="url(#a)" stroke-dasharray="3 2"/>
  <line class="ln" x1="540" y1="233" x2="540" y2="261" marker-end="url(#a)"/>
  <line class="ln" x1="548" y1="273" x2="548" y2="301" marker-end="url(#a)"/>
  <line class="ln" x1="650" y1="303" x2="650" y2="235" marker-end="url(#a)" stroke-dasharray="3 2"/>
  <line class="ln" x1="690" y1="223" x2="690" y2="195" marker-end="url(#a)" stroke-dasharray="3 2"/>

  <!-- numbers -->
  <g>
    <circle class="n" cx="262" cy="128" r="7"/><text class="nt" x="262" y="131.5" text-anchor="middle">1</text>
    <circle class="n" cx="300" cy="168" r="7"/><text class="nt" x="300" y="171.5" text-anchor="middle">2</text>
    <circle class="n" cx="338" cy="208" r="7"/><text class="nt" x="338" y="211.5" text-anchor="middle">3</text>
    <circle class="n" cx="376" cy="248" r="7"/><text class="nt" x="376" y="251.5" text-anchor="middle">4</text>
    <circle class="n" cx="400" cy="288" r="7"/><text class="nt" x="400" y="291.5" text-anchor="middle">5</text>
    <circle class="n" cx="432" cy="248" r="7"/><text class="nt" x="432" y="251.5" text-anchor="middle">6</text>
    <circle class="n" cx="530" cy="248" r="7"/><text class="nt" x="530" y="251.5" text-anchor="middle">7</text>
    <circle class="n" cx="660" cy="248" r="7"/><text class="nt" x="660" y="251.5" text-anchor="middle">8</text>
    <circle class="n" cx="622" cy="168" r="7"/><text class="nt" x="622" y="171.5" text-anchor="middle">9</text>
  </g>

  <!-- syscalls to the kernel -->
  <line class="ln" x1="630" y1="313" x2="630" y2="338" marker-end="url(#a)"/>
  <text class="m" x="636" y="331">syscalls</text>

  <!-- kernel -->
  <rect x="16" y="340" width="688" height="36" rx="4" fill="#e9e9ef" stroke="#a3a3b3" stroke-width="1"/>
  <text class="h" x="26" y="355">host kernel</text>
  <text class="m" x="128" y="355">namespaces · cgroups · capabilities · seccomp · LSM</text>
  <text class="m" x="26" y="369">enforced for the app's whole life by the one kernel every container shares. runc only configured them.</text>

  <!-- legend (two columns) -->
  <g>
    <circle class="n" cx="23" cy="398" r="7"/><text class="nt" x="23" y="401.5" text-anchor="middle">1</text>
    <text x="36" y="402">REST over /var/run/docker.sock</text>
    <text class="m" x="36" y="415">(kubelet skips dockerd: CRI → containerd)</text>
    <circle class="n" cx="23" cy="432" r="7"/><text class="nt" x="23" y="435.5" text-anchor="middle">2</text>
    <text x="36" y="436">gRPC: create container + task</text>
    <circle class="n" cx="23" cy="453" r="7"/><text class="nt" x="23" y="456.5" text-anchor="middle">3</text>
    <text x="36" y="457">spawn one shim, talk ttRPC</text>
    <circle class="n" cx="23" cy="474" r="7"/><text class="nt" x="23" y="477.5" text-anchor="middle">4</text>
    <text x="36" y="478"><tspan class="code">runc create</tspan> on the OCI bundle</text>
    <text class="m" x="36" y="491">(config.json + rootfs)</text>
    <circle class="n" cx="23" cy="508" r="7"/><text class="nt" x="23" y="511.5" text-anchor="middle">5</text>
    <text x="36" y="512">clone <tspan class="code">runc init</tspan> into new namespaces</text>
    <text class="m" x="36" y="525">joins cgroup; preps rootfs, caps, seccomp</text>

    <circle class="n" cx="371" cy="398" r="7"/><text class="nt" x="371" y="401.5" text-anchor="middle">6</text>
    <text x="384" y="402">runc exits; init is reparented</text>
    <text class="m" x="384" y="415">to the shim (child subreaper)</text>
    <circle class="n" cx="371" cy="432" r="7"/><text class="nt" x="371" y="435.5" text-anchor="middle">7</text>
    <text x="384" y="436"><tspan class="code">runc start</tspan> opens exec.fifo;</text>
    <text class="m" x="384" y="449">init execve()s nginx, same PID</text>
    <circle class="n" cx="371" cy="466" r="7"/><text class="nt" x="371" y="469.5" text-anchor="middle">8</text>
    <text x="384" y="470">app exits; shim reaps it, keeps</text>
    <text class="m" x="384" y="483">the exit code, reports TaskExit</text>
    <circle class="n" cx="371" cy="500" r="7"/><text class="nt" x="371" y="503.5" text-anchor="middle">9</text>
    <text x="384" y="504">daemons can restart (live-restore)</text>
    <text class="m" x="384" y="517">the shim keeps stdio + the container</text>
  </g>

</svg>
