<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">A Firecracker snapshot is guest RAM, written down</title>
  <desc id="desc">A token passed on the kernel command line is copied into many places in guest RAM: kernel command line parsing, init's environment, the dmesg ring, journald and application heap. Pausing and snapshotting writes a vmstate file, protected only by a CRC64 checksum, and a memory file that is a raw byte-for-byte copy of guest RAM with no encryption. strings and grep find 65 copies of the token. Restoring the same snapshot more than once replicates the token, random seeds and entropy pool into every microVM, which Firecracker's docs call insecure, and Firecracker's threat model treats the host and snapshot files as trusted.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; font-size: 10px; }
    .h { font-size: 11.5px; font-weight: 700; }
    .b { font-weight: 700; }
    .red { fill: #c62f2f; }
    .q { font-style: italic; }
    .box { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .guest { fill: #e2f2e6; stroke: #5ea876; stroke-width: 1.25; }
    .msg { stroke: #232333; stroke-width: 1.25; fill: none; }
    .tok { fill: #ff5f1f; }
    .term { fill: #f5f5f8; font-size: 10.5px; }
  </style>

  <text class="k" x="16" y="22">SNAPSHOTS</text>
  <text class="t" x="16" y="42">A snapshot is guest RAM, written down</text>
  <text class="c" x="16" y="60">Whatever plaintext the guest held at pause time is now a file on the host.</text>

  <!-- running microVM -->
  <text class="lane" x="16" y="86">RUNNING MICROVM</text>
  <rect class="guest" x="16" y="94" width="688" height="86" rx="5"/>
  <text class="h" x="28" y="111">guest RAM · 256 MiB</text>
  <text class="m" x="692" y="111" text-anchor="end">boot_args: "... DEMO_TOKEN=SECRET_DEMO_TOKEN_DO_NOT_USE"</text>
  <!-- leader labels -->
  <g class="m">
    <text x="57" y="131">kernel cmdline</text>
    <text x="201" y="131">init env</text>
    <text x="286" y="131">dmesg ring</text>
    <text x="451" y="131">journald</text>
    <text x="596" y="131">app heap / env</text>
  </g>
  <g stroke="#5c5c6e" stroke-width="1">
    <line x1="63.5" y1="134" x2="63.5" y2="140"/>
    <line x1="207.5" y1="134" x2="207.5" y2="140"/>
    <line x1="292.5" y1="134" x2="292.5" y2="140"/>
    <line x1="457.5" y1="134" x2="457.5" y2="140"/>
    <line x1="602.5" y1="134" x2="602.5" y2="140"/>
  </g>
  <rect x="28" y="140" width="664" height="20" fill="#ffffff" stroke="#a3a3b3" stroke-width="1"/>
  <g class="tok">
    <rect x="61" y="140" width="5" height="20"/><rect x="118" y="140" width="5" height="20"/>
    <rect x="205" y="140" width="5" height="20"/>
    <rect x="290" y="140" width="5" height="20"/><rect x="298" y="140" width="5" height="20"/>
    <rect x="371" y="140" width="5" height="20"/>
    <rect x="455" y="140" width="5" height="20"/><rect x="463" y="140" width="5" height="20"/>
    <rect x="600" y="140" width="5" height="20"/><rect x="608" y="140" width="5" height="20"/><rect x="644" y="140" width="5" height="20"/>
  </g>
  <rect x="28" y="166" width="10" height="8" class="tok"/>
  <text class="m" x="44" y="174">plaintext copy of the token (positions schematic)</text>

  <!-- snapshot -->
  <polyline class="msg" points="248,180 248,192 128,192 128,204" marker-end="url(#a)"/>
  <polyline class="msg" points="248,192 368,192 368,204" marker-end="url(#a)"/>
  <text x="380" y="196">PATCH /vm Paused → PUT /snapshot/create</text>

  <rect class="box" x="16" y="206" width="216" height="66" rx="4"/>
  <text class="h" x="26" y="223">snap.bin <tspan class="m" font-weight="400">vmstate</tspan></text>
  <text x="26" y="238">vCPU + device state</text>
  <text x="26" y="252">bitcode, CRC64 checksum</text>
  <text class="m" x="26" y="266">catches corruption only</text>

  <rect class="box" x="248" y="206" width="216" height="66" rx="4" style="stroke:#ff5f1f;stroke-width:1.75"/>
  <text class="h" x="258" y="223">snap.mem <tspan class="m" font-weight="400">memory file</tspan></text>
  <text x="258" y="238">raw guest RAM, 1:1</text>
  <text x="258" y="252">268,435,456 bytes</text>
  <text class="red" x="258" y="266" font-size="10">no encryption, no redaction</text>

  <rect x="480" y="206" width="224" height="66" rx="5" fill="#232333"/>
  <text class="term" x="490" y="224">$ strings snap.mem |</text>
  <text class="term" x="514" y="240">grep -c SECRET_DEMO</text>
  <text class="term" x="490" y="261" font-weight="700" style="fill:#ff8a5c">65</text>
  <text class="m" x="480" y="288">the post's run: c8i.large, nested</text>
  <text class="m" x="16" y="288">guest disk is not in the snapshot: "managed by the users"</text>

  <!-- restore -->
  <text class="lane" x="16" y="312">RESTORE THE SAME FILES N TIMES</text>
  <rect class="box" x="16" y="322" width="216" height="52" rx="4"/>
  <text class="h" x="26" y="339">PUT /snapshot/load</text>
  <text x="26" y="354">File → mmap MAP_PRIVATE</text>
  <text x="26" y="368">Uffd → handler on fault</text>

  <line class="msg" x1="232" y1="348" x2="270" y2="348" marker-end="url(#a)"/>
  <polyline class="msg" points="250,348 250,316 491,316 491,320" marker-end="url(#a)"/>
  <polyline class="msg" points="491,316 638,316 638,320" marker-end="url(#a)"/>

  <rect class="guest" x="272" y="322" width="138" height="52" rx="4"/>
  <rect class="tok" x="392" y="330" width="5" height="12"/>
  <text class="h" x="282" y="339">microVM 1</text>
  <text x="282" y="354">same token</text>
  <text class="m" x="282" y="368">same seeds, entropy</text>
  <rect class="guest" x="422" y="322" width="138" height="52" rx="4"/>
  <rect class="tok" x="542" y="330" width="5" height="12"/>
  <text class="h" x="432" y="339">microVM 2</text>
  <text x="432" y="354">same token</text>
  <text class="m" x="432" y="368">same seeds, entropy</text>
  <rect class="guest" x="572" y="322" width="132" height="52" rx="4"/>
  <rect class="tok" x="686" y="330" width="5" height="12"/>
  <text class="h" x="582" y="339">microVM 3</text>
  <text x="582" y="354">same token</text>
  <text class="m" x="582" y="368">same seeds, entropy</text>

  <!-- quote -->
  <rect x="16" y="390" width="688" height="58" fill="#f5f5f8"/>
  <rect x="16" y="390" width="3" height="58" fill="#ff5f1f"/>
  <text class="q" x="28" y="407">"...guest information assumed to be unique may in fact not be; this information can</text>
  <text class="q" x="28" y="421">include identifiers, random numbers and random number seeds, the guest OS entropy pool,</text>
  <text class="q" x="28" y="435">as well as cryptographic tokens."  <tspan class="m" font-style="normal">Firecracker snapshot-support.md</tspan></text>

  <text x="16" y="470"><tspan class="b">Threat model:</tspan> "the host, host/API communication and snapshot files are trusted."</text>
  <text class="m" x="16" y="486">Who can read snap.mem (backup bucket, CI box, debug dump) is the integrator's problem.</text>

</svg>
