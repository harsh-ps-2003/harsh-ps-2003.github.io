<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Cgroups decide how much, not what</title>
  <desc id="desc">On the left, the cgroup v2 unified hierarchy under /sys/fs/cgroup, with system.slice holding one docker-id.scope per container and its interface files (cpu.max, memory.max, memory.high, memory.events, pids.max, io.max, and cgroup.procs), each mapped to the docker run flag that sets it. On the right, what cgroups do not decide (syscalls, files, network destinations, kernel bugs), and the Leaky Vessels escape, CVE-2024-21626, where runc leaked a file descriptor for the host's /sys/fs/cgroup into the container, WORKDIR /proc/self/fd/7 put the container's working directory in the host mount namespace, and relative paths reached the host root.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c62f2f"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .lane.red { fill: #c62f2f; }
    .m { fill: #5c5c6e; }
    .xs { font-size: 10px; }
    .b { font-weight: 700; }
    .red { fill: #c62f2f; }
    .tree { stroke: #8a8a9a; stroke-width: 1; fill: none; }
    .n { fill: #c62f2f; }
    .nt { fill: #ffffff; font-size: 9.5px; font-weight: 700; }
  </style>

  <text class="k" x="16" y="22">CGROUPS v2</text>
  <text class="t" x="16" y="42">Cgroups decide how much, not what</text>
  <text class="c" x="16" y="60">They meter CPU, memory, IO, and PIDs but don't decide authority, and once they were the way out.</text>

  <!-- LEFT: hierarchy -->
  <text class="lane" x="16" y="84">UNIFIED HIERARCHY · SYSTEMD DRIVER</text>
  <path class="tree" d="M22 108 V406 M22 120 H32 M22 140 H32 M42 148 V180 M42 160 H52 M42 180 H52 M22 406 H32 M62 188 V194"/>
  <text class="b" x="16" y="104">/sys/fs/cgroup</text><text class="m xs" x="112" y="104">one tree, all controllers</text>
  <text class="m" x="36" y="124">init.scope</text>
  <text x="36" y="144">system.slice</text>
  <text class="m" x="56" y="164">containerd.service</text>
  <text class="b" x="56" y="184">docker-&lt;id&gt;.scope</text><text class="m xs" x="172" y="184">one per container</text>

  <rect x="56" y="194" width="296" height="198" rx="4" fill="#e3eefb" stroke="#7aa7d9" stroke-width="1.25"/>
  <g>
    <text class="b" x="64" y="210">cpu.max</text><text x="176" y="210">150000 100000</text>
    <text class="m xs" x="64" y="222">--cpus 1.5 · quota/period, default is max</text>
    <text class="b" x="64" y="237">memory.max</text><text x="176" y="237">536870912</text>
    <text class="m xs" x="64" y="249">--memory 512m · hard cap → OOM kill</text>
    <text class="b" x="64" y="264">memory.high</text><text x="176" y="264">max</text>
    <text class="m xs" x="64" y="276">throttles and reclaims, never OOM kills</text>
    <text class="b" x="64" y="291">memory.events</text><text x="176" y="291">oom_kill 0</text>
    <text class="m xs" x="64" y="303">counts OOM kills in this group</text>
    <text class="b" x="64" y="318">pids.max</text><text x="176" y="318">100</text>
    <text class="m xs" x="64" y="330">--pids-limit 100 · caps fork bombs</text>
    <text class="b" x="64" y="345">io.max</text><text x="176" y="345">8:0 rbps=1048576</text>
    <text class="m xs" x="64" y="357">--device-read-bps · per MAJ:MIN device</text>
    <text class="b" x="64" y="372">cgroup.procs</text><text x="176" y="372">4242</text>
    <text class="m xs" x="64" y="384">PIDs charged to this group</text>
  </g>
  <text class="m" x="36" y="410">user.slice</text>
  <text class="m xs" x="16" y="434">controllers · cpu io memory pids cpuset hugetlb rdma misc</text>

  <!-- RIGHT: what they don't decide -->
  <text class="lane" x="372" y="84">NOT DECIDED BY CGROUPS</text>
  <text x="372" y="104">which syscalls run</text><text class="m" x="544" y="104">seccomp</text>
  <text x="372" y="121">which files it opens</text><text class="m" x="544" y="121">mount ns, DAC, LSM</text>
  <text x="372" y="138">which hosts it reaches</text><text class="m" x="544" y="138">netns + egress rules</text>
  <text x="372" y="155">which kernel bugs it hits</text><text class="m" x="544" y="155">nothing, shared kernel</text>
  <text class="m xs" x="372" y="177" font-style="italic">OOM kill is a resource decision, not containment</text>

  <!-- Leaky Vessels -->
  <text class="lane red" x="372" y="206">BUT CAN BE THE WAY OUT · CVE-2024-21626</text>
  <rect x="372" y="216" width="332" height="100" rx="4" fill="#e9e9ef" stroke="#a3a3b3" stroke-width="1"/>
  <text class="m xs" x="380" y="229">host mount namespace</text>
  <rect x="382" y="236" width="164" height="70" rx="4" fill="#e3eefb" stroke="#7aa7d9" stroke-width="1.25"/>
  <text class="m xs" x="390" y="249">container</text>
  <text class="b" x="390" y="268">runc init</text>
  <text class="xs" x="390" y="286">cwd = /proc/self/fd/7/</text>
  <circle class="n" cx="536" cy="282" r="7"/><text class="nt" x="536" y="285.5" text-anchor="middle">2</text>

  <rect x="584" y="236" width="112" height="22" rx="4" fill="#ffffff" stroke="#232333" stroke-width="1.25"/>
  <text x="640" y="251" text-anchor="middle">/sys/fs/cgroup</text>
  <rect x="584" y="284" width="112" height="22" rx="4" fill="#ffffff" stroke="#c62f2f" stroke-width="1.25"/>
  <text class="red" x="640" y="299" text-anchor="middle">host /</text>

  <line x1="546" y1="262" x2="582" y2="249" stroke="#c62f2f" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle class="n" cx="560" cy="240" r="7"/><text class="nt" x="560" y="243.5" text-anchor="middle">1</text>
  <text class="red xs" x="551" y="276">fd 7</text>
  <line x1="640" y1="258" x2="640" y2="282" stroke="#c62f2f" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="red xs" x="634" y="274" text-anchor="end">../../..</text>
  <circle class="n" cx="654" cy="271" r="7"/><text class="nt" x="654" y="274.5" text-anchor="middle">3</text>

  <g>
    <circle class="n" cx="379" cy="331" r="7"/><text class="nt" x="379" y="334.5" text-anchor="middle">1</text>
    <text x="392" y="335">runc opens host /sys/fs/cgroup, and the fd</text>
    <text class="m" x="392" y="348">leaks into runc init (bug since 2021ish)</text>
    <circle class="n" cx="379" cy="367" r="7"/><text class="nt" x="379" y="370.5" text-anchor="middle">2</text>
    <text x="392" y="371">image sets WORKDIR /proc/self/fd/7/,</text>
    <text class="m" x="392" y="384">chdir follows it into the HOST mount ns</text>
    <circle class="n" cx="379" cy="403" r="7"/><text class="nt" x="379" y="406.5" text-anchor="middle">3</text>
    <text x="392" y="407">../ climbs up to host /, read and</text>
    <text class="m" x="392" y="420">overwrite host binaries → escape</text>
  </g>
  <text class="b" x="372" y="444">Every limit held, and one leaked fd still got out.</text>
  <text class="m xs" x="372" y="460">fixed early 2024 · GHSA-xr7r-f8xq-vfvv</text>

</svg>
