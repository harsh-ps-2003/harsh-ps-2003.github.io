  <text x="256" y="174">process.env</text>
  <rect class="r" x="366" y="140" width="104" height="18" rx="3"/>
  <text x="372" y="153">LLM-written fix</text>
  <rect class="r" x="482" y="140" width="104" height="18" rx="3"/>
  <text x="488" y="153">test fixtures</text>
  <rect class="y" x="482" y="161" width="104" height="18" rx="3"/>
  <text x="488" y="174">exec + network</text>
  <rect class="y" x="598" y="140" width="104" height="18" rx="3"/>
  <text x="604" y="153">repo write</text>
  <text class="lane" x="18" y="202">HELD IN TOTAL (THE PILE ONLY GROWS)</text>
