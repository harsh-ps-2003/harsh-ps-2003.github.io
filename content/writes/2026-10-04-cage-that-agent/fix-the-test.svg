  <text class="m" x="38" y="395">authority the session holds</text>
  <rect class="r" x="226" y="386" width="14" height="10" rx="2"/>
  <text class="m" x="246" y="395">untrusted input shaping behaviour</text>
  <rect class="g" x="476" y="386" width="14" height="10" rx="2"/>
