  <line x1="16" y1="248" x2="704" y2="248" stroke="#232333" stroke-width="1"/>
  <text class="lane" x="18" y="266">WORST CASE AT THIS STEP</text>
  <text class="red" x="18" y="282">token readable</text>
  <text class="red" x="18" y="295">by the process</text>
  <text class="red" x="134" y="282">reads way beyond</text>
  <text class="red" x="134" y="295">the task</text>
  <text class="red" x="250" y="282">install script</text>
  <text class="red" x="250" y="295">steals env vars</text>
  <text class="red" x="366" y="282">edits files it</text>
  <text class="red" x="366" y="295">shouldn&#x27;t touch</text>
  <text class="red" x="482" y="282">test code runs</text>
  <text class="red" x="482" y="295">fixture input</text>
  <text class="red" x="598" y="282">pushes whatever</text>
  <text class="red" x="598" y="295">changed</text>
  <text class="lane" x="18" y="320">WHAT STOPS IT (GATES FROM DEFENSE IN DEPTH)</text>
  <rect class="g" x="18" y="328" width="104" height="50" rx="4"/>
  <text class="acc" x="24" y="342">gate 5</text>
  <text x="24" y="356">scoped token</text>
  <text x="24" y="369">minted per call</text>
  <rect class="g" x="134" y="328" width="104" height="50" rx="4"/>
  <text class="acc" x="140" y="342">gate 3</text>
  <text x="140" y="356">fs scoped to</text>
  <text x="140" y="369">the workspace</text>
  <rect class="g" x="250" y="328" width="104" height="50" rx="4"/>
  <text class="acc" x="256" y="342">gates 4 + 5</text>
  <text x="256" y="356">empty env +</text>
  <text x="256" y="369">allowlisted net</text>
  <rect class="g" x="366" y="328" width="104" height="50" rx="4"/>
  <text class="acc" x="372" y="342">gate 2</text>
  <text x="372" y="356">path policy on</text>
  <text x="372" y="369">which files</text>
  <rect class="g" x="482" y="328" width="104" height="50" rx="4"/>
  <text class="acc" x="488" y="342">gates 3 + 4</text>
  <text x="488" y="356">microVM +</text>
  <text x="488" y="369">default-deny</text>
  <rect class="g" x="598" y="328" width="104" height="50" rx="4"/>
  <text class="acc" x="604" y="342">gate 6</text>
  <text x="604" y="356">push a branch,</text>
  <text x="604" y="369">a human merges</text>
