<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">One failing test, six steps</title>
  <desc id="desc">Six steps of a routine coding-agent task: git clone, read code, pnpm install, write fix, pnpm test and git push. For each step the figure shows what the session newly holds (credentials in yellow, untrusted input in red), a meter of everything held so far that grows from 2 to 9 items, the worst case at that step, and which defense-in-depth gate stops it.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; }
    .b { font-size: 11.5px; font-weight: 700; }
    .s { font-size: 10.5px; }
    .red { fill: #c62f2f; }
    .acc { fill: #c2410c; font-weight: 600; }
    .grn { fill: #2f7a47; }
    .step { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .y { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1; }
    .r { fill: #fbe5e3; stroke: #c62f2f; stroke-width: 1; }
    .g { fill: #e2f2e6; stroke: #5ea876; stroke-width: 1.25; }
    .app { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1.25; }
    .host { fill: #e9e9ef; stroke: #a3a3b3; stroke-width: 1; }
    .sentry { fill: #ece6f7; stroke: #9b86c9; stroke-width: 1.25; }
    .band { fill: #f5f5f8; stroke: #c3c3cf; stroke-width: 1; }
    .pip0 { fill: #ffffff; stroke: #c3c3cf; stroke-width: 1; }
    .ln { stroke: #232333; stroke-width: 1.25; fill: none; }
  </style>

  <text class="k" x="16" y="22">IN PRACTICE</text>
  <text class="t" x="16" y="42">One failing test: what each step adds, and what stops it</text>
  <text class="c" x="16" y="60">Each step hands the session something new, nothing is handed back, and each risk has a gate.</text>
  <rect class="step" x="18" y="74" width="104" height="36" rx="4"/>
  <text class="b" x="26" y="89">git clone</text>
  <text class="m" x="26" y="103">needs a token</text>
  <line class="ln" x1="122" y1="92" x2="132" y2="92" marker-end="url(#a)"/>
  <rect class="step" x="134" y="74" width="104" height="36" rx="4"/>
  <text class="b" x="142" y="89">read code</text>
  <text class="m" x="142" y="103">test + source</text>
  <line class="ln" x1="238" y1="92" x2="248" y2="92" marker-end="url(#a)"/>
  <rect class="step" x="250" y="74" width="104" height="36" rx="4"/>
  <text class="b" x="258" y="89">pnpm install</text>
  <text class="m" x="258" y="103">100s of pkgs</text>
  <line class="ln" x1="354" y1="92" x2="364" y2="92" marker-end="url(#a)"/>
  <rect class="step" x="366" y="74" width="104" height="36" rx="4"/>
  <text class="b" x="374" y="89">write fix</text>
  <text class="m" x="374" y="103">unreviewed</text>
  <line class="ln" x1="470" y1="92" x2="480" y2="92" marker-end="url(#a)"/>
  <rect class="step" x="482" y="74" width="104" height="36" rx="4"/>
  <text class="b" x="490" y="89">pnpm test</text>
  <text class="m" x="490" y="103">runs it all</text>
  <line class="ln" x1="586" y1="92" x2="596" y2="92" marker-end="url(#a)"/>
  <rect class="step" x="598" y="74" width="104" height="36" rx="4" style="stroke:#ff5f1f;stroke-width:1.75"/>
  <text class="b" x="606" y="89">git push</text>
  <text class="m" x="606" y="103">repo write</text>
  <text class="lane" x="18" y="132">NEW IN THE SESSION</text>
  <rect class="y" x="18" y="140" width="104" height="18" rx="3"/>
