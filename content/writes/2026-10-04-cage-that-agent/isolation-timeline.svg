<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 578" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Linux isolation, bolted on over 20ish years</title>
  <desc id="desc">Timeline from 2002 to 2026 in six lanes (namespaces, cgroups, syscall filtering, capabilities and LSMs, runtimes, and container escape CVEs). The pieces arrived one at a time, the escapes cluster after 2019 and sit mostly in runtime setup code, and Copy Fail in 2026 is a bug in the shared kernel itself.</desc>
  <style>
    text { fill: #232333; font-size: 10px; }
    .m { fill: #5c5c6e; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .yr { font-size: 10px; fill: #a0a0b0; }
    .yr.on { fill: #232333; font-weight: 600; }
    .note { font-size: 10px; fill: #5c5c6e; font-style: italic; }
    .red { fill: #c62f2f; }
    .dot { fill: #232333; }
    .dot.rt { fill: #ff5f1f; }
    .dot.cve { fill: #c62f2f; }
    .dot.kcve { fill: none; stroke: #c62f2f; stroke-width: 1.4; }
  </style>

  <text class="k" x="16" y="22">LINUX ISOLATION · 2002 → 2026</text>
  <text class="t" x="16" y="42">Bolted on over 20ish years</text>
  <text class="c" x="16" y="60">Each piece shipped to fix the problem of its year, and nobody looked after the gaps between them.</text>

  <!-- 5-year bands -->
  <g fill="#f5f5f8">
    <rect x="12" y="145" width="696" height="97"/>
    <rect x="12" y="327" width="696" height="107"/>
    <rect x="12" y="533" width="696" height="34"/>
  </g>
  <!-- lane separators -->
  <g stroke="#dcdce4" stroke-width="1">
    <line x1="44" y1="74" x2="44" y2="567"/>
    <line x1="144" y1="74" x2="144" y2="567"/>
    <line x1="232" y1="74" x2="232" y2="567"/>
    <line x1="332" y1="74" x2="332" y2="567"/>
    <line x1="440" y1="74" x2="440" y2="567"/>
    <line x1="544" y1="74" x2="544" y2="567"/>
  </g>
  <line x1="12" y1="92" x2="708" y2="92" stroke="#232333" stroke-width="1"/>
  <line x1="12" y1="567" x2="708" y2="567" stroke="#232333" stroke-width="1"/>

  <!-- lane headers -->
  <text class="lane" x="50" y="86">NAMESPACES</text>
  <text class="lane" x="150" y="86">CGROUPS</text>
  <text class="lane" x="238" y="86">SECCOMP</text>
  <text class="lane" x="338" y="86">CAPS / LSM</text>
  <text class="lane" x="446" y="86">RUNTIMES</text>
  <text class="lane" x="550" y="86">ESCAPES (CVE)</text>

  <!-- years (row top = baseline - 12) -->
  <g text-anchor="end">
    <text class="yr on" x="38" y="106">2002</text>
    <text class="yr on" x="38" y="123">2003</text>
    <text class="yr" x="38" y="140">2004</text>
    <text class="yr on" x="38" y="157">2005</text>
    <text class="yr on" x="38" y="174">2006</text>
    <text class="yr" x="38" y="203">2007</text>
    <text class="yr on" x="38" y="220">2008</text>
    <text class="yr on" x="38" y="237">2009</text>
    <text class="yr on" x="38" y="254">2010</text>
    <text class="yr" x="38" y="271">2011</text>
    <text class="yr on" x="38" y="288">2012</text>
    <text class="yr on" x="38" y="305">2013</text>
    <text class="yr" x="38" y="322">2014</text>
    <text class="yr on" x="38" y="339">2015</text>
    <text class="yr on" x="38" y="356">2016</text>
    <text class="yr on" x="38" y="373">2017</text>
    <text class="yr on" x="38" y="390">2018</text>
    <text class="yr on" x="38" y="419">2019</text>
    <text class="yr on" x="38" y="448">2020</text>
    <text class="yr on" x="38" y="465">2021</text>
    <text class="yr on" x="38" y="482">2022</text>
    <text class="yr on" x="38" y="499">2023</text>
    <text class="yr on" x="38" y="516">2024</text>
    <text class="yr on" x="38" y="545">2025</text>
    <text class="yr on" x="38" y="562">2026</text>
  </g>

  <!-- NAMESPACES (x 44..144) -->
  <circle class="dot" cx="51" cy="102.5" r="2.5"/><text x="57" y="106">mnt</text>
  <circle class="dot" cx="51" cy="170.5" r="2.5"/><text x="57" y="174">uts + ipc</text>
  <circle class="dot" cx="51" cy="216.5" r="2.5"/><text x="57" y="220">pid</text>
  <circle class="dot" cx="51" cy="233.5" r="2.5"/><text x="57" y="237">net</text>
  <circle class="dot" cx="51" cy="301.5" r="2.5"/><text x="57" y="305" font-weight="600">user</text>
  <circle class="dot" cx="51" cy="352.5" r="2.5"/><text x="57" y="356">cgroup</text>
  <circle class="dot" cx="51" cy="444.5" r="2.5"/><text x="57" y="448">time</text>
  <text class="note" x="50" y="254">changes what a</text>
  <text class="note" x="50" y="267">process sees,</text>
  <text class="note" x="50" y="280">not what the</text>
  <text class="note" x="50" y="293">kernel does</text>

  <!-- CGROUPS (x 144..232) -->
  <circle class="dot" cx="151" cy="170.5" r="2.5"/><text x="157" y="174">process</text><text x="157" y="186">containers</text>
  <text class="m" x="157" y="198">(Google)</text>
  <circle class="dot" cx="151" cy="216.5" r="2.5"/><text x="157" y="220">cgroups v1</text>
  <circle class="dot" cx="151" cy="352.5" r="2.5"/><text x="157" y="356">cgroups v2</text>
  <text class="note" x="150" y="254">built for</text>
  <text class="note" x="150" y="267">accounting,</text>
  <text class="note" x="150" y="280">not security</text>

  <!-- SYSCALL FILTER (x 232..332) -->
  <circle class="dot" cx="239" cy="153.5" r="2.5"/><text x="245" y="157">strict mode</text>
  <circle class="dot" cx="239" cy="284.5" r="2.5"/><text x="245" y="288">BPF filters</text>
  <circle class="dot" cx="239" cy="352.5" r="2.5"/><text x="245" y="356">Docker profile</text>

  <!-- CAPS / LSM (x 332..440) -->
  <circle class="dot" cx="339" cy="119.5" r="2.5"/><text x="345" y="123">SELinux</text>
  <circle class="dot" cx="339" cy="250.5" r="2.5"/><text x="345" y="254">AppArmor</text>
  <circle class="dot" cx="339" cy="444.5" r="2.5"/><text x="345" y="448">CAP_BPF</text>
  <circle class="dot" cx="339" cy="461.5" r="2.5"/><text x="345" y="465" font-weight="600">Landlock</text>
  <circle class="dot" cx="339" cy="541.5" r="2.5"/><text x="345" y="545">Landlock audit</text>

  <!-- RUNTIMES (x 440..544) -->
  <circle class="dot rt" cx="447" cy="216.5" r="2.5"/><text x="453" y="220">LXC</text>
  <circle class="dot rt" cx="447" cy="301.5" r="2.5"/><text x="453" y="305" font-weight="600">Docker</text>
  <circle class="dot rt" cx="447" cy="335.5" r="2.5"/><text x="453" y="339">OCI + runc</text>
  <circle class="dot rt" cx="447" cy="369.5" r="2.5"/><text x="453" y="373">Kata</text>
  <circle class="dot rt" cx="447" cy="386.5" r="2.5"/><text x="453" y="390">gVisor</text>
  <circle class="dot rt" cx="447" cy="398.5" r="2.5"/><text x="453" y="402">Firecracker</text>
  <circle class="dot rt" cx="447" cy="495.5" r="2.5"/><text x="453" y="499">gVisor systrap</text>
  <circle class="dot rt" cx="447" cy="541.5" r="2.5"/><text x="453" y="545">Agent Sandbox</text>

  <!-- ESCAPES (x 544..708) -->
  <circle class="dot cve" cx="551" cy="119.5" r="2.5"/><text class="m" x="557" y="123">runtime / tooling bug</text>
  <circle class="dot kcve" cx="551" cy="136.5" r="2.5"/><text class="m" x="557" y="140">bug in shared kernel</text>
  <circle class="dot kcve" cx="551" cy="301.5" r="2.5"/><text class="red" x="557" y="305">CVE-2013-1858 userns</text>
  <circle class="dot cve" cx="551" cy="415.5" r="2.5"/><text class="red" x="557" y="419">CVE-2019-5736 runc exe</text>
  <circle class="dot cve" cx="551" cy="427.5" r="2.5"/><text class="red" x="557" y="431">CVE-2019-14271 docker cp</text>
  <circle class="dot cve" cx="551" cy="444.5" r="2.5"/><text class="red" x="557" y="448">CVE-2020-15257 shim</text>
  <circle class="dot cve" cx="551" cy="461.5" r="2.5"/><text class="red" x="557" y="465">CVE-2021-30465 mnt race</text>
  <circle class="dot cve" cx="551" cy="478.5" r="2.5"/><text class="red" x="557" y="482">CVE-2022-0811 sysctl</text>
  <circle class="dot kcve" cx="551" cy="512.5" r="2.5"/><text class="red" x="557" y="516">CVE-2024-1086 nftables</text>
  <circle class="dot cve" cx="551" cy="524.5" r="2.5"/><text class="red" x="557" y="528">CVE-2024-21626 fd leak</text>
  <circle class="dot cve" cx="551" cy="541.5" r="2.5"/><text class="red" x="557" y="545">CVE-2025-31133 +2 runc</text>
  <circle class="dot kcve" cx="551" cy="558.5" r="2.5"/><text class="red" x="557" y="562" font-weight="700">CVE-2026-31431 Copy Fail</text>

</svg>
