<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Already inside the boundary</title>
  <desc id="desc">Trusted inputs (system prompt, user message) and untrusted inputs (web pages, issue bodies, email, tool output) are concatenated into one context window. The model reads one flat token stream and emits hundreds of tool calls that spend authority approved once, like shell, files, credentials, network egress, and external writes. Tool results loop back in as more untrusted input. Private data, untrusted content, and an exfiltration channel together form the lethal trifecta.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c62f2f"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 11px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { fill: #5c5c6e; }
    .xs { font-size: 10px; }
    .b { font-weight: 700; }
    .red { fill: #c62f2f; }
    .box { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .ubox { fill: #fbe5e3; stroke: #c62f2f; stroke-width: 1.25; }
    .cred { fill: #fbf1cf; stroke: #232333; stroke-width: 1.25; }
    .tk { fill: #e1e1e8; }
    .tku { fill: #f3c9c4; }
    .n { fill: #ff5f1f; }
    .nt { fill: #ffffff; font-size: 9.5px; font-weight: 700; }
  </style>

  <text class="k" x="16" y="22">THREAT MODEL</text>
  <text class="t" x="16" y="42">Already inside the boundary</text>
  <text class="c" x="16" y="60">Instructions and data share one context, and every tool call spends a permission you gave once.</text>

  <!-- column headers -->
  <text class="lane" x="16" y="84">EVERYTHING IT READS</text>
  <text class="lane" x="236" y="84">CONTEXT WINDOW</text>
  <text class="lane" x="508" y="84">AUTHORITY (APPROVED ONCE)</text>

  <!-- A: inputs (rows y = 94 + 28i, h 22) -->
  <rect class="box" x="16" y="94" width="180" height="22" rx="4"/>
  <text x="24" y="109">system prompt</text><text class="m xs" x="188" y="109" text-anchor="end">trusted</text>
  <rect class="box" x="16" y="122" width="180" height="22" rx="4"/>
  <text x="24" y="137">user message</text><text class="m xs" x="188" y="137" text-anchor="end">trusted</text>
  <rect class="ubox" x="16" y="150" width="180" height="22" rx="4"/>
  <text x="24" y="165">web page / README</text>
  <rect class="ubox" x="16" y="178" width="180" height="22" rx="4"/>
  <text x="24" y="193">GitHub issue body</text>
  <rect class="ubox" x="16" y="206" width="180" height="22" rx="4"/>
  <text x="24" y="221">email · Slack · doc</text>
  <rect class="ubox" x="16" y="234" width="180" height="22" rx="4"/>
  <text x="24" y="249">tool output</text>
  <g>
    <circle class="n" cx="185" cy="161" r="7"/><text class="nt" x="185" y="164.5" text-anchor="middle">2</text>
    <circle class="n" cx="185" cy="189" r="7"/><text class="nt" x="185" y="192.5" text-anchor="middle">2</text>
    <circle class="n" cx="185" cy="217" r="7"/><text class="nt" x="185" y="220.5" text-anchor="middle">2</text>
    <circle class="n" cx="185" cy="245" r="7"/><text class="nt" x="185" y="248.5" text-anchor="middle">2</text>
  </g>

  <!-- A -> B arrows -->
  <g stroke="#232333" stroke-width="1.25" marker-end="url(#a)">
    <line x1="198" y1="105" x2="234" y2="105"/>
    <line x1="198" y1="133" x2="234" y2="133"/>
    <line x1="198" y1="161" x2="234" y2="161"/>
    <line x1="198" y1="189" x2="234" y2="189"/>
    <line x1="198" y1="217" x2="234" y2="217"/>
    <line x1="198" y1="245" x2="234" y2="245"/>
  </g>

  <!-- B: context window, one row of tokens per source -->
  <rect x="236" y="90" width="180" height="170" rx="5" fill="#f5f5f8" stroke="#232333" stroke-width="1.25"/>
  <g class="tk">
    <rect x="248" y="98" width="11" height="14"/><rect x="261" y="98" width="11" height="14"/><rect x="274" y="98" width="11" height="14"/><rect x="287" y="98" width="11" height="14"/><rect x="300" y="98" width="11" height="14"/><rect x="313" y="98" width="11" height="14"/><rect x="326" y="98" width="11" height="14"/><rect x="339" y="98" width="11" height="14"/><rect x="352" y="98" width="11" height="14"/><rect x="365" y="98" width="11" height="14"/><rect x="378" y="98" width="11" height="14"/><rect x="391" y="98" width="11" height="14"/>
    <rect x="248" y="126" width="11" height="14"/><rect x="261" y="126" width="11" height="14"/><rect x="274" y="126" width="11" height="14"/><rect x="287" y="126" width="11" height="14"/><rect x="300" y="126" width="11" height="14"/><rect x="313" y="126" width="11" height="14"/><rect x="326" y="126" width="11" height="14"/>
  </g>
  <g class="tku">
    <rect x="248" y="154" width="11" height="14"/><rect x="261" y="154" width="11" height="14"/><rect x="274" y="154" width="11" height="14"/><rect x="287" y="154" width="11" height="14"/><rect x="300" y="154" width="11" height="14"/><rect x="313" y="154" width="11" height="14"/><rect x="326" y="154" width="11" height="14"/><rect x="339" y="154" width="11" height="14"/><rect x="352" y="154" width="11" height="14"/><rect x="365" y="154" width="11" height="14"/><rect x="378" y="154" width="11" height="14"/><rect x="391" y="154" width="11" height="14"/>
    <rect x="248" y="182" width="11" height="14"/><rect x="261" y="182" width="11" height="14"/><rect x="274" y="182" width="11" height="14"/><rect x="287" y="182" width="11" height="14"/><rect x="300" y="182" width="11" height="14"/><rect x="313" y="182" width="11" height="14"/><rect x="326" y="182" width="11" height="14"/><rect x="339" y="182" width="11" height="14"/><rect x="352" y="182" width="11" height="14"/>
    <rect x="248" y="210" width="11" height="14"/><rect x="261" y="210" width="11" height="14"/><rect x="274" y="210" width="11" height="14"/><rect x="287" y="210" width="11" height="14"/><rect x="300" y="210" width="11" height="14"/><rect x="313" y="210" width="11" height="14"/><rect x="326" y="210" width="11" height="14"/><rect x="339" y="210" width="11" height="14"/><rect x="352" y="210" width="11" height="14"/><rect x="365" y="210" width="11" height="14"/><rect x="378" y="210" width="11" height="14"/>
    <rect x="248" y="238" width="11" height="14"/><rect x="261" y="238" width="11" height="14"/><rect x="274" y="238" width="11" height="14"/><rect x="287" y="238" width="11" height="14"/><rect x="300" y="238" width="11" height="14"/><rect x="313" y="238" width="11" height="14"/><rect x="326" y="238" width="11" height="14"/><rect x="339" y="238" width="11" height="14"/>
  </g>
  <!-- injected instruction hiding in the issue body -->
  <rect x="300" y="182" width="63" height="14" fill="none" stroke="#c62f2f" stroke-width="1.25"/>
  <text class="red xs" x="368" y="193">inject</text>
  <text class="m xs" x="236" y="276">colours are only for you,</text>
  <text class="m xs" x="236" y="289">the model sees one stream</text>

  <!-- model -->
  <rect class="box" x="236" y="298" width="180" height="38" rx="5"/>
  <text class="b" x="246" y="314">model</text>
  <text class="m xs" x="246" y="328">probabilistic policy</text>
  <line x1="404" y1="262" x2="404" y2="296" stroke="#232333" stroke-width="1.25" marker-end="url(#a)"/>

  <!-- bus: model -> tool calls -->
  <polyline points="416,317 490,317 490,105" fill="none" stroke="#232333" stroke-width="1.25"/>
  <g stroke="#232333" stroke-width="1.25" marker-end="url(#a)">
    <line x1="490" y1="105" x2="506" y2="105"/>
    <line x1="490" y1="133" x2="506" y2="133"/>
    <line x1="490" y1="161" x2="506" y2="161"/>
    <line x1="490" y1="189" x2="506" y2="189"/>
    <line x1="490" y1="217" x2="506" y2="217"/>
  </g>
  <text class="xs" x="422" y="311">tool calls</text>
  <text class="m xs" x="422" y="331">x100s</text>

  <!-- C: authority -->
  <rect class="box" x="508" y="94" width="196" height="22" rx="4"/>
  <text x="516" y="109"><tspan class="b">shell</tspan> · exec anything</text>
  <rect class="box" x="508" y="122" width="196" height="22" rx="4"/>
  <text x="516" y="137"><tspan class="b">files</tspan> · repo ~/.ssh .env</text>
  <rect class="cred" x="508" y="150" width="196" height="22" rx="4"/>
  <text x="516" y="165"><tspan class="b">creds</tspan> · PAT, AWS, DB</text>
  <rect class="box" x="508" y="178" width="196" height="22" rx="4"/>
  <text x="516" y="193"><tspan class="b">egress</tspan> · curl any host</text>
  <rect class="box" x="508" y="206" width="196" height="22" rx="4"/>
  <text x="516" y="221"><tspan class="b">writes</tspan> · push, deploy</text>
  <circle class="n" cx="693" cy="133" r="7"/><text class="nt" x="693" y="136.5" text-anchor="middle">1</text>
  <circle class="n" cx="693" cy="161" r="7"/><text class="nt" x="693" y="164.5" text-anchor="middle">1</text>
  <circle class="n" cx="693" cy="189" r="7"/><text class="nt" x="693" y="192.5" text-anchor="middle">3</text>

  <!-- feedback loop -->
  <polyline points="606,230 606,356 106,356 106,258" fill="none" stroke="#c62f2f" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text class="red xs" x="356" y="350" text-anchor="middle">results re-enter the context as more input</text>

  <!-- legend -->
  <circle class="n" cx="23" cy="381" r="7"/><text class="nt" x="23" y="384.5" text-anchor="middle">1</text>
  <text x="35" y="385">private data</text>
  <circle class="n" cx="153" cy="381" r="7"/><text class="nt" x="153" y="384.5" text-anchor="middle">2</text>
  <text x="165" y="385">untrusted content</text>
  <circle class="n" cx="319" cy="381" r="7"/><text class="nt" x="319" y="384.5" text-anchor="middle">3</text>
  <text x="331" y="385">exfiltration channel</text>
  <text class="b" x="497" y="385">= lethal trifecta</text>
  <text class="m xs" x="16" y="403">With all three in place, one poisoned sentence is enough, no exploit chain or 0-day needed.</text>

</svg>
