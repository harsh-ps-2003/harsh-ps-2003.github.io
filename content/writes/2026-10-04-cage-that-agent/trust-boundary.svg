<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Already inside the boundary</title>
  <desc id="desc">Trusted inputs (system prompt, user message) and untrusted inputs (web pages, issue bodies, email, tool output) are concatenated into one context window. The model reads one flat token stream and emits hundreds of tool calls that spend authority approved once, like shell, files, credentials, network egress, and external writes. Tool results loop back in as more untrusted input. Private data, untrusted content, and an exfiltration channel together form the lethal trifecta.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 13px; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .h { font-weight: 700; }
    .b { font-size: 13px; }
    .m { font-size: 13px; }
  </style>
  <text class="t" x="24" y="36">Already inside the boundary</text>
  <text class="s" x="24" y="64">Instructions and data share one context. A tool call spends a permission given once.</text>
  <path d="M 24.0 86.0 Q 125.3 82.4 226.7 86.0 Q 230.4 193.0 226.7 300.0 Q 125.3 303.4 24.0 300.0 Q 20.4 193.0 24.0 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="42.0" y="112.0">what it reads</text>
  <text class="b" x="42.0" y="140.0">system prompt</text>
  <text class="b" x="42.0" y="168.0">user message</text>
  <text class="b" x="42.0" y="196.0">web page</text>
  <text class="b" x="42.0" y="224.0">issue body</text>
  <text class="b" x="42.0" y="252.0">email, Slack, doc</text>
  <text class="b" x="42.0" y="280.0">tool output</text>
  <path d="M 258.7 86.0 Q 360.0 82.3 461.3 86.0 Q 464.8 193.0 461.3 300.0 Q 360.0 303.6 258.7 300.0 Q 255.0 193.0 258.7 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="276.7" y="112.0">one context window</text>
  <text class="b" x="276.7" y="140.0">system prompt</text>
  <text class="b" x="276.7" y="168.0">user message</text>
  <text class="b" x="276.7" y="196.0">web page</text>
  <text class="b" x="276.7" y="224.0">issue body: inject</text>
  <text class="b" x="276.7" y="252.0">email, Slack, doc</text>
  <text class="b" x="276.7" y="280.0">tool output</text>
  <path d="M 493.3 86.0 Q 594.7 82.5 696.0 86.0 Q 699.6 193.0 696.0 300.0 Q 594.7 303.7 493.3 300.0 Q 489.9 193.0 493.3 86.0 Z" fill="#ffffff" stroke="#232333" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="h" x="511.3" y="112.0">spent once</text>
  <text class="b" x="511.3" y="140.0">shell</text>
  <text class="b" x="511.3" y="168.0">files</text>
  <text class="b" x="511.3" y="196.0">credentials</text>
  <text class="b" x="511.3" y="224.0">any host</text>
  <text class="b" x="511.3" y="252.0">push, deploy</text>
  <text class="b" x="511.3" y="280.0">hundreds of calls</text>
  <line x1="232.7" y1="193.0" x2="248.7" y2="193.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="467.3" y1="193.0" x2="483.3" y2="193.0" stroke="#232333" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="m" x="24.0" y="362.0">the model cannot tell these apart. results come back as more input.</text>
</svg>
