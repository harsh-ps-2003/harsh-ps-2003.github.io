<rect class="p ct" x="452.0" y="569.5" width="64.0" height="14" rx="3"/>
<text class="pt" x="457.0" y="580.0">container</text>
  <text class="m" x="521.0" y="580">shared host kernel</text>
  <text class="src" x="16" y="602">E2B and Fly Sprites (orange) both run Firecracker but sit in opposite cells.</text>
</svg>
