<text class="pt" x="493.4" y="126.0">preview</text>
  <text class="m" x="547.4" y="126">session storage, ~1 GB</text>
  <text class="m" x="696" y="170" text-anchor="end" font-style="italic">barely exists outside AgentCore</text>
  <rect class="empty" x="112" y="182" width="292" height="160" rx="5"/>
  <text class="m" x="258.0" y="266.0" text-anchor="middle">no vendor in this map</text>
  <rect class="cell" x="412" y="182" width="292" height="160" rx="5"/>
  <text class="n hl" x="422" y="200">Fly Sprites</text>
<rect class="p hw" x="501.6" y="189.5" width="22.0" height="14" rx="3"/>
<text class="pt" x="506.6" y="200.0">FC</text>
  <text class="m" x="530.6" y="200">metadata-only checkpoint</text>
  <text class="n" x="422" y="216">Vercel Sandbox</text>
<rect class="p hw" x="521.4" y="205.5" width="22.0" height="14" rx="3"/>
<text class="pt" x="526.4" y="216.0">FC</text>
  <text class="n" x="422" y="232">Together Code Sandbox</text>
<rect class="p hw" x="567.6" y="221.5" width="52.0" height="14" rx="3"/>
<text class="pt" x="572.6" y="232.0">microVM</text>
  <text class="n" x="422" y="248">Cursor Cloud Agents</text>
<rect class="p hw" x="554.4" y="237.5" width="22.0" height="14" rx="3"/>
