  <text class="n" x="16" y="556">Northflank</text>
<rect class="p hw" x="89.0" y="545.5" width="52.0" height="14" rx="3"/>
<text class="pt" x="94.0" y="556.0">microVM</text>
<rect class="p gv" x="146.0" y="545.5" width="46.0" height="14" rx="3"/>
<text class="pt" x="151.0" y="556.0">gVisor</text>
  <text class="m" x="199.0" y="556">Kata on Cloud Hypervisor or gVisor, ephemeral and persistent, BYOC</text>
<rect class="p hw" x="16.0" y="569.5" width="22.0" height="14" rx="3"/>
<text class="pt" x="21.0" y="580.0">FC</text>
  <text class="m" x="43.0" y="580">own kernel (Firecracker, microVM, VM)</text>
<rect class="p gv" x="285.0" y="569.5" width="46.0" height="14" rx="3"/>
<text class="pt" x="290.0" y="580.0">gVisor</text>
