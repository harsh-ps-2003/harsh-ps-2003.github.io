<text class="pt" x="513.2" y="264.0">k8s / VM</text>
  <text class="n" x="422" y="280">Manus Cloud Computer</text>
<rect class="p un" x="561.0" y="269.5" width="58.0" height="14" rx="3"/>
<text class="pt" x="566.0" y="280.0">unstated</text>
  <text class="n" x="422" y="296">Daytona</text>
<rect class="p ct" x="475.2" y="285.5" width="64.0" height="14" rx="3"/>
<text class="pt" x="480.2" y="296.0">container</text>
  <text class="m" x="546.2" y="296">Sysbox</text>
  <text class="n" x="422" y="312">Cloudflare Sandboxes</text>
<rect class="p ct" x="561.0" y="301.5" width="64.0" height="14" rx="3"/>
<text class="pt" x="566.0" y="312.0">container</text>
  <text class="m" x="696" y="334" text-anchor="end" font-style="italic">crowded in 2026</text>
  <rect class="cell" x="112" y="358" width="292" height="64" rx="5"/>
  <text class="n" x="122" y="376">Modal</text>
<rect class="p gv" x="162.0" y="365.5" width="46.0" height="14" rx="3"/>
<text class="pt" x="167.0" y="376.0">gVisor</text>
  <text class="m" x="215.0" y="376">CUDA checkpoint/restore</text>
  <rect class="thin" x="412" y="358" width="292" height="64" rx="5"/>
  <text class="badge" x="422" y="414">THIN</text>
  <text class="n" x="422" y="376">Modal GPU snapshots</text>
<rect class="p mat" x="554.4" y="365.5" width="40.0" height="14" rx="3"/>
<text class="pt" x="559.4" y="376.0">alpha</text>
  <text class="n" x="422" y="392">GKE Pod Snapshots</text>
<rect class="p mat" x="541.2" y="381.5" width="52.0" height="14" rx="3"/>
<text class="pt" x="546.2" y="392.0">preview</text>
  <text class="m" x="600.2" y="392">incl. GPU</text>
  <rect class="empty" x="112" y="426" width="292" height="72" rx="5"/>
  <text class="m" x="258.0" y="466.0" text-anchor="middle">no vendor in this map</text>
  <rect class="cell" x="412" y="426" width="292" height="72" rx="5"/>
  <text class="n" x="422" y="444">RunPod, Lightning, Lambda</text>
<rect class="p hw" x="594.0" y="433.5" width="22.0" height="14" rx="3"/>
