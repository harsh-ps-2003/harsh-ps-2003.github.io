  <text class="n" x="16" y="538">GKE Agent Sandbox</text>
<rect class="p gv" x="135.2" y="527.5" width="46.0" height="14" rx="3"/>
<text class="pt" x="140.2" y="538.0">gVisor</text>
<rect class="p hw" x="186.2" y="527.5" width="52.0" height="14" rx="3"/>
<text class="pt" x="191.2" y="538.0">microVM</text>
