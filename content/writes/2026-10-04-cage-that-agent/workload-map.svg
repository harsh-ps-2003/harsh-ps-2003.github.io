<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Agent sandbox workload map</title>
  <desc id="desc">Eight cells from three axes, ephemeral or persistent, CPU or GPU, and stateless or stateful. E2B sits in ephemeral CPU stateless on Firecracker, Modal in ephemeral GPU stateless on gVisor, and Fly Sprites in persistent CPU stateful on Firecracker. Persistent CPU stateful is crowded (Vercel, Together, Cursor, Coder, Manus, Daytona, Cloudflare), the ephemeral stateful cells are thin, the persistent stateless cells are empty, and persistent GPU stateful has VM substrate but no agent-first product. GKE Agent Sandbox and Northflank span cells depending on configuration.</desc>
  <style>
    text { fill: #232333; font-size: 11px; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .t { font-size: 15px; font-weight: 700; }
    .c { font-size: 11.5px; fill: #5c5c6e; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
    .m { font-size: 10px; fill: #5c5c6e; }
    .n { font-weight: 700; }
    .hl { fill: #e8531a; }
    .src { font-size: 9.5px; fill: #5c5c6e; }
    .cell { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .thin { fill: #f5f5f8; stroke: #232333; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .empty { fill: url(#hatch); stroke: #c3c3cf; stroke-width: 1; stroke-dasharray: 4 3; }
    .band { fill: #f5f5f8; }
    .p { stroke-width: 1; }
    .pt { font-size: 10px; }
    .hw { fill: #e2f2e6; stroke: #5ea876; }
    .gv { fill: #ece6f7; stroke: #9b86c9; }
    .ct { fill: #e3eefb; stroke: #7aa7d9; }
    .un { fill: #ffffff; stroke: #a3a3b3; stroke-dasharray: 2 2; }
    .mat { fill: #ffede4; stroke: #ff5f1f; }
    .badge { font-size: 10px; font-weight: 600; letter-spacing: .08em; fill: #5c5c6e; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e4e4ea" stroke-width="2"/>
    </pattern>
  </defs>
  <text class="k" x="16" y="22">WORKLOAD MODEL</text>
  <text class="t" x="16" y="42">Pick the cell first, then the vendor</text>
  <text class="c" x="16" y="60">Three axes give 8 cells, and one primitive can ship as very different products.</text>
  <text class="lane" x="112" y="88">STATELESS</text><text class="m" x="182.0" y="88">each call independent</text>
  <text class="lane" x="412" y="88">STATEFUL</text><text class="m" x="474.0" y="88">named box, fs + procs persist</text>
  <line x1="16" y1="96" x2="704" y2="96" stroke="#c3c3cf" stroke-width="1"/>
  <rect class="band" x="16" y="108" width="18" height="234" rx="3"/>
  <text class="lane" transform="translate(29 225.0) rotate(-90)" text-anchor="middle" style="fill:#232333">CPU</text>
  <rect class="band" x="16" y="358" width="18" height="140" rx="3"/>
  <text class="lane" transform="translate(29 428.0) rotate(-90)" text-anchor="middle" style="fill:#232333">GPU</text>
  <text class="lane" x="40" y="124" style="letter-spacing:0">EPHEMERAL</text>
  <text class="m" x="40" y="137">secs-hours</text>
  <text class="lane" x="40" y="198" style="letter-spacing:0">PERSISTENT</text>
  <text class="m" x="40" y="211">days-months</text>
  <text class="lane" x="40" y="374" style="letter-spacing:0">EPHEMERAL</text>
  <text class="m" x="40" y="387">secs-hours</text>
  <text class="lane" x="40" y="442" style="letter-spacing:0">PERSISTENT</text>
  <text class="m" x="40" y="455">days-months</text>
  <rect class="cell" x="112" y="108" width="292" height="70" rx="5"/>
  <text class="n hl" x="122" y="126">E2B</text>
<rect class="p hw" x="148.8" y="115.5" width="22.0" height="14" rx="3"/>
<text class="pt" x="153.8" y="126.0">FC</text>
  <text class="m" x="177.8" y="126">snapshot resume, no warm pool</text>
  <text class="n" x="122" y="142">AgentCore</text>
<rect class="p un" x="188.4" y="131.5" width="76.0" height="14" rx="3"/>
<text class="pt" x="193.4" y="142.0">VMM unnamed</text>
