<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">The machine: an M5 Pro MacBook Pro</title>
  <desc id="desc">An M5 Pro system on a chip: an 18-core CPU of 6 super and 12 performance cores, a 20-core GPU with a Neural Accelerator inside every core next to its ALUs, a 16-core Neural Engine that this work does not use, and 48 GB of unified memory at 307 GB/s that the CPU and GPU share. Beside it, the software path from Python through MLX and Metal 4's tensor operations to the GPU, and what was measured on this machine: about 33 TFLOPS on bf16 matmuls, about 28 on attention, 9 to 10 in Low Power Mode.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .t { font-size: 15px; font-weight: 700; }
    .k { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .h { font-size: 11.5px; font-weight: 700; }
    .m { fill: #5c5c6e; font-size: 10px; }
    .s { font-size: 8px; fill: #5c5c6e; }
    .chip { fill: #f5f5f8; stroke: #a3a3b3; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .core { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1; }
    .na { fill: #ffede4; stroke: #ff5f1f; stroke-width: 1.25; }
    .mem { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1.25; }
    .off { fill: #e9e9ef; stroke: #a3a3b3; stroke-width: 1; stroke-dasharray: 4 3; }
    .ln { stroke: #232333; stroke-width: 1.25; fill: none; }
  </style>
  <text x="20" y="28" class="t">The machine: MacBook Pro (Mac17,8), M5 Pro</text>
  <text x="20" y="46" class="m">macOS 27.0.1 · MLX 0.32.3 · Xcode 27 Instruments · plugged in, Energy Mode: High Power</text>

  <rect x="20" y="62" width="452" height="300" rx="10" class="chip"/>
  <text x="34" y="82" class="k">M5 PRO</text>

  <rect x="34" y="94" width="128" height="120" rx="6" class="box"/>
  <text x="44" y="112" class="h">CPU, 18 cores</text>
  <rect x="44" y="122" width="108" height="34" rx="4" class="core"/>
  <text x="52" y="137">6 super cores</text>
  <text x="52" y="150" class="m">16 MB L2</text>
  <rect x="44" y="164" width="108" height="34" rx="4" class="core"/>
  <text x="52" y="179">12 performance</text>
  <text x="52" y="192" class="m">cores, 8 MB L2</text>

  <rect x="176" y="94" width="282" height="200" rx="6" class="box"/>
  <text x="186" y="112" class="h">GPU, 20 cores</text>
  <text x="340" y="112" class="m">one NA per core</text>
  <g>
    <rect x="186" y="122" width="48" height="34" rx="3" class="core"/><rect x="190" y="139" width="40" height="13" rx="2" class="na"/><text x="192" y="134" class="s">ALUs</text><text x="198" y="149" class="s">NA</text>
    <rect x="240" y="122" width="48" height="34" rx="3" class="core"/><rect x="244" y="139" width="40" height="13" rx="2" class="na"/>
    <rect x="294" y="122" width="48" height="34" rx="3" class="core"/><rect x="298" y="139" width="40" height="13" rx="2" class="na"/>
    <rect x="348" y="122" width="48" height="34" rx="3" class="core"/><rect x="352" y="139" width="40" height="13" rx="2" class="na"/>
    <rect x="402" y="122" width="48" height="34" rx="3" class="core"/><rect x="406" y="139" width="40" height="13" rx="2" class="na"/>
    <rect x="186" y="162" width="48" height="34" rx="3" class="core"/><rect x="190" y="179" width="40" height="13" rx="2" class="na"/>
    <rect x="240" y="162" width="48" height="34" rx="3" class="core"/><rect x="244" y="179" width="40" height="13" rx="2" class="na"/>
    <rect x="294" y="162" width="48" height="34" rx="3" class="core"/><rect x="298" y="179" width="40" height="13" rx="2" class="na"/>
    <rect x="348" y="162" width="48" height="34" rx="3" class="core"/><rect x="352" y="179" width="40" height="13" rx="2" class="na"/>
    <rect x="402" y="162" width="48" height="34" rx="3" class="core"/><rect x="406" y="179" width="40" height="13" rx="2" class="na"/>
    <rect x="186" y="202" width="48" height="34" rx="3" class="core"/><rect x="190" y="219" width="40" height="13" rx="2" class="na"/>
    <rect x="240" y="202" width="48" height="34" rx="3" class="core"/><rect x="244" y="219" width="40" height="13" rx="2" class="na"/>
    <rect x="294" y="202" width="48" height="34" rx="3" class="core"/><rect x="298" y="219" width="40" height="13" rx="2" class="na"/>
    <rect x="348" y="202" width="48" height="34" rx="3" class="core"/><rect x="352" y="219" width="40" height="13" rx="2" class="na"/>
    <rect x="402" y="202" width="48" height="34" rx="3" class="core"/><rect x="406" y="219" width="40" height="13" rx="2" class="na"/>
    <rect x="186" y="242" width="48" height="34" rx="3" class="core"/><rect x="190" y="259" width="40" height="13" rx="2" class="na"/>
    <rect x="240" y="242" width="48" height="34" rx="3" class="core"/><rect x="244" y="259" width="40" height="13" rx="2" class="na"/>
    <rect x="294" y="242" width="48" height="34" rx="3" class="core"/><rect x="298" y="259" width="40" height="13" rx="2" class="na"/>
    <rect x="348" y="242" width="48" height="34" rx="3" class="core"/><rect x="352" y="259" width="40" height="13" rx="2" class="na"/>
    <rect x="402" y="242" width="48" height="34" rx="3" class="core"/><rect x="406" y="259" width="40" height="13" rx="2" class="na"/>
  </g>
  <text x="186" y="288" class="m">NA = matrix units, via Metal 4 tensor ops</text>

  <rect x="34" y="228" width="128" height="66" rx="6" class="off"/>
  <text x="44" y="246" class="h">Neural Engine</text>
  <text x="44" y="260" class="m">16 cores</text>
  <text x="44" y="282" class="m">not used here</text>

  <rect x="34" y="306" width="424" height="44" rx="6" class="mem"/>
  <text x="44" y="324" class="h">48 GB unified memory</text>
  <text x="44" y="340" class="m">one pool for CPU and GPU: weights are never copied to a device</text>
  <text x="352" y="324" class="h">307 GB/s</text>
  <path d="M162 154 H169 V306" class="ln" marker-end="url(#a)"/>
  <path d="M317 294 V306" class="ln" marker-end="url(#a)"/>

  <rect x="488" y="62" width="212" height="174" rx="10" class="box"/>
  <text x="500" y="82" class="k">THE PATH</text>
  <text x="500" y="102">Python: the model's code</text>
  <path d="M520 108 V118" class="ln" marker-end="url(#a)"/>
  <text x="500" y="132">MLX: a lazy graph, one kernel</text>
  <text x="500" y="145">per op, command buffers</text>
  <path d="M520 151 V161" class="ln" marker-end="url(#a)"/>
  <text x="500" y="175">Metal 4: matmul2d tensor ops</text>
  <text x="500" y="188">(Metal Performance Primitives)</text>
  <path d="M520 194 V204" class="ln" marker-end="url(#a)"/>
  <text x="500" y="218">GPU cores + their NAs</text>

  <rect x="488" y="248" width="212" height="114" rx="10" class="box"/>
  <text x="500" y="268" class="k">MEASURED HERE</text>
  <text x="500" y="288">bf16 matmul   ≈ 33 TFLOPS</text>
  <text x="500" y="304">attention     ≈ 28 TFLOPS</text>
  <text x="500" y="320">int8 (ours)   40-49 TOPS</text>
  <text x="500" y="336">Low Power     9-10 TFLOPS</text>
  <text x="500" y="352" class="m">from the traces below</text>

  <text x="20" y="390" class="m">Apple's numbers: 18-core CPU (6 super + 12 performance), 20-core GPU, 16-core Neural Engine,</text>
  <text x="20" y="405" class="m">307 GB/s memory bandwidth (apple.com/macbook-pro/specs). The rest was measured on this laptop.</text>
  <text x="20" y="430" class="m">Ridge point: 33 TFLOPS / 307 GB/s ≈ 107 FLOPs per byte. A bf16 matmul over M tokens does about</text>
  <text x="20" y="445" class="m">M FLOPs per byte of weights, so past ~110 tokens a pass is bound by compute, not by memory.</text>
</svg>
