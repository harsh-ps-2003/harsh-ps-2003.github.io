<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">What one matmul kernel does on the GPU</title>
  <desc id="desc">A matmul out = x times w-transposed is cut into output tiles of BM by BN; one threadgroup computes each tile, split among a grid of SIMD groups that each own a 32 by 32 piece, for example. Each SIMD group walks the K dimension 32 elements at a time: load a slice of x and of w, run a tensor op on the Neural Accelerator, accumulate into an fp32 tile, repeat, then write the tile out. The tile sizes decide how many threadgroups there are, how often weights are re-read and how many registers each SIMD group needs.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .h { font-size: 11.5px; font-weight: 700; } .b { font-weight: 700; } .m { fill: #5c5c6e; font-size: 9.8px; } .tag { fill: #c2410c; font-size: 9.8px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">What one matmul kernel does on the GPU</text>
  <text x="20" y="46" class="m">out [M x N] = x [M x K] times w [N x K] transposed: the shape of every matmul in the model</text>
  <rect x="30" y="80" width="150" height="90" fill="#f1f1f5" stroke="#a3a3b3"/><text x="105" y="128" text-anchor="middle" class="b">x</text><text x="105" y="185" class="m" text-anchor="middle">M tokens x K</text>
  <text x="200" y="130" class="h">x</text>
  <rect x="225" y="60" width="150" height="130" fill="#e6eef8" stroke="#4a7fc1"/><text x="300" y="128" text-anchor="middle" class="b">w transposed</text><text x="300" y="205" class="m" text-anchor="middle">K x N (the weights)</text>
  <text x="392" y="130" class="h">=</text>
  <rect x="420" y="70" width="270" height="110" fill="#fff" stroke="#232333"/>
  <line x1="465.0" y1="70" x2="465.0" y2="180" stroke="#c9c9d3"/>
  <line x1="510.0" y1="70" x2="510.0" y2="180" stroke="#c9c9d3"/>
  <line x1="555.0" y1="70" x2="555.0" y2="180" stroke="#c9c9d3"/>
  <line x1="600.0" y1="70" x2="600.0" y2="180" stroke="#c9c9d3"/>
  <line x1="645.0" y1="70" x2="645.0" y2="180" stroke="#c9c9d3"/>
  <line x1="420" y1="106.7" x2="690" y2="106.7" stroke="#c9c9d3"/>
  <line x1="420" y1="143.3" x2="690" y2="143.3" stroke="#c9c9d3"/>
  <rect x="465.0" y="106.7" width="45.0" height="36.7" fill="#ffe9df" stroke="#ff5f1f" stroke-width="2"/>
  <text x="555.0" y="196" class="m" text-anchor="middle">out, M x N, cut into tiles of BM x BN</text>
  <text x="555.0" y="210" class="m" text-anchor="middle">one threadgroup computes one tile (orange)</text>
  <text x="420" y="254" class="h">the orange tile, zoomed in</text>
  <rect x="420" y="262" width="270" height="140" fill="#ffe9df" stroke="#ff5f1f" stroke-width="2"/>
  <rect x="428" y="270" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="457" y="303" class="m" text-anchor="middle">SIMD 0</text>
  <rect x="428" y="334" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="457" y="367" class="m" text-anchor="middle">SIMD 4</text>
  <rect x="492" y="270" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="521" y="303" class="m" text-anchor="middle">SIMD 1</text>
  <rect x="492" y="334" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="521" y="367" class="m" text-anchor="middle">SIMD 5</text>
  <rect x="556" y="270" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="585" y="303" class="m" text-anchor="middle">SIMD 2</text>
  <rect x="556" y="334" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="585" y="367" class="m" text-anchor="middle">SIMD 6</text>
  <rect x="620" y="270" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="649" y="303" class="m" text-anchor="middle">SIMD 3</text>
  <rect x="620" y="334" width="58" height="58" rx="3" fill="#fff" stroke="#c2410c"/>
  <text x="649" y="367" class="m" text-anchor="middle">SIMD 7</text>
  <text x="555" y="422" class="m" text-anchor="middle">a threadgroup of WM x WN SIMD groups (here 2 x 4),</text>
  <text x="555" y="436" class="m" text-anchor="middle">each owning SM x SN of the tile (e.g. 32 x 32)</text>
  <text x="30" y="256" class="h">What each SIMD group does: walk K, 32 at a time</text>
  <text x="44" y="278">load a 32-deep slice of x (its rows)</text>
  <text x="44" y="294">load the same slice of w (its columns)</text>
  <text x="44" y="310">multiply on the Neural Accelerator,</text>
  <text x="44" y="326">  add into an fp32 accumulator tile</text>
  <text x="44" y="342">repeat K / 32 times; then write the tile</text>
  <rect x="44" y="362" width="22" height="16" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <rect x="70" y="362" width="22" height="16" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <rect x="96" y="362" width="22" height="16" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <rect x="122" y="362" width="22" height="16" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <rect x="148" y="362" width="22" height="16" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <rect x="174" y="362" width="22" height="16" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <rect x="200" y="362" width="22" height="16" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <rect x="226" y="362" width="22" height="16" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <rect x="252" y="362" width="22" height="16" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <rect x="278" y="362" width="22" height="16" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <rect x="304" y="362" width="22" height="16" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <rect x="330" y="362" width="22" height="16" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <text x="44" y="396" class="m">blue: a load, which waits on memory;</text>
  <text x="44" y="410" class="m">orange: a tensor op. One after another.</text>
  <text x="20" y="468" class="m">The tile sizes (BM, BN, the SIMD-group grid, the K depth between barriers) decide how many threadgroups</text>
  <text x="20" y="482" class="m">the GPU gets, how often each weight is re-read, and how many registers a SIMD group holds.</text>
  <text x="20" y="496" class="m">No single choice is best for both 16 rows and 16,000.</text>
</svg>
