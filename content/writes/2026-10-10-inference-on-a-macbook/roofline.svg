<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">The roofline of three Macs</title>
  <desc id="desc">Achievable TFLOPS against arithmetic intensity, log-log. Each chip's line rises with its memory bandwidth until it meets its compute peak: the M3 Pro at about 7 TFLOPS and 150 GB/s, ridge near 49 FLOPs per byte; the M4 Pro at about 9 TFLOPS and 273 GB/s, ridge near 34; the M5 Pro at 33 TFLOPS and 307 GB/s, ridge near 107. A matmul over M tokens does about M FLOPs per byte of weights, so a 93-token prompt sits near the M5's ridge and 500 or 4,000 tokens are well into compute on every chip.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .h { font-size: 11.5px; font-weight: 700; } .b { font-weight: 700; } .m { fill: #5c5c6e; font-size: 9.8px; } .tag { fill: #c2410c; font-size: 9.8px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">The roofline: when a Mac is waiting on memory, and when on math</text>
  <text x="20" y="46" class="m">the best a kernel can do, against how many FLOPs it does per byte it reads; log-log</text>
  <line x1="70" y1="420.0" x2="690" y2="420.0" class="grid"/><text x="62" y="423.5" class="m" text-anchor="end">0.1</text>
  <line x1="70" y1="308.4" x2="690" y2="308.4" class="grid"/><text x="62" y="311.9" class="m" text-anchor="end">1</text>
  <line x1="70" y1="196.8" x2="690" y2="196.8" class="grid"/><text x="62" y="200.3" class="m" text-anchor="end">10</text>
  <line x1="70" y1="139.0" x2="690" y2="139.0" class="grid"/><text x="62" y="142.5" class="m" text-anchor="end">33</text>
  <line x1="70.0" y1="420" x2="70.0" y2="425" stroke="#5c5c6e"/><text x="70.0" y="438" class="m" text-anchor="middle">1</text>
  <line x1="225.0" y1="420" x2="225.0" y2="425" stroke="#5c5c6e"/><text x="225.0" y="438" class="m" text-anchor="middle">10</text>
  <line x1="380.0" y1="420" x2="380.0" y2="425" stroke="#5c5c6e"/><text x="380.0" y="438" class="m" text-anchor="middle">100</text>
  <line x1="535.0" y1="420" x2="535.0" y2="425" stroke="#5c5c6e"/><text x="535.0" y="438" class="m" text-anchor="middle">1,000</text>
  <line x1="690.0" y1="420" x2="690.0" y2="425" stroke="#5c5c6e"/><text x="690.0" y="438" class="m" text-anchor="middle">10,000</text>
  <text x="380.0" y="458" class="m" text-anchor="middle">FLOPs per byte read; a matmul over M tokens of bf16 weights does about M</text>
  <text x="18" y="265.0" class="m" text-anchor="middle" transform="rotate(-90 18 265.0)">TFLOPS</text>
  <path d="M70.0,400.4 L332.4,211.4 L690.0,211.4" fill="none" stroke="#a3a3b3" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="332.4" cy="211.4" r="4" fill="#a3a3b3" stroke="#fff" stroke-width="1.5"/>
  <text x="690" y="226.4" class="b" text-anchor="end">M3 Pro: 7 TF, 150 GB/s, ridge at 49</text>
  <path d="M70.0,371.3 L306.8,200.9 L690.0,200.9" fill="none" stroke="#4a7fc1" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="306.8" cy="200.9" r="4" fill="#4a7fc1" stroke="#fff" stroke-width="1.5"/>
  <text x="690" y="193.9" class="b" text-anchor="end">M4 Pro: 9 TF, 273 GB/s, ridge at 34</text>
  <path d="M70.0,365.6 L384.9,139.0 L690.0,139.0" fill="none" stroke="#ff5f1f" stroke-width="2.5" />
  <circle cx="384.9" cy="139.0" r="4" fill="#ff5f1f" stroke="#fff" stroke-width="1.5"/>
  <text x="690" y="132.0" class="b" text-anchor="end">M5 Pro: 33 TF, 307 GB/s, ridge at 107</text>
  <line x1="375.1" y1="116" x2="375.1" y2="420" stroke="#232333" stroke-dasharray="1 3"/>
  <text x="375.1" y="412" class="tag" text-anchor="middle">93-token prompt</text>
  <line x1="488.3" y1="116" x2="488.3" y2="420" stroke="#232333" stroke-dasharray="1 3"/>
  <text x="488.3" y="412" class="tag" text-anchor="middle">500-token prompt</text>
  <line x1="628.3" y1="116" x2="628.3" y2="420" stroke="#232333" stroke-dasharray="1 3"/>
  <text x="628.3" y="412" class="tag" text-anchor="middle">4,000-token prompt</text>
  <text x="78" y="92" class="m">left of a ridge: bound by memory, time = bytes / bandwidth</text>
  <text x="78" y="106" class="m">right of it: bound by compute, time = FLOPs / TFLOPS</text>
  <text x="20" y="478" class="m">M5 Pro measured here. M3 Pro and M4 Pro compute is my estimate from cores and clocks:</text>
  <text x="20" y="492" class="m">Apple publishes their bandwidth, not their matmul rate.</text>
</svg>
