<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">The wall that wasn't</title>
  <desc id="desc">The time of one matmul, 8,192 rows by 6,144 by 2,560, through MLX's own precompiled kernel (8.72 ms) and my metal_kernel build of the same kernel at the same tile. With a flat threadgroup of 256 threads it takes 10.8 ms whatever else changes: N and K at run time, MLX's barrier, the dims buffer, the swizzle. With the threadgroup laid out as MLX lays out its own, 32 by 4 by 2 threads, it takes 8.71 ms, with bit-identical output.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .m { fill: #5c5c6e; font-size: 9.5px; } .v { fill: #232333; font-size: 10px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">One matmul, nine ways: it was the threadgroup's shape</text>
  <text x="20" y="46" class="m">8,192 x 6,144 x 2,560 in bf16 (qkv at 8k rows), MLX's tile (64 x 128, BK 256, 2 x 4 SIMD groups), median of 10.</text>
  <line x1="300.0" y1="72" x2="300.0" y2="354" class="grid"/><text x="300.0" y="368" class="m" text-anchor="middle">0 ms</text><line x1="358.3" y1="72" x2="358.3" y2="354" class="grid"/><text x="358.3" y="368" class="m" text-anchor="middle">2 ms</text><line x1="416.7" y1="72" x2="416.7" y2="354" class="grid"/><text x="416.7" y="368" class="m" text-anchor="middle">4 ms</text><line x1="475.0" y1="72" x2="475.0" y2="354" class="grid"/><text x="475.0" y="368" class="m" text-anchor="middle">6 ms</text><line x1="533.3" y1="72" x2="533.3" y2="354" class="grid"/><text x="533.3" y="368" class="m" text-anchor="middle">8 ms</text><line x1="591.7" y1="72" x2="591.7" y2="354" class="grid"/><text x="591.7" y="368" class="m" text-anchor="middle">10 ms</text><line x1="650.0" y1="72" x2="650.0" y2="354" class="grid"/><text x="650.0" y="368" class="m" text-anchor="middle">12 ms</text>
    <g><title>MLX's matmul (its precompiled kernel): 8.72 ms</title><text x="290" y="93.0" text-anchor="end">MLX's matmul (its precompiled kernel)</text><path d="M300,78 h250.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-250.3 z" fill="#a3a3b3"/><text x="560.3" y="93.0" class="v">8.72 ms</text></g>
  <g><title>my build, (256, 1, 1) threads: 10.81 ms</title><text x="290" y="123.0" text-anchor="end">my build, (256, 1, 1) threads</text><path d="M300,108 h311.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-311.3 z" fill="#ffb38f"/><text x="621.3" y="123.0" class="v">10.81 ms</text></g>
  <g><title>+ N and K at run time: 10.80 ms</title><text x="290" y="153.0" text-anchor="end">+ N and K at run time</text><path d="M300,138 h311.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-311.0 z" fill="#ffb38f"/><text x="621.0" y="153.0" class="v">10.80 ms</text></g>
  <g><title>+ MLX's barrier before the loop: 10.81 ms</title><text x="290" y="183.0" text-anchor="end">+ MLX's barrier before the loop</text><path d="M300,168 h311.3 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-311.3 z" fill="#ffb38f"/><text x="621.3" y="183.0" class="v">10.81 ms</text></g>
  <g><title>+ the dims buffer made per call: 10.85 ms</title><text x="290" y="213.0" text-anchor="end">+ the dims buffer made per call</text><path d="M300,198 h312.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-312.5 z" fill="#ffb38f"/><text x="622.5" y="213.0" class="v">10.85 ms</text></g>
  <g><title>swizzle 0 instead of 2: 10.87 ms</title><text x="290" y="243.0" text-anchor="end">swizzle 0 instead of 2</text><path d="M300,228 h313.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-313.0 z" fill="#ffb38f"/><text x="623.0" y="243.0" class="v">10.87 ms</text></g>
  <g><title>swizzle 1: 10.84 ms</title><text x="290" y="273.0" text-anchor="end">swizzle 1</text><path d="M300,258 h312.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-312.2 z" fill="#ffb38f"/><text x="622.2" y="273.0" class="v">10.84 ms</text></g>
  <g><title>swizzle 3: 10.79 ms</title><text x="290" y="303.0" text-anchor="end">swizzle 3</text><path d="M300,288 h310.7 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-310.7 z" fill="#ffb38f"/><text x="620.7" y="303.0" class="v">10.79 ms</text></g>
  <g><title>my build, (32, 4, 2) threads: MLX's layout: 8.71 ms</title><text x="290" y="333.0" text-anchor="end">my build, (32, 4, 2) threads: MLX's layout</text><path d="M300,318 h250.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-250.0 z" fill="#ff5f1f"/><text x="560.0" y="333.0" class="v">8.71 ms</text></g>
</svg>
