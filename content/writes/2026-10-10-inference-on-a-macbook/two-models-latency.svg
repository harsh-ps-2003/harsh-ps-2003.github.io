  <line x1="70" y1="370" x2="690" y2="370" stroke="#5c5c6e"/>
  <text x="380" y="408" class="m" text-anchor="middle">tokens of context (log scale); the prompt holds about twice as many</text>
    <path d="M100.0,292.1 L193.4,270.4 L286.7,245.3 L380.0,217.5 L473.3,187.8 L566.6,152.5 L621.2,129.9 L651.3,115.1" fill="none" stroke="#ff5f1f" stroke-width="2" />
