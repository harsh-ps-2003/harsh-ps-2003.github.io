<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Two models, one MacBook: a decision's time by context length</title>
  <desc id="desc">End-to-end time of a one-question decision against context length, log-log, for the 3.8B model and the 0.9B one, first requests and follow-up questions. 500 tokens: 3.8B 0.30 s; 1000 tokens: 3.8B 0.57 s; 2000 tokens: 3.8B 1.20 s; 4000 tokens: 3.8B 2.74 s; 8000 tokens: 3.8B 6.61 s; 16000 tokens: 3.8B 18.77 s; 24000 tokens: 3.8B 36.65 s; 30000 tokens: 3.8B 56.76 s. 500 tokens: 0.9B 0.07 s; 1000 tokens: 0.9B 0.15 s; 2000 tokens: 0.9B 0.31 s; 4000 tokens: 0.9B 0.77 s; 8000 tokens: 0.9B 2.10 s; 16000 tokens: 0.9B 6.07 s.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .m { fill: #5c5c6e; font-size: 10px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">Two models, one MacBook: a decision's time by context length</text>
  <text x="20" y="44" class="m">one question, end to end, M5 Pro, bf16; the 0.9B model takes contexts up to about 16k tokens</text>
    <line x1="20" y1="58" x2="44" y2="58" stroke="#ff5f1f" stroke-width="2" /><circle cx="32" cy="58" r="3.5" fill="#ff5f1f"/><text x="52" y="62">3.8B model, first request</text>
  <line x1="320" y1="58" x2="344" y2="58" stroke="#ff5f1f" stroke-width="2" stroke-dasharray="5 3"/><circle cx="332" cy="58" r="3.5" fill="#ff5f1f"/><text x="352" y="62">3.8B model, follow-up question</text>
  <line x1="20" y1="75" x2="44" y2="75" stroke="#4a7fc1" stroke-width="2" /><circle cx="32" cy="75" r="3.5" fill="#4a7fc1"/><text x="52" y="79">0.9B model, first request</text>
  <line x1="320" y1="75" x2="344" y2="75" stroke="#4a7fc1" stroke-width="2" stroke-dasharray="5 3"/><circle cx="332" cy="75" r="3.5" fill="#4a7fc1"/><text x="352" y="79">0.9B model, follow-up question</text>
    <line x1="70" y1="370.0" x2="690" y2="370.0" class="grid"/><text x="62" y="373.5" class="m" text-anchor="end">30 ms</text>
  <line x1="70" y1="329.3" x2="690" y2="329.3" class="grid"/><text x="62" y="332.8" class="m" text-anchor="end">0.1 s</text>
  <line x1="70" y1="292.2" x2="690" y2="292.2" class="grid"/><text x="62" y="295.7" class="m" text-anchor="end">0.3 s</text>
  <line x1="70" y1="251.6" x2="690" y2="251.6" class="grid"/><text x="62" y="255.1" class="m" text-anchor="end">1 s</text>
  <line x1="70" y1="214.4" x2="690" y2="214.4" class="grid"/><text x="62" y="217.9" class="m" text-anchor="end">3 s</text>
  <line x1="70" y1="173.8" x2="690" y2="173.8" class="grid"/><text x="62" y="177.3" class="m" text-anchor="end">10 s</text>
  <line x1="70" y1="136.7" x2="690" y2="136.7" class="grid"/><text x="62" y="140.2" class="m" text-anchor="end">30 s</text>
  <line x1="70" y1="96.0" x2="690" y2="96.0" class="grid"/><text x="62" y="99.5" class="m" text-anchor="end">100 s</text>
  <line x1="100.0" y1="370" x2="100.0" y2="375" stroke="#5c5c6e"/><text x="100.0" y="388" class="m" text-anchor="middle">500</text>
  <line x1="193.4" y1="370" x2="193.4" y2="375" stroke="#5c5c6e"/><text x="193.4" y="388" class="m" text-anchor="middle">1k</text>
  <line x1="286.7" y1="370" x2="286.7" y2="375" stroke="#5c5c6e"/><text x="286.7" y="388" class="m" text-anchor="middle">2k</text>
  <line x1="380.0" y1="370" x2="380.0" y2="375" stroke="#5c5c6e"/><text x="380.0" y="388" class="m" text-anchor="middle">4k</text>
  <line x1="473.3" y1="370" x2="473.3" y2="375" stroke="#5c5c6e"/><text x="473.3" y="388" class="m" text-anchor="middle">8k</text>
