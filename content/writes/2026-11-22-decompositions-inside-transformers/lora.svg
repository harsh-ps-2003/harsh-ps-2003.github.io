<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-label="LoRA keeps the pretrained weight W frozen and adds a learned update B times A, with B of size d by r and A of size r by d, so the update has rank at most r, 8 to 64, and costs 2dr trainable parameters instead of d squared, about 0.8 percent of the layer for d 4096 and r 16. It works because fine-tuning updates have a fast falling spectrum, a few directions carry most of the change, the same idea as keeping a few layers of a picture.">
