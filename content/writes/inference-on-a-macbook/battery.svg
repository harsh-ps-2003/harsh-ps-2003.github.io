<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">The same request at 9% battery and charged</title>
  <desc id="desc">Two lines of six rounds each. At 8 to 9% battery and falling: 3.85, 3.60, 3.58, 3.67, 4.29, 4.38 s. Charged: 3.65, 3.61, 3.58, 3.57, 3.58, 3.58 s. The 300-word, one-question cell of the same runs stayed between 117 and 118 ms in every round.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .h { font-size: 11.5px; font-weight: 700; } .m { fill: #5c5c6e; font-size: 9.8px; } .tag { fill: #c2410c; font-size: 9.8px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">The same request at 9% battery and charged</text>
  <text x="20" y="46" class="m">pplx-decider flash, 4,000 words and three questions, median of each round (fresh process), M5 Pro on a 65 W adapter</text>
  <line x1="80" y1="242.7" x2="550" y2="242.7" class="grid"/><text x="72" y="246.2" class="m" text-anchor="end">3.5 s</text>
  <line x1="80" y1="156.4" x2="550" y2="156.4" class="grid"/><text x="72" y="159.9" class="m" text-anchor="end">4.0 s</text>
  <line x1="80" y1="70.0" x2="550" y2="70.0" class="grid"/><text x="72" y="73.5" class="m" text-anchor="end">4.5 s</text>
  <text x="80.0" y="276" class="m" text-anchor="middle">round 1</text>
  <text x="174.0" y="276" class="m" text-anchor="middle">round 2</text>
  <text x="268.0" y="276" class="m" text-anchor="middle">round 3</text>
  <text x="362.0" y="276" class="m" text-anchor="middle">round 4</text>
  <text x="456.0" y="276" class="m" text-anchor="middle">round 5</text>
  <text x="550.0" y="276" class="m" text-anchor="middle">round 6</text>
  <polyline points="80.0,182.7 174.0,226.1 268.0,228.7 362.0,213.9 456.0,105.6 550.0,91.5" fill="none" stroke="#c2410c" stroke-width="2"/>
  <circle cx="80.0" cy="182.7" r="3" fill="#c2410c"/>
  <circle cx="174.0" cy="226.1" r="3" fill="#c2410c"/>
  <circle cx="268.0" cy="228.7" r="3" fill="#c2410c"/>
  <circle cx="362.0" cy="213.9" r="3" fill="#c2410c"/>
  <circle cx="456.0" cy="105.6" r="3" fill="#c2410c"/>
  <circle cx="550.0" cy="91.5" r="3" fill="#c2410c"/>
  <text x="558.0" y="95.5" class="tag">battery 8 to 9%, falling</text>
  <polyline points="80.0,216.2 174.0,224.1 268.0,228.2 362.0,229.8 456.0,229.2 550.0,229.4" fill="none" stroke="#5c5c6e" stroke-width="2"/>
  <circle cx="80.0" cy="216.2" r="3" fill="#5c5c6e"/>
  <circle cx="174.0" cy="224.1" r="3" fill="#5c5c6e"/>
  <circle cx="268.0" cy="228.2" r="3" fill="#5c5c6e"/>
  <circle cx="362.0" cy="229.8" r="3" fill="#5c5c6e"/>
  <circle cx="456.0" cy="229.2" r="3" fill="#5c5c6e"/>
  <circle cx="550.0" cy="229.4" r="3" fill="#5c5c6e"/>
  <text x="558.0" y="233.4" class="m">charged</text>
  <text x="80" y="308" class="m">the 300-word, one-question cell of the same runs: 117 to 118 ms in every round of both runs</text>
</svg>
