  <g class="f" data-n="MLP x 32 455.8 ms" data-x="239.997" data-w="452.379" data-d="2"><title>MLP x 32: 455.83 ms, 64.6%</title><rect x="250.00" y="69" width="451.38" height="16" rx="1.5" fill="rgb(231,62,30)"/><text x="253.00" y="81">MLP x 32 455.8 ms</text></g>
  <g class="f" data-n="gate/up 24576x4096 283.4 ms" data-x="239.997" data-w="281.215" data-d="3"><title>gate/up 24576x4096: 283.36 ms, 40.2%</title><rect x="250.00" y="52" width="280.21" height="16" rx="1.5" fill="rgb(223,173,30)"/><text x="253.00" y="64">gate/up 24576x4096 283.4 ms</text></g>
  <g class="f" data-n="SwiGLU 12.3 ms" data-x="521.212" data-w="12.217" data-d="3"><title>SwiGLU: 12.31 ms, 1.7%</title><rect x="531.21" y="52" width="11.22" height="16" rx="1.5" fill="rgb(223,78,4)"/><text x="534.21" y="64"></text></g>
  <g class="f" data-n="down 4096x12288 160.2 ms" data-x="533.428" data-w="158.947" data-d="3"><title>down 4096x12288: 160.16 ms, 22.7%</title><rect x="543.43" y="52" width="157.95" height="16" rx="1.5" fill="rgb(206,165,33)"/><text x="546.43" y="64">down 4096x12288 160.2..</text></g>
  <g class="f" data-n="final norm 0.1 ms" data-x="692.376" data-w="0.131" data-d="2"><title>final norm: 0.13 ms, 0.0%</title><rect x="702.38" y="69" width="0.50" height="16" rx="1.5" fill="rgb(228,70,3)"/><text x="705.38" y="81"></text></g>
  <g class="f" data-n="other: embedding, readout, small ops 7.5 ms" data-x="692.507" data-w="7.493" data-d="1"><title>other: embedding, readout, small ops: 7.55 ms, 1.1%</title><rect x="702.51" y="86" width="6.49" height="16" rx="1.5" fill="rgb(232,194,26)"/><text x="705.51" y="98"></text></g>
  <script><![CDATA[
var W = 720, all = document.querySelectorAll('g.f');
function fit(g, w) {
  var t = g.querySelector('text'), n = g.getAttribute('data-n');
  var room = Math.floor((w - 6) / 6.6);
  t.textContent = n.length <= room ? n : (room > 3 ? n.slice(0, room - 2) + '..' : '');
}
function zoom(g0) {
  var x0 = +g0.getAttribute('data-x'), w0 = +g0.getAttribute('data-w'), d0 = +g0.getAttribute('data-d');
  all.forEach(function (g) {
    var x = +g.getAttribute('data-x'), w = +g.getAttribute('data-w'), d = +g.getAttribute('data-d');
    var r = g.querySelector('rect'), t = g.querySelector('text');
    var inside = x >= x0 - 1e-6 && x + w <= x0 + w0 + 1e-6, below = d < d0 && x <= x0 && x + w >= x0 + w0;
    if (inside || below) {
      var nx = below ? 0 : (x - x0) / w0 * (W - 20), nw = below ? W - 20 : w / w0 * (W - 20);
      r.setAttribute('x', 10 + nx); r.setAttribute('width', Math.max(nw - 1, 0.5));
      t.setAttribute('x', 13 + nx); g.style.display = ''; fit(g, nw);
      g.style.opacity = below && d < d0 ? 0.6 : 1;
    } else { g.style.display = 'none'; }
  });
}
all.forEach(function (g) { g.addEventListener('click', function () { zoom(g); }); });
document.getElementById('reset').addEventListener('click', function () { zoom(all[0]); });
]]></script>
</svg>
