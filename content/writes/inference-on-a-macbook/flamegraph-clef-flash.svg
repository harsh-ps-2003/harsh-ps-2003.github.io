<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 134" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Where a Clef-Flash request's time goes (705 ms)</title>
  <desc id="desc">A flame graph of one Clef-Flash 9B request on the community 8-bit MLX build, 1,000 words and one question, 705 ms: the request, its 32 layers, each layer's blocks (the MLP 456 ms, linear attention 179 ms in 24 layers, full attention 51 ms in 8 layers, add and norm 12 ms) and their operations: the gate/up matmul 283 ms, down 160 ms, linear attention's input projection 108 ms, the gated delta recurrence 23 ms, attention 7 ms in blue. The matmuls are 89.5% of the request.</desc>
  <style>text { fill: #232333; font-size: 10.5px; pointer-events: none; } .t { font-size: 15px; font-weight: 700; } .m { fill: #5c5c6e; font-size: 10px; } g.f { cursor: pointer; } g.f:hover rect { stroke: #232333; stroke-width: 1; } #reset { cursor: pointer; }</style>
  <rect width="720" height="134" fill="#ffffff"/>
  <text x="10" y="24" class="t">Where a Clef-Flash request's time goes (705 ms)</text>
  <text x="10" y="42" class="m">decisionmlx profile, M5 Pro, 8-bit build; frame width = time; hover for numbers, click to zoom</text>
  <text id="reset" x="710" y="42" class="m" text-anchor="end">reset zoom</text>
