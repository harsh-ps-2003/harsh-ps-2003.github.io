  <g class="f" data-n="linear attention x 24 178.9 ms" data-x="11.731" data-w="177.538" data-d="2"><title>linear attention x 24: 178.89 ms, 25.4%</title><rect x="21.73" y="69" width="176.54" height="16" rx="1.5" fill="rgb(236,110,12)"/><text x="24.73" y="81">linear attention x 24 1..</text></g>
  <g class="f" data-n="in_proj 12352x4096 107.8 ms" data-x="11.731" data-w="106.974" data-d="3"><title>in_proj 12352x4096: 107.79 ms, 15.3%</title><rect x="21.73" y="52" width="105.97" height="16" rx="1.5" fill="rgb(213,106,24)"/><text x="24.73" y="64">in_proj 12352..</text></g>
  <g class="f" data-n="short conv 6.7 ms" data-x="118.704" data-w="6.629" data-d="3"><title>short conv: 6.68 ms, 0.9%</title><rect x="128.70" y="52" width="5.63" height="16" rx="1.5" fill="rgb(208,123,33)"/><text x="131.70" y="64"></text></g>
  <g class="f" data-n="gated delta 22.9 ms" data-x="125.334" data-w="22.746" data-d="3"><title>gated delta: 22.92 ms, 3.2%</title><rect x="135.33" y="52" width="21.75" height="16" rx="1.5" fill="rgb(207,95,19)"/><text x="138.33" y="64"></text></g>
  <g class="f" data-n="gated norm 4.5 ms" data-x="148.080" data-w="4.486" data-d="3"><title>gated norm: 4.52 ms, 0.6%</title><rect x="158.08" y="52" width="3.49" height="16" rx="1.5" fill="rgb(214,118,11)"/><text x="161.08" y="64"></text></g>
  <g class="f" data-n="out_proj 4096x4096 37.0 ms" data-x="152.566" data-w="36.703" data-d="3"><title>out_proj 4096x4096: 36.98 ms, 5.2%</title><rect x="162.57" y="52" width="35.70" height="16" rx="1.5" fill="rgb(218,159,47)"/><text x="165.57" y="64">ou..</text></g>
  <g class="f" data-n="full attention x 8 51.1 ms" data-x="189.269" data-w="50.728" data-d="2"><title>full attention x 8: 51.12 ms, 7.2%</title><rect x="199.27" y="69" width="49.73" height="16" rx="1.5" fill="rgb(221,104,25)"/><text x="202.27" y="81">full..</text></g>
  <g class="f" data-n="qkv 10240x4096 30.1 ms" data-x="189.269" data-w="29.822" data-d="3"><title>qkv 10240x4096: 30.05 ms, 4.3%</title><rect x="199.27" y="52" width="28.82" height="16" rx="1.5" fill="rgb(223,80,21)"/><text x="202.27" y="64"></text></g>
  <g class="f" data-n="q/k norms 2.1 ms" data-x="219.091" data-w="2.102" data-d="3"><title>q/k norms: 2.12 ms, 0.3%</title><rect x="229.09" y="52" width="1.10" height="16" rx="1.5" fill="rgb(92,140,214)"/><text x="232.09" y="64"></text></g>
