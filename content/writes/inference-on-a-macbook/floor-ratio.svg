<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">How close each model runs to its floor</title>
  <desc id="desc">Horizontal bars, one per public model: its request time over the time its backbone's matmuls would take at 33 TFLOPS. Clef-Flash 9B 1.22 (594 ms against 485); Nimble 9B 1.18 (577 ms against 487); pplx-decider flash 1.28 (303 ms against 237); d3-mini 1.27 (304 ms against 239); d1-3B 1.17 (179 ms against 152); d3-lite 1.77 (59 ms against 33); Laya 1.71 (18 ms against 11); d1-omni-600M 1.47 (28 ms against 19). The 3B to 9B models run within 17 to 28% of the floor; the models under 1B run 1.5 to 1.8 times it.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .h { font-size: 11.5px; font-weight: 700; } .m { fill: #5c5c6e; font-size: 9.8px; } .tag { fill: #c2410c; font-size: 9.8px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">How close each model runs to its floor</text>
  <text x="20" y="46" class="m">a 1,000-word state and one question, after the tuner fixes, over the compute floor of its matmuls</text>
  <line x1="210.0" y1="62" x2="210.0" y2="302" class="grid"/><text x="210.0" y="316" class="m" text-anchor="middle">1.00x</text>
  <line x1="317.5" y1="62" x2="317.5" y2="302" class="grid"/><text x="317.5" y="316" class="m" text-anchor="middle">1.25x</text>
  <line x1="425.0" y1="62" x2="425.0" y2="302" class="grid"/><text x="425.0" y="316" class="m" text-anchor="middle">1.50x</text>
  <line x1="532.5" y1="62" x2="532.5" y2="302" class="grid"/><text x="532.5" y="316" class="m" text-anchor="middle">1.75x</text>
  <line x1="640.0" y1="62" x2="640.0" y2="302" class="grid"/><text x="640.0" y="316" class="m" text-anchor="middle">2.00x</text>
  <text x="200" y="81" text-anchor="end">Clef-Flash 9B</text>
  <rect x="210" y="70" width="96.4" height="16" rx="2" fill="#c2410c"/>
  <text x="312.4" y="82" class="m">1.22x  594 ms, floor 485</text>
  <text x="200" y="111" text-anchor="end">Nimble 9B</text>
  <rect x="210" y="100" width="79.5" height="16" rx="2" fill="#c2410c"/>
  <text x="295.5" y="112" class="m">1.18x  577 ms, floor 487</text>
  <text x="200" y="141" text-anchor="end">pplx-decider flash</text>
  <rect x="210" y="130" width="120.5" height="16" rx="2" fill="#c2410c"/>
  <text x="336.5" y="142" class="m">1.28x  303 ms, floor 237</text>
  <text x="200" y="171" text-anchor="end">d3-mini</text>
  <rect x="210" y="160" width="117.9" height="16" rx="2" fill="#c2410c"/>
  <text x="333.9" y="172" class="m">1.27x  304 ms, floor 239</text>
  <text x="200" y="201" text-anchor="end">d1-3B</text>
  <rect x="210" y="190" width="75.2" height="16" rx="2" fill="#c2410c"/>
  <text x="291.2" y="202" class="m">1.17x  179 ms, floor 152</text>
  <text x="200" y="231" text-anchor="end">d3-lite</text>
  <rect x="210" y="220" width="330.3" height="16" rx="2" fill="#5c5c6e"/>
  <text x="546.3" y="232" class="m">1.77x  59 ms, floor 33</text>
  <text x="200" y="261" text-anchor="end">Laya</text>
  <rect x="210" y="250" width="305.0" height="16" rx="2" fill="#5c5c6e"/>
  <text x="521.0" y="262" class="m">1.71x  18 ms, floor 11</text>
  <text x="200" y="291" text-anchor="end">d1-omni-600M</text>
  <rect x="210" y="280" width="204.2" height="16" rx="2" fill="#5c5c6e"/>
  <text x="420.2" y="292" class="m">1.47x  28 ms, floor 19</text>
  <text x="20" y="348" class="m">floor = GFLOPs per token x tokens / 33 TFLOPS (attention and recurrences left out)</text>
</svg>
