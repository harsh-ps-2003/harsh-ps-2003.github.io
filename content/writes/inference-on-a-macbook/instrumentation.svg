<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">How each kernel gets a name and a time</title>
  <desc id="desc">xctrace records the benchmark under a Metal System Trace template saved with the Metal Application instrument's shader timeline on. MLX runs with MLX_MAX_OPS_PER_BUFFER=0, so every operation is its own command buffer. The trace export gives two tables: the GPU interval of every command buffer, which is exact, and the shader timeline, which names the kernel in about 70 percent of them. Since every layer runs the same operations in the same order, each buffer is named by its place after that layer's attention kernel, by the name most layers carry at that place. The result is a time per model step, an achieved TFLOPS per matmul, a flame graph and a timeline.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#232333"/></marker>
  </defs>
  <style>
    text { fill: #232333; font-size: 10.5px; }
    .t { font-size: 15px; font-weight: 700; }
    .k { font-size: 10px; font-weight: 600; letter-spacing: .1em; fill: #ff5f1f; }
    .h { font-size: 11.5px; font-weight: 700; }
    .m { fill: #5c5c6e; font-size: 10px; }
    .c { font-size: 9.5px; fill: #c2410c; }
    .box { fill: #ffffff; stroke: #232333; stroke-width: 1.25; }
    .tool { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1; }
    .data { fill: #fbf1cf; stroke: #d4b34a; stroke-width: 1.25; }
    .out { fill: #ffede4; stroke: #ff5f1f; stroke-width: 1.5; }
    .ln { stroke: #232333; stroke-width: 1.25; fill: none; }
  </style>
  <text x="20" y="28" class="t">How each kernel gets a name and a time</text>
  <text x="20" y="46" class="m">bench/trace.py: record, then report; nothing in the model's code changes</text>

  <rect x="20" y="62" width="216" height="118" rx="8" class="tool"/>
  <text x="32" y="82" class="k">1 · RECORD</text>
  <text x="32" y="102" class="c">xcrun xctrace record</text>
  <text x="32" y="116" class="c">  --template benchmarking</text>
  <text x="32" y="130" class="c">  --env MLX_MAX_OPS_PER_BUFFER=0</text>
  <text x="32" y="144" class="c">  --launch -- python trace.py run</text>
  <text x="32" y="164" class="m">warm-up, 2 s pause, then N passes</text>

  <rect x="252" y="62" width="216" height="118" rx="8" class="box"/>
  <text x="264" y="82" class="k">2 · ONE OP, ONE BUFFER</text>
  <text x="264" y="102">MLX commits a command buffer</text>
  <text x="264" y="116">once it holds more ops than the</text>
  <text x="264" y="130">limit; at 0, each op is alone.</text>
  <text x="264" y="150" class="m">a 500-token pass: 378 buffers,</text>
  <text x="264" y="164" class="m">150 ms either way</text>

  <rect x="484" y="62" width="216" height="118" rx="8" class="box"/>
  <text x="496" y="82" class="k">3 · THE TEMPLATE</text>
  <text x="496" y="102">Metal System Trace, saved from</text>
  <text x="496" y="116">Instruments: Metal Application</text>
  <text x="496" y="130">→ Enable Shader Timeline</text>
  <text x="496" y="150" class="m">xctrace has no flag for it:</text>
  <text x="496" y="164" class="m">--show-recording-options omits it</text>

  <path d="M236 121 H252" class="ln" marker-end="url(#a)"/>
  <path d="M468 121 H484" class="ln" marker-end="url(#a)"/>
  <path d="M360 180 V202" class="ln" marker-end="url(#a)"/>

  <rect x="20" y="204" width="680" height="22" rx="4" class="box"/>
  <text x="32" y="219" class="c">xcrun xctrace export --input gpu.trace --xpath '/trace-toc/run[@number="1"]/data/table[@schema="…"]'</text>

  <rect x="20" y="240" width="330" height="76" rx="8" class="data"/>
  <text x="32" y="260" class="h">metal-gpu-intervals</text>
  <text x="32" y="277">start and duration of every command</text>
  <text x="32" y="291">buffer on the GPU: exact, but unnamed</text>
  <text x="32" y="307" class="m">"Command Buffer 0:Compute Command 0"</text>

  <rect x="370" y="240" width="330" height="76" rx="8" class="data"/>
  <text x="382" y="260" class="h">metal-shader-profiler-intervals</text>
  <text x="382" y="277">which shader ran when, by name, but</text>
  <text x="382" y="291">sampled: ~70% of buffers get a name</text>
  <text x="382" y="307" class="m">"steel_gemm_fused_nax_nt_bfloat16_…"</text>

  <path d="M185 316 V338" class="ln" marker-end="url(#a)"/>
  <path d="M535 316 V338" class="ln" marker-end="url(#a)"/>

  <rect x="20" y="340" width="680" height="62" rx="8" class="box"/>
  <text x="32" y="360" class="k">4 · NAME BY PLACE</text>
  <text x="32" y="378">Every layer runs the same ops in the same order. A buffer's step is its place after that</text>
  <text x="32" y="392">layer's attention kernel, named by what most layers' buffers at that place were.</text>
  <path d="M360 402 V420" class="ln" marker-end="url(#a)"/>

  <rect x="20" y="422" width="680" height="24" rx="6" class="out"/>
  <text x="32" y="438" class="h">time per step, TFLOPS per matmul, GPU busy %, a flame graph and a timeline per request shape</text>
</svg>
