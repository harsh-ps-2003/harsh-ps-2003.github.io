<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">d1-3B's matmuls: MLX against the tuned tile, by rows</title>
  <desc id="desc">Four small charts, one per matrix of d1-3B (gate/up 21504 by 2048, down 2048 by 10752, the convolutions' input 6144 by 2048, out 2048 by 2048), TFLOPS against rows from 8 to 4,096 on a log scale: MLX's matmul and the best tile the tuner found. Up to 64 rows both follow the memory bandwidth line, level with each other; from 96 to a few hundred rows MLX falls behind (its thin kernel stops at 64 rows) and the best tiles are up to 1.4 times faster; from about a thousand rows the two are within a few percent near 28 to 32 TFLOPS, except down, where the tile keeps 5 to 16%.</desc>
