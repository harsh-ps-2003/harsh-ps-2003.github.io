<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">One inference engine, two ways to execute it</title>
  <desc id="desc">Request rendering, model structure, cache ownership and scoring remain shared. A backend boundary preserves the M5 Metal kernels and gives other hardware a public MLX path. MLX dispatches the portable path to Apple Metal or NVIDIA CUDA. Measurements here cover only the M5 Pro.</desc>
  <style>
    text { fill: #232333; font-size: 11px; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 12px; font-weight: 700; }
    .m { fill: #5c5c6e; font-size: 10.5px; }
    .k { fill: #ff5f1f; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .box { fill: #e3eefb; stroke: #7aa7d9; stroke-width: 1; }
    .line { fill: none; stroke: #5c5c6e; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c5c6e"/></marker></defs>
  <text x="20" y="28" class="t">One engine, two ways to execute it</text>
  <text x="20" y="49" class="m">Keep the model and request semantics shared; isolate the hardware operations.</text>
  <rect x="110" y="70" width="500" height="86" rx="5" class="box"/>
  <text x="360" y="94" class="h" text-anchor="middle">SHARED INFERENCE</text>
  <text x="360" y="117" text-anchor="middle">Complete prompts · prefix tree · chunk schedule</text>
  <text x="360" y="139" text-anchor="middle">KV storage · Core / Dot model · label readouts</text>
  <path d="M360 156 V180 H183 V209" class="line"/>
  <path d="M360 180 H537 V209" class="line"/>
  <rect x="23" y="212" width="320" height="103" rx="5" fill="#fff0e9" stroke="#ff5f1f"/>
  <text x="183" y="236" class="k" text-anchor="middle">TUNED M5 BACKEND</text>
  <text x="183" y="260" text-anchor="middle">Existing Metal tensor kernels</text>
  <text x="183" y="279" text-anchor="middle">Tile tables and fused operations</text>
  <text x="183" y="298" text-anchor="middle">Apple wired-memory policy</text>
  <rect x="377" y="212" width="320" height="103" rx="5" class="box"/>
  <text x="537" y="236" class="k" text-anchor="middle">PORTABLE BACKEND</text>
  <text x="537" y="260" text-anchor="middle">Public MLX operations</text>
  <text x="537" y="279" text-anchor="middle">Matmul · attention · RoPE · norm</text>
  <text x="537" y="298" text-anchor="middle">MLX manages device memory</text>
  <path d="M183 315 V342" class="line"/>
  <path d="M537 315 V327 H456 V342" class="line"/>
  <path d="M537 327 H620 V342" class="line"/>
  <text x="183" y="363" class="h" text-anchor="middle">M5 Metal</text>
  <text x="456" y="363" class="h" text-anchor="middle">Apple Metal</text>
  <text x="620" y="363" class="h" text-anchor="middle">NVIDIA CUDA</text>
  <line x1="20" y1="387" x2="700" y2="387" stroke="#7aa7d9"/>
  <text x="20" y="409" class="m">Measured here: both engine backends on one M5 Pro.</text>
  <text x="20" y="427" class="m">Still to validate on hardware: older Apple GPUs and NVIDIA.</text>
</svg>
