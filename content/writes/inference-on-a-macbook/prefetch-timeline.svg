<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">Why a few-row matmul waits, and how prefetching hides it</title>
  <desc id="desc">Two timelines of one SIMD group's loop over K. In MLX's loop each tensor op waits for its own load and the next load starts only after the op, so the loads' latency adds up. With prefetching the next slice is loaded into a second pair of register tiles while the current one is multiplied, so the loads overlap the ops. With thousands of rows other SIMD groups hide the waits; with a few dozen there are too few, and prefetching is what hides them, for the same products bit for bit and 1.12 to 1.45 times faster matmuls at 16 to 285 rows.</desc>
  <style>text { fill: #232333; font-size: 10.5px; } .t { font-size: 15px; font-weight: 700; } .h { font-size: 11.5px; font-weight: 700; } .b { font-weight: 700; } .m { fill: #5c5c6e; font-size: 9.8px; } .tag { fill: #c2410c; font-size: 9.8px; } .grid { stroke: #e9e9ef; stroke-width: 1; }</style>
  <text x="20" y="28" class="t">A few-row matmul waits on memory; prefetching hides the wait</text>
  <text x="20" y="46" class="m">one SIMD group's K loop over time; blue is a load in flight, orange the tensor op that needs it</text>
  <text x="20" y="93" class="b">MLX's loop</text>
  <rect x="200" y="80" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <text x="235.0" y="93" class="m" text-anchor="middle">load 0</text>
  <rect x="272" y="80" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <text x="289.0" y="93" class="m" text-anchor="middle">op 0</text>
  <rect x="308" y="80" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <text x="343.0" y="93" class="m" text-anchor="middle">load 1</text>
  <rect x="380" y="80" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <text x="397.0" y="93" class="m" text-anchor="middle">op 1</text>
  <rect x="416" y="80" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <text x="451.0" y="93" class="m" text-anchor="middle">load 2</text>
  <rect x="488" y="80" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <text x="505.0" y="93" class="m" text-anchor="middle">op 2</text>
  <rect x="524" y="80" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/>
  <text x="559.0" y="93" class="m" text-anchor="middle">load 3</text>
  <rect x="596" y="80" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/>
  <text x="613.0" y="93" class="m" text-anchor="middle">op 3</text>
  <text x="200" y="118" class="m">every op waits for its own load, and the next load</text>
  <text x="200" y="131" class="m">only starts once the op is done</text>
  <text x="20" y="163" class="b">prefetching</text>
  <rect x="272" y="150" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/><text x="289" y="163" class="m" text-anchor="middle">op 0</text>
  <rect x="344" y="150" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/><text x="361" y="163" class="m" text-anchor="middle">op 1</text>
  <rect x="416" y="150" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/><text x="433" y="163" class="m" text-anchor="middle">op 2</text>
  <rect x="488" y="150" width="34" height="18" rx="2" fill="#ffe9df" stroke="#ff5f1f"/><text x="505" y="163" class="m" text-anchor="middle">op 3</text>
  <rect x="200" y="172" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/><text x="235" y="185" class="m" text-anchor="middle">load 0</text>
  <rect x="272" y="172" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/><text x="307" y="185" class="m" text-anchor="middle">load 1</text>
  <rect x="344" y="172" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/><text x="379" y="185" class="m" text-anchor="middle">load 2</text>
  <rect x="416" y="172" width="70" height="18" rx="2" fill="#e6eef8" stroke="#4a7fc1"/><text x="451" y="185" class="m" text-anchor="middle">load 3</text>
  <text x="200" y="208" class="m">the next slice loads into a second pair of register</text>
  <text x="200" y="221" class="m">tiles while the current one is multiplied</text>
  <line x1="200" y1="236" x2="634" y2="236" stroke="#5c5c6e"/><text x="634" y="250" class="m" text-anchor="end">time</text>
  <text x="20" y="274" class="m">With thousands of rows, many SIMD groups per core take turns and hide each other's loads,</text>
  <text x="20" y="288" class="m">so the first lane is fine. With a few dozen rows there are too few of them, and the wait</text>
  <text x="20" y="302" class="m">has to be hidden inside each one. Same slices in the same order, so the same products</text>
  <text x="20" y="316" class="m">bit for bit: 1.12 to 1.45 times faster matmuls at 16 to 285 rows.</text>
</svg>
