<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" role="img" aria-labelledby="title desc" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title id="title">The rounding boundaries are part of the computation</title>
  <desc id="desc">Residual addition must round to BF16 before normalization. Statistics and normalization weighting then stay in FP32 until the final BF16 activation cast. Core normalizes two groups; Dot normalizes one. SwiGLU likewise keeps SiLU and multiplication in FP32 until its final BF16 cast.</desc>
  <style>
    text { fill: #232333; font-size: 11px; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 12px; font-weight: 700; }
    .m { fill: #5c5c6e; font-size: 10.5px; }
    .k { fill: #ff5f1f; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .fp { fill: #e3eefb; stroke: #7aa7d9; }
    .round { fill: #fff0e9; stroke: #ff5f1f; }
    .line { fill: none; stroke: #5c5c6e; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5c5c6e"/></marker></defs>
  <text x="20" y="28" class="t">The rounding boundaries are part of the computation</text>
  <text x="20" y="51" class="m">Same weights and formula do not guarantee the same floating-point result.</text>
  <text x="20" y="87" class="k">RESIDUAL + NORMALIZATION</text>
  <rect x="20" y="103" width="117" height="68" rx="4" class="round"/>
  <text x="78" y="127" class="h" text-anchor="middle">x + delta</text>
  <text x="78" y="149" text-anchor="middle">round BF16</text>
  <path d="M137 137 H165" class="line"/>
  <rect x="168" y="103" width="370" height="68" rx="4" class="fp"/>
  <text x="353" y="127" class="h" text-anchor="middle">FP32 statistics and weighting</text>
  <text x="353" y="149" text-anchor="middle">x / sqrt(mean(x²) + eps) × weight</text>
  <path d="M538 137 H566" class="line"/>
  <rect x="569" y="103" width="131" height="68" rx="4" class="round"/>
  <text x="634" y="127" class="h" text-anchor="middle">final cast</text>
  <text x="634" y="149" text-anchor="middle">BF16</text>
  <text x="20" y="195" class="m">Core: two groups, explicit formula. Dot: one group, weighted library RMSNorm.</text>
  <text x="20" y="214" class="m">The residual cast stays outside the compiled normalization function.</text>
  <line x1="20" y1="233" x2="700" y2="233" stroke="#7aa7d9"/>
  <text x="20" y="261" class="k">THE EARLIER PORTABLE SWIGLU FIX</text>
  <rect x="20" y="279" width="117" height="64" rx="4" class="round"/>
  <text x="78" y="303" class="h" text-anchor="middle">gate, up</text>
  <text x="78" y="325" text-anchor="middle">BF16 inputs</text>
  <path d="M137 311 H165" class="line"/>
  <rect x="168" y="279" width="370" height="64" rx="4" class="fp"/>
  <text x="353" y="303" class="h" text-anchor="middle">FP32 SiLU(gate) × up</text>
  <text x="353" y="325" text-anchor="middle">Keep the intermediate product in FP32</text>
  <path d="M538 311 H566" class="line"/>
  <rect x="569" y="279" width="131" height="64" rx="4" class="round"/>
  <text x="634" y="303" class="h" text-anchor="middle">final cast</text>
  <text x="634" y="325" text-anchor="middle">BF16</text>
  <text x="20" y="375" class="m">Both changes are in the portable path. The tuned M5 operations stay intact.</text>
</svg>
