<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="title" content="{% block meta_title %}{{ config.title }}{% endblock meta_title %}">
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <meta name="author" content="{{ config.extra.author }}">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
    <meta property="og:url" content="{% block og_url %}{{ config.base_url }}{% endblock og_url %}">
    <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
    <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
    <meta property="og:site_name" content="{{ config.title }}">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@harsh_ps_2003">
    <meta name="twitter:creator" content="@harsh_ps_2003">
    <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }}{% endblock twitter_title %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ config.description }}{% endblock twitter_description %}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{% block canonical %}{{ config.base_url }}{% endblock canonical %}">
    
    <!-- Feeds -->
    <link rel="alternate" type="application/atom+xml" title="Atom Feed" href="{{ get_url(path='atom.xml') }}">
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="{{ get_url(path='rss.xml') }}">
    
    <!-- Favicon -->
    <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
    <script src="{{ get_url(path='js/theme.js') }}"></script>
    <script src="{{ get_url(path='js/code-blocks.js') }}" defer></script>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "{{ config.title }}",
        "description": "{{ config.description }}",
        "url": "{{ config.base_url }}",
        "author": {
            "@type": "Person",
            "name": "{{ config.extra.author }}",
            "url": "{{ config.base_url }}",
            "sameAs": [
                "https://github.com/harsh-ps-2003",
                "https://twitter.com/harsh_ps_2003",
                "https://linkedin.com/in/harsh-ps-2003"
            ]
        },
        "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ config.base_url }}/writes/?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    {% block structured_data %}{% endblock structured_data %}
</head>
<body>
    <header>
        <a class="title" href="{{ config.base_url }}">
            <h1>{{ config.title }}</h1>
        </a>
        <nav>
            {% for item in config.extra.main_menu %}
                <a href="{{ item.url | safe }}">{{ item.name }}</a>
            {% endfor %}
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                <span id="theme-icon">dark</span>
            </button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
    </footer>

    {% block scripts %}{% endblock scripts %}
</body>
</html>
