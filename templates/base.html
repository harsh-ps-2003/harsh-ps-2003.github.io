<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="title" content="{% block meta_title %}{{ config.title }}{% endblock meta_title %}">
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <meta name="author" content="{{ config.extra.author }}">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}">
    <meta property="og:url" content="{% block og_url %}{{ config.base_url }}{% endblock og_url %}">
    <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
    <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
    <meta property="og:site_name" content="{{ config.title }}">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@harsh_ps2003">
    <meta name="twitter:creator" content="@harsh_ps2003">
    <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }}{% endblock twitter_title %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ config.description }}{% endblock twitter_description %}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{% block canonical %}{{ config.base_url }}{% endblock canonical %}">
    
    <!-- Feeds -->
    <link rel="alternate" type="application/atom+xml" title="Atom Feed" href="{{ get_url(path='atom.xml') }}">
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="{{ get_url(path='rss.xml') }}">
    
    <!-- Favicon -->
    <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
    <!-- Syntax highlighting - light theme enabled by default, dark disabled -->
    <link id="giallo-light" rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}">
    <link id="giallo-dark" rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" disabled>
    <script src="{{ get_url(path='js/theme.js') }}"></script>
    <script src="{{ get_url(path='js/code-blocks.js') }}" defer></script>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "{{ config.title }}",
        "description": "{{ config.description }}",
        "url": "{{ config.base_url }}",
        "author": {
            "@type": "Person",
            "name": "{{ config.extra.author }}",
            "url": "{{ config.base_url }}",
            "sameAs": [
                "https://github.com/harsh-ps-2003",
                "https://x.com/harsh_ps2003",
                "https://www.linkedin.com/in/harshps2003/"
            ]
        },
        "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ config.base_url }}/writes/?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    {% block structured_data %}{% endblock structured_data %}
</head>
<body>
    <header>
        <a class="title" href="{{ config.base_url }}">
            <h1>{{ config.title }}</h1>
        </a>
        <nav>
            {% for item in config.extra.main_menu %}
                <a href="{{ item.url | safe }}">{{ item.name }}</a>
            {% endfor %}
            <span class="socials">
                <a href="https://www.linkedin.com/in/harshps2003/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.27V1.73C24 .77 23.2 0 22.23 0z"/></svg><span class="visually-hidden">LinkedIn</span></a>
                <a href="https://github.com/harsh-ps-2003" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3C5.37.3 0 5.67 0 12.3c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.28-.01-1.04-.02-2.04-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.22.69.83.57A12.02 12.02 0 0 0 24 12.3C24 5.67 18.63.3 12 .3z"/></svg><span class="visually-hidden">GitHub</span></a>
                <a href="https://x.com/harsh_ps2003" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.68l7.73-8.84L1.25 2.25h6.83l4.71 6.23zm-1.16 17.52h1.83L7.08 4.13H5.12z"/></svg><span class="visually-hidden">X</span></a>
                <a href="mailto:harshpratapsingh8210@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M3 5.4h18a1.4 1.4 0 0 1 1.4 1.4v10.4a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4V6.8A1.4 1.4 0 0 1 3 5.4zm.4 2.2 8.6 5.2 8.6-5.2v1.6L12 14.4 3.4 9.2V7.6z"/></svg><span class="visually-hidden">Email</span></a>
            </span>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                <span id="theme-icon">☾</span>
            </button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <span class="view-counter">
            ԅ(≖‿≖ԅ) <span id="view-count">...</span>
        </span>
    </footer>

    <script>
    (function() {
        const namespace = 'harsh-ps-2003';
        let path = window.location.pathname;
        // Normalize: ensure trailing slash for consistent matching
        if (!path.endsWith('/')) path += '/';
        const key = path.replace(/\//g, '-') || 'home';
        
        // Page offsets for initial counts
        const offsets = {
            '/': 842,
            '/writes/': 692,
            '/reads/': 689,
            '/resume/': 804,
            // Blog posts - dated permalinks
            '/writes/2026-07-09-missing-writing-go/': 11,
            '/writes/2026-07-18-all-sorts-of-famous-attention-layers/': 35,
            '/writes/2026-05-30-i-should-have-paid-a-closer-look-at-tokenizer/': 89,
            '/writes/2026-04-23-cutting-that-inference-cost/': 119,
            '/writes/2026-04-16-some-insights-on-hnsw/': 65,
            '/writes/2026-04-11-pubgrub-for-dependency-resolution/': 43,
            '/writes/2026-03-19-the-longer-you-chat-the-worse-your-agents-response/': 297,
            '/writes/2026-02-26-db-joins-on-gpus/': 28,
            '/writes/2026-02-22-which-prompts-actually-work-for-your-agents/': 185,
            '/writes/2026-01-02-the-chronicles-of-training-fbpinns/': 389,
            '/writes/2025-05-23-istio-lfx/': 139,
            '/writes/2025-01-13-do-i-officially-qualify-as-a-software-engineer/': 188,
            '/writes/2024-11-26-building/': 206,
            '/writes/2024-10-25-working-at-a-early-stage-startup/': 177,
            '/writes/2024-07-31-nix/': 239,
            '/writes/2024-07-12-sob/': 62
        };
        const offset = offsets[path] || 0;
        
        // Skip API call on localhost but show preview
        if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
            document.getElementById('view-count').innerText = offset || '∞';
            return;
        }
        
        // Using countapi.mileshilliard.com (drop-in replacement for defunct countapi.xyz)
        // No namespaces - fold namespace and key into one unique key
        const uniqueKey = namespace + '-' + key;
        fetch('https://countapi.mileshilliard.com/api/v1/hit/' + uniqueKey)
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('view-count');
                let count = (parseInt(data.value) || 1) + offset;
                if (el) el.innerText = count;
            })
            .catch(() => {
                const el = document.getElementById('view-count');
                if (el) el.innerText = offset || '?';
            });
    })();
    </script>

    <script>
        window.ZOLA_SEARCH = {
            elasticlunrUrl: "{{ get_url(path='elasticlunr.min.js') }}",
            indexUrl: "{{ get_url(path='search_index.en.js') }}"
        };
    </script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
