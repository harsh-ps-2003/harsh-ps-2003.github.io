{% extends "base.html" %}

{% block title %}Tags | {{ config.title }}{% endblock title %}

{% block content %}
<h1>Tags</h1>

<ul class="blog-posts">
    {% for term in terms %}
    <li>
        <a href="{{ term.permalink }}">#{{ term.name }}</a>
        <span>({{ term.pages | length }})</span>
    </li>
    {% endfor %}
</ul>
{% endblock content %}
