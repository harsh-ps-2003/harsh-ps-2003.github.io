{% extends "base.html" %}

{% block title %}#{{ term.name }} | {{ config.title }}{% endblock title %}

{% block content %}
<h1>#{{ term.name }}</h1>

<ul class="blog-posts">
    {% for page in term.pages %}
    <li>
        <span>{{ page.date | date(format="%d %b, %Y") }}</span>
        <a href="{{ page.permalink }}">{{ page.title }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock content %}
